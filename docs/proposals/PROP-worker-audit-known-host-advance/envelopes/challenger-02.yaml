summary: 'round 2; Two P1s and two P3s: the committer-time filter can drop an escape because committer times do not follow ancestry here; the integrated-source accounting credits an escape carried by a base merge (recurs challenger-01 #2); PADR lacks supersedes; one warning per run and dirty-entry shape unspecified.'
findings:
- issue: The committer-time filter (>= <accepted>'s committer time) can drop a worker escape, because committer times in this repository do not follow ancestry
  evidence: proposal.md:71-76 and WAH-02; PADR:59-62,84-85; materials:69-71. Audit base fdba6646 is dated 18:05:25 +0900 while its descendants 650b0fb9..89e7b216 are dated 17:37:52-17:43:33; the reflog shows commits amended to skewed times; 33 child-before-parent pairs in the last 300 main commits
  failure_condition: 'An escape E committed at wall-clock time earlier than <accepted>''s skewed committer time is filtered out: no entry, no warning, and nothing else audits E after the sibling lands.'
  suggested_action: Drop the time filter; derive the window from topology only (git rev-list --no-merges <base HEAD> --not <returned>); rewrite WAH-02 and remove the clock assumption.
  resolution: open
  severity: P1
- issue: 'recurs: challenger-01.yaml #2; the accounting rule ''integrated a source that contains it'' credits an escape that spec-integrate''s base merge carried into another unit''s branch to the Host'
  evidence: proposal.md:88-92; PADR:66-68; materials:77-78; packages/devkit-spec/src/devkit_spec/bundles/spec/bundle/skills/spec-integrate/SKILL.md.jinja:29; PROP-integration-merge-moved-target settled direction
  failure_condition: E lands on main; the Host merges main into dev-Y and integrates Y; is-ancestor E <dev-Y head> is true, so the Host accounts E as its own and accepts.
  suggested_action: Account a commit only when it is in the integrated source's own range (reachable from the source head and not from the pre-integration target).
  resolution: open
  severity: P1
- issue: The PADR has no supersedes link, and handoff promotes its frontmatter as is
  evidence: PADR:1-8; packages/devkit-spec/src/devkit_spec/features/proposals/usecases/handoff.py:12-13; docs/decisions/2026-10/20261022-orchestration-workers.md:6-12
  failure_condition: The promoted ADR carries no supersedes edge, so refs and the viewer still show the equality clauses as in force.
  suggested_action: Optional. Add supersedes with the alias of the superseded clause to the PADR frontmatter.
  resolution: open
  severity: P3
- issue: One warning per entry or per run, and the shape of a dirty entry, are unspecified
  evidence: proposal.md:77-81,85,109; docs/capabilities/advisory/CAP-ADV-agent-advisory-protocol.md section 8 (one advisory per condition)
  failure_condition: One warning per entry breaks CAP-ADV section 8; WAH-03 and the field description can fix different dirty-entry shapes.
  suggested_action: Optional. One SPEC_WORKER_BASE_OVERLAP per run naming every in-scope path in [TARGET]; one dirty entry listing all in-scope dirty paths.
  resolution: open
  severity: P3
