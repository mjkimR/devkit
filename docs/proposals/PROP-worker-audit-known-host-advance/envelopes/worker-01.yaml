questions:
- id: base-observation
  title: Replace the base-checkout equality
  prompt: Which way should worker validation stop requiring an unchanged base checkout, and is the remaining hidden case acceptable?
  context: 'Decides the whole design and the restated GOP-08 (challenger-01 finding 4). The equality exists to catch a worker writing into the base checkout through the wrong cwd; it also stops on every Host integration and every other session''s commit, which serialized integrations in the consumer pilot. Without it, existing checks plus one new Host condition (the returned head must add this turn''s worker envelope) catch a full escape, and handoff and integration refuse a dirty base. One case stays unnamed under option a: a partial committed escape (some worker commits land on main through the wrong cwd). If its content passes CI, nobody reviews or attributes it, so it stays hidden. It needs several commands of one turn to miss the worktree cwd; none has been observed. Two review rounds showed the derived overlap warning (option c) either drops escapes, because committer times in this repository do not follow ancestry, or makes the Host or user account for other units'' commits every turn.'
  options:
  - id: a
    description: Drop the equality and its pre-spawn record; add the turn's-own-envelope condition; accept the partial committed escape as a stated exception. Docs and one contract test, no code (size S). If such an escape is ever observed, a preventive commit-gate check refusing base-checkout commits on an active unit's paths is the follow-up.
    recommended: true
  - id: b
    description: Option a, and Planning also files a follow-up draft now for that preventive commit-gate check, so the hidden case is closed without waiting for an observation (adds a separate proposal touching the commit gate and the scope registry).
    recommended: false
  - id: c
    description: 'Derived scope-overlap warning in devkit spec worker inspect: list base commits not yet in the worker branch and base dirty paths that touch the write scope; the Host accounts for each, and the user confirms other sessions'' commits. Names in-scope partial escapes, but repeats other units'' commits on shared boundaries every turn (size M, code and tests).'
    recommended: false
  - id: d
    description: 'Declared Host advance: the Host records the base HEAD before spawning and declares each integration it makes; any other base advance stops validation. Names every escape, but adds a record per integration and still stops on another session''s commit, as on 2026-10-30.'
    recommended: false
  allow_note: true
