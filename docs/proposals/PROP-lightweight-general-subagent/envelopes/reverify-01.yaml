- issue: 'Decision needed: the devkit bundle is limited to distribution guidance; a subagent asset breaks an accepted MUST the planned PADR does not supersede'
  evidence: docs/decisions/2026-11/20261102-package-ownership-and-release-version.md:330-335 (devkit bundle MUST keep only distribution guidance; only preset core); packages/devkit-dist/tests/integration/features/distribution/test_guide_bundle.py:33-39 asserts instruction-only assets
  failure_condition: Adding role-worker to the devkit core preset contradicts ADR-package-ownership-and-release-version without supersession and fails test_guide_bundle.
  suggested_action: 'Decision needed: supersede that clause in part and update the test, or ship role-worker in a separate auto-selected devkit-dist bundle.'
  resolution: open
  severity: P1
- issue: 'Decision needed: design-explore is an omitted role-file caller'
  evidence: packages/devkit-catalog/src/devkit_catalog/design_explore/bundle/skills/design-explore/references/orchestration.md:9 passes a role path to a general child; CAP-DLV-design-exploration.md:110; proposal.md lists only two other callers
  failure_condition: roles.md directs skill-local roles to role-worker while design-explore keeps general children; the affected-document list is incomplete.
  suggested_action: Add design-explore and CAP-DLV-design-exploration to callers and owns, or exclude it explicitly.
  resolution: open
  severity: P1
- issue: No fallback leaves callers pointing at a missing agent under opt-out or an unsupported host
  evidence: proposal.md no-fallback clause; test_config_template.py:321 devkit False; CAP-DIST-agent-projections.md:122 unsupported host blocks emit no file
  failure_condition: With devkit = false, narrowed agents or an unsupported host block, callers spawn a non-existent type with no defined recovery.
  suggested_action: Require native or emulated status for all three hosts and have callers stop with a stated cause when role-worker is missing.
  resolution: resolved
  severity: P2
