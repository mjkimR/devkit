questions:
- id: q1
  title: Direction and compaction model
  prompt: Which direction should this proposal take for ADR compaction?
  context: 'The review found the ledger''s measured problem is unchecked supersession: five replaced ADRs still say accepted, so agents read them as current. That check is now in scope under every option. Aliases only help when old ADR files are deleted; if old files are kept as tombstones, the existing superseded fields already redirect and aliases add nothing. This choice sets the size of Development and whether the append-only ADR rule is amended.'
  options:
  - id: a
    description: 'Supersession integrity plus delete-based compaction: ADR-only aliases, old files removed (Git keeps them), the append-only rule amended in a new PADR and in the five documents that state it.'
    recommended: true
  - id: b
    description: 'Supersession integrity only: fix and check supersedes/superseded_by and the drifted records; aliases and compaction move to a later proposal if a measured need appears. Smallest change.'
    recommended: false
  - id: c
    description: 'Supersession integrity plus tombstone compaction: a consolidated ADR supersedes the chain, old files stay with status superseded, no aliases field and no append-only amendment.'
    recommended: false
  allow_note: true
- id: q2
  title: Playbook aliases out of scope
  prompt: Should the playbook-alias question (harmonize or deprecate the search aliases of playbooks) leave this proposal?
  context: Playbook aliases are search keywords in devkit-dist and its CAP-DIST contract, both outside this proposal's boundaries, and they mean something different from document ID aliases. Keeping the question would require widening the boundaries to devkit-dist.
  options:
  - id: a
    description: Remove it from this proposal; it can become a separate draft proposal for devkit-dist.
    recommended: true
  - id: b
    description: 'Keep it: widen the boundaries to the devkit-dist playbook files and CAP-DIST-context-and-playbooks, and decide it in this Planning.'
    recommended: false
  allow_note: true
- id: q3
  title: Compact a real ADR chain
  prompt: Should Development compact one real chain of the ledger as the acceptance demonstration?
  context: Synthetic fixtures prove the mechanism but not that the procedure reduces reading cost. The candidate is approval-gates-intent-direction-integration -> integration-approval-asserted -> policy-authorized-local-integration. If q1 is b, this question lapses; if q1 is c, the old files stay as tombstones.
  options:
  - id: a
    description: 'Yes: compact that chain in Development, retarget references and check the result with rules check and spec resolve.'
    recommended: true
  - id: b
    description: 'No: fixtures only; real compaction happens later as a separate, gated change.'
    recommended: false
  allow_note: true
