summary: 'round 2 on the narrowed aliases direction: holds, size L and dev_effort medium fit; 8 findings (0 P1, 5 P2, 3 P3): ADR aliases conflict with the append-only ledger, rules fix would rewrite deliberate old-ID mentions, the call-site list is incomplete, collision behaviour undefined, owns misses the receipt; q1 recommends a previous asset ID resolved by playbook get.'
findings:
- issue: ADR is an allowed alias kind, but the append-only ledger forbids both ways to give an ADR an alias (changing an approved ID or deleting the old file), and the handoff alias-clash check exists only for ADR aliases.
  evidence: docs/decisions/README.md:3; spec-sync/SKILL.md:21; instructions/living-spec-writing.md:12; PADR-document-id-aliases.md uniqueness and drivers; answer-01.yaml q3
  failure_condition: The first ADR alias edits or deletes an approved ADR and is flagged by reconcile or spec-sync.
  suggested_action: Remove ADR from the alias kinds and drop the handoff alias-clash check and its test.
  resolution: open
  severity: P2
- issue: devkit rules fix would rewrite deliberate mentions of a retired ID (the rename's own PADR/ADR, self-mentions), and aliases entries are not stated to be non-references.
  evidence: parse.py:135-157; documents/repositories/index.py:117-125 (ADRs never historical); document_reference.py:301-325; models/model.py:11-14
  failure_condition: After a rename the graduated ADR naming the old ID fails rules-check and the fix changes its meaning.
  suggested_action: Alias references in decision records resolve silently and are never rewritten; aliases entries are not references; test byte-identity and self-mention.
  resolution: open
  severity: P2
- issue: The call-site list misses exact-ID comparisons and does not say whether resolve() itself becomes alias-aware.
  evidence: entrypoints/usecases/derive.py:82; governance/usecases/hygiene.py:75; document_reference.py:139-161; documents/services/dependencies.py:29; traceability_link.py:63-64; documents/usecases/browse.py:229,267; document_reference.py:288
  failure_condition: An alias in depends_on, milestone, a reverse traceability field, an entrypoints target or a glossary Owner is reported falsely or skipped.
  suggested_action: One canonical(target) mapping on DocumentIndex used by resolve, incoming, cycle graphs, hygiene, traceability and refs grouping; audit by_id, .resolve( and == .id; add the listed tests.
  resolution: open
  severity: P2
- issue: Lookup and fix behaviour on an alias collision is undefined.
  evidence: PADR-document-id-aliases.md uniqueness; document_reference.py:52; proposals/services/rewrite.py:229-233
  failure_condition: A new document reusing a retired ID either loses its references to the alias owner or silently kills the alias.
  suggested_action: A declared ID always wins; an alias resolves only when exactly one document declares it and none has it as ID; otherwise the duplicate is reported and the fix leaves the reference.
  resolution: open
  severity: P2
- issue: boundaries.owns misses the tracked receipt (and the delivery capability if the handoff clash check stays).
  evidence: .devkit/installation.json lines 30-40, 925-927; CAP-DLV-proposal-incubation.md:69,526
  failure_condition: Development writes outside owns or leaves the receipt stale.
  suggested_action: Add .devkit/installation.json to owns; CAP-DLV-proposal-incubation only if the handoff check survives.
  resolution: open
  severity: P2
- issue: 'Decision needed: what a playbook alias identifies (q1).'
