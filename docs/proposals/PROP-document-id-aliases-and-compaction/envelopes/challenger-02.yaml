  failure_condition: An identifier field nothing reads, or an override that adds a colliding alias with undefined get behaviour.
  suggested_action: 'Decision needed: (a) a previous asset ID in the same bundle resolved by playbook get, exact ID first, unique among effective headers or refused with a stable code; (c) if no rename is expected; not (b).'
