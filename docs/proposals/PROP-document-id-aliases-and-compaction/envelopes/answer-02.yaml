answers:
- question: q1
  choice: a
  decision: A playbook alias is a previous asset ID in the same bundle; devkit playbook get <bundle>/<alias> resolves it and reports the canonical id and the alias used, an exact asset ID always wins, and an alias declared by more than one effective playbook (overrides included) is refused with a stable code.
  constraints:
  - The CAP-DIST statement that playbook get does no alias lookup and no fallback changes accordingly.
