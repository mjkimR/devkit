questions:
- id: q1
  title: What a playbook alias identifies
  prompt: Playbook aliases become identifiers instead of search keywords. What should a playbook alias identify, and should devkit playbook get resolve it?
  context: Playbooks are retrieved by an exact <bundle>/<playbook> selector whose second part is the manifest asset ID (not the frontmatter name), and published instructions cite such selectors. Once aliases stop feeding search, an alias is only useful if something resolves it. This decides the playbook validation, the get command and the CAP-DIST retrieval contract (which today says get does no alias lookup and no fallback).
  options:
  - id: a
    description: A previous asset ID in the same bundle (lowercase slug). devkit playbook get <bundle>/<alias> returns the renamed playbook and reports its canonical id and the alias used; an exact asset ID always wins; an alias declared by more than one effective playbook (overrides included) is refused with a stable code. Renames keep published selectors working.
    recommended: true
  - id: b
    description: 'A validated identifier list that no command resolves: aliases are only checked for shape and uniqueness and returned as metadata. Smaller, but the field then has no consumer.'
    recommended: false
  - id: c
    description: 'No playbook aliases: remove the field from the playbook format entirely (an aliases key is refused); a renamed playbook breaks its old selector. Smallest change.'
    recommended: false
  allow_note: true
