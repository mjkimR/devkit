  title: Keep the targeting PADR?
  prompt: Should the uncited-step warning move onto the use case (PADR-ux-coverage-step-targeting), or should that PADR be withdrawn?
  context: Today an uncited step is reported on the first UX document listing the use case, so in a whole-workspace run one navigation panel carries every workflow gap of the use cases it lists (the consumer's 27 step warnings). The PADR reports it on the use case at the step's line when the run targets it, else on the first listing UX document. It is severable from the notation; its cost is that RULE-ux-links and RULE-ux-coverage then target the shared two-document report differently, and a partial supersession of one ADR-ux-screens clause.
  options:
  - id: keep
    description: Keep the PADR; Development implements the use-case-first targeting (AC 7).
    recommended: true
  - id: withdraw
    description: Withdraw the PADR in the fold commit; targeting stays as today and may return as its own proposal.
    recommended: false
