summary: Whole-provider replacement fits; four specification gaps affect refresh and supported inputs.
findings:
- issue: Refresh treats normal editable-install bytecode as an authored local addition.
  evidence: proposal.md:101-104; discovery.py:70; manifest.py:65-67,227-237
  failure_condition: Editable discovery creates __pycache__ and *.pyc, so unexpected-addition checks block ordinary refresh and AC3.
  suggested_action: Exclude only derived __pycache__ and *.pyc from source inventories/drift; retain authored-addition refusal and test refresh after editable discovery.
  resolution: open
  severity: P2
- issue: Refresh does not specify reinstalling changed entry-point metadata.
  evidence: proposal.md:90-99,109-115,152-154; discovery.py:97-103
  failure_condition: Added/removed bundles change generated entry points but installed editable metadata remains stale; normal sync misses additions or loads removed modules.
  suggested_action: Return an explicit reinstall action for packaging metadata changes before sync; explicitly deselect removed selected bundles and test installed add/remove refresh.
  resolution: open
  severity: P2
- issue: Declarative hook handlers escape the specified Python dependency preflight.
  evidence: proposal.md:61-78; CAP-DIST-manifest-spec; packages/devkit-dist/src/devkit_dist/features/host/models/hooks/model.py:17-22,51-65; host/usecases/runner.py:21-37
  failure_condition: A no-dependency content provider can ship a hook referencing a private handler absent from copied files, violating the complete input promise.
  suggested_action: Check declarative runtime references; permit documented required devkit handlers and refuse external handlers before writes; include an external-handler fixture.
  resolution: open
  severity: P2
- issue: The provenance digest definition can become self-referential.
  evidence: proposal.md:90-98
  failure_condition: A full output inventory includes snapshot.json own file hash; omitting only aggregate digest does not remove recursive per-file hash.
  suggested_action: Exclude snapshot.json from payload inventory; hash canonical provenance metadata plus payload inventory excluding aggregate digest, and verify structure/aggregate on refresh.
  resolution: open
  severity: P2
