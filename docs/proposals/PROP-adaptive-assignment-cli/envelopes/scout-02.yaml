summary: 'CLI contract: a distribution mounts a group through one devkit.commands entry point to a click group built on devkit_dist.adapters.cli; codes are domain-prefixed AdvisoryError classes documented under docs/; exit 1 is the negative-result code of ARCH-08-1, and CAP-HARN-command-mount limits only devkit spec and devkit docs to exits 0 and 2. CLI-only is allowed; no generated CLI reference exists.'
findings:
- issue: A plugin group is one entry in the devkit.commands entry-point group whose name is the command name and whose target is a click command; adaptive is neither a built-in nor a harness name. An unmounted group gives click's usage error, exit 2, without an advisory code.
  evidence: packages/devkit-spec/pyproject.toml:23-24; docs/architecture/ARCH-05-3-command-plugins.md:15-25,33-40,47-49; packages/devkit-dist/src/devkit_dist/cli.py:51-81,135-152
  suggested_action: Register adaptive = devkit_adaptive.cli:cli and treat the usage error as the unavailable-command signal in the guidance fallback.
  resolution: open
- issue: 'Text stdout is one-line [KIND: ...] sentinels rendered with field_value; JSON is exactly one compact object with payload keys, collected errors and notices; a failing command prints {error, notices}.'
  evidence: docs/architecture/ARCH-08-1-agent-output.md:44-76; packages/devkit-dist/src/devkit_dist/adapters/cli.py:27-116; packages/devkit-cli/src/devkit_cli/output.py:73-153
  suggested_action: Give every verb a sentinel set and a JSON object with notices; collect verification findings under errors.
  resolution: open
- issue: Exit 1 means the command ran and reports a negative result; CAP-HARN-command-mount section 4.7 says no devkit spec or devkit docs command reports one. devkit adaptive is outside that statement.
  evidence: docs/architecture/ARCH-08-1-agent-output.md:104-106; docs/capabilities/harness/CAP-HARN-command-mount.md:142-147; docs/development/reference/rules.md:84,112-113
  suggested_action: Use exit 1 for a failed verification, as devkit rules check does, and leave CAP-HARN-command-mount unchanged.
  resolution: open
- issue: Codes are UPPER_SNAKE with one owning class (RULE-advisory-unique-code); devkit-spec and devkit-docs enforce documentation of every code with a per-package test, and reference pages carry a code table.
  evidence: docs/capabilities/advisory/CAP-ADV-agent-advisory-protocol.md:23; packages/devkit-spec/tests/integration/package/test_documented_codes.py:13-17; docs/development/reference/worktree.md:54; docs/development/reference/README.md:7-24
  suggested_action: Prefix codes ADAPTIVE_, add a documented-codes test and a reference page with the code table.
  resolution: open
