questions:
- id: q1
  title: Base dependency of devkit-adaptive
  prompt: Should the devkit-adaptive distribution depend on devkit-dist only, or on devkit-agt (the harness)?
  context: This decision is shared with PROP-adaptive-package-extraction, whose Planning examines it for packaging; the Host reconciles both runs. It decides whether the assignment commands may import harness modules and whether installing adaptive development installs the harness wheel. The commands designed here need about five Git calls, a file lock and path checks, all available from devkit_core and devkit_dist; they create no worktree and run no process, so nothing in this unit needs devkit-agt. Neither answer imports devkit_spec, and both keep the rule that the bundle installs without devkit-spec. The comparison is in materials/planning-evidence.md section 7.
  options:
  - id: dist-only
    description: devkit-dist only. Allows installing the bundle and commands without the harness, and keeps the guidance sentence that no harness is assumed. Forbids importing devkit_agt worktree, workflow or rules modules, so a small worktree-list parser and a path-prefix matcher are written in the feature; guidance may still name devkit worktree as the project's own procedure when a harness is installed.
    recommended: true
  - id: devkit-agt
    description: devkit-agt. Allows importing public harness modules and declaring feature edges to the worktree feature, which a later unit could use for worktree lifecycle. Costs the harness wheel on every adaptive installation, an adaptive test suite that depends on devkit-agt, and a rewrite of the guidance that assumes no harness. This unit's design is unchanged under this answer.
    recommended: false
  allow_note: true
- id: q2
  title: Command group name
  prompt: Should the command group be devkit adaptive assignment or devkit adaptive-dev assignment?
  context: CAP-DLV-adaptive-development rule 18 and ADR-adaptive-development-and-research say identifiers and commands use adaptive-dev; the distribution the user chose is devkit-adaptive, and existing groups follow their distribution (devkit spec, devkit docs). The name is a published command surface that guidance, a reference page and the later lifecycle-hook proposal will cite, so it is settled before Development. The bundle is currently written for the first option.
  options:
  - id: adaptive
    description: devkit adaptive assignment. Matches the distribution name and the devkit spec and devkit docs precedent, and is shorter. Rule 18 is narrowed to the approach value, bundle, entry skill and context file, and PADR-adaptive-assignment-commands supersedes that naming clause of the ADR in part.
    recommended: true
  - id: adaptive-dev
    description: devkit adaptive-dev assignment. Keeps rule 18 and the ADR unchanged and matches get-context adaptive-dev and /adaptive-dev. The group name then differs from the distribution name; the next Planning turn renames the group in the bundle and removes the PADR's supersedes entry.
    recommended: false
  allow_note: true
