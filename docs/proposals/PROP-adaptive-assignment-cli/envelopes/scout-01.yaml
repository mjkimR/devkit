  evidence: packages/devkit-core/src/devkit_core/core/git.py:84-88; packages/devkit-spec/src/devkit_spec/features/scope/repositories/collection_git.py:23-29; packages/devkit/src/devkit_agt/features/worktree/repositories/execution.py:24-33
