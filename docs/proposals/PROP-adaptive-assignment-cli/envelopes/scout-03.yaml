summary: 'Reuse with devkit_agt and devkit_docs importable: no public function lists worktrees, parses status or resolves a revision, so those stay in the feature; devkit_docs.utils.paths.covers gives literal containment; DocumentIndex.load(root).resolve(id) resolves a governing ID with DOCS_ID_UNRESOLVED or DOCS_ID_DUPLICATE. RULE-architecture admits a cross-package import only to a feature facade or a public_modules entry, from an allowed layer.'
findings:
- issue: 'RULE-architecture admits a cross-package import only when the target namespace is in the package''s dependencies, the target feature is in feature_dependencies of the importing feature, and the target module is the feature facade or a public_modules entry; modules outside a feature (devkit_core.*, devkit_dist.adapters.*, devkit_docs.utils.*) skip the feature and public checks. Layers: cli may import models, errors, usecases, cli, adapters; usecases may import repositories and services; repositories never usecases.'
  evidence: tools/devkit-dev/src/devkit_dev/bundle/rules/architecture/rule.py:30-40,359-407; tools/devkit-dev/src/devkit_dev/source_index.py:75-84
  suggested_action: Declare devkit_adaptive with dependencies devkit_docs, devkit_agt, devkit_dist, devkit_core and devkit.advisory, and name each reused feature in feature_dependencies.assignment; import DocumentIndex from usecases or services only.
  resolution: open
- issue: No public function lists worktrees or maps a path to a worktree of the repository. The porcelain parser is private (lifecycle._entries, with path, branch, head, prunable, locked); public lifecycle.locate and find are branch-based and resolve activity-branch paths; discover() in devkit_dist.features.shared returns the main checkout and common directory only and requires a checkout top level.
  evidence: packages/devkit/src/devkit_agt/features/worktree/usecases/lifecycle.py:100-106,162-198,1021-1033; packages/devkit-dist/src/devkit_dist/features/shared/repositories/local.py:71-101,126-131; packages/devkit/src/devkit_agt/features/worktree/repositories/execution.py:24-33,62,79-81
  suggested_action: Keep a parser of git worktree list --porcelain -z in the feature; a missing worktree is an absent directory or a prunable record.
  resolution: open
- issue: devkit_core.core exports run_git, run_git_text and is_ancestor; run_git inherits the environment (GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE are not stripped). No public function resolves a revision to a full commit ID or parses git status; the status parser of devkit_agt.features.compact and the hook variable list of the gate feature are not public. The only public helper that strips GIT_* is execution.git, which raises subprocess.CalledProcessError instead of an advisory.
  evidence: packages/devkit-core/src/devkit_core/core/git.py:71-78,117-125,140-142,166-197; packages/devkit-core/src/devkit_core/core/__init__.py:17,58-59; packages/devkit/src/devkit_agt/features/compact/services/porcelain.py:8; packages/devkit/src/devkit_agt/features/gate/usecases/gates/commands.py:43
  suggested_action: Resolve revisions with rev-parse --verify --quiet <rev>^{commit} through run_git_text and write the status parser in the feature.
  resolution: open
- issue: Toplevel lookup without a devkit project is require_git_toplevel (GIT_FAILED, input error, return code 128 outside a work tree) with a usecases wrapper; git_toplevel returns None instead. common_directory raises the MCP-named MCP_WORKSPACE_UNAVAILABLE. A plugin command resolves -w through devkit_dist.adapters.cli.resolve_root, which returns the Git top level of a repository without .devkit/ and refuses a subdirectory given with -w (ARGUMENT_INVALID).
  evidence: packages/devkit-dist/src/devkit_dist/features/project/repositories/project.py:31-70,102-166; packages/devkit-dist/src/devkit_dist/features/project/usecases/workspace.py:16-17; packages/devkit-dist/src/devkit_dist/features/project/repositories/invocation.py:32-37; packages/devkit-dist/src/devkit_dist/adapters/cli.py:119-142
  suggested_action: Use resolve_root in the CLI and git_toplevel inside the use case, mapping None to the feature's own repository error.
  resolution: open
- issue: Literal path containment exists as devkit_docs.utils.paths.covers(ancestor, path) and overlaps(a, b), outside any feature and therefore importable; they do not normalize. match_path in devkit_agt.features.rules.models.settings is a segment-wise glob matcher, public, and unsuited to overlap decisions. normalize_relpath and resolve_within are exported from devkit_core.core (PATH_UNSAFE).
  evidence: packages/devkit-docs/src/devkit_docs/utils/paths.py:17-39; packages/devkit/src/devkit_agt/features/rules/models/settings.py:74-93; packages/devkit-core/src/devkit_core/core/paths.py:28-85
  suggested_action: Reuse covers and overlaps after normalize_relpath; do not use match_path.
  resolution: open
- issue: file_lock(path, *, shared, timeout, deadline, what) is exported from devkit_core.core and raises LOCK_HELD on an expired wait, PATH_UNSAFE for a non-regular lock path and LOCK_UNSUPPORTED without fcntl; the directory must exist. No public JSON Lines append helper exists; strict_json_loads in devkit_dist.features.project.models.strict_json is public.
  evidence: packages/devkit-core/src/devkit_core/core/locks.py:34-113; packages/devkit-core/src/devkit_core/base/errors.py:107-117; packages/devkit-dist/src/devkit_dist/features/project/models/strict_json.py:46
  suggested_action: Use file_lock and write the append in the feature.
  resolution: open
