summary: 'Consequences of devkit-adaptive requiring devkit-docs: an exact == pin that the release tooling rewrites and checks, re-release whenever devkit-docs changes, docs:core auto-selected with a one-time BUNDLE_AUTO_SELECTED notice and harness:core as a built-in, the wheel refused as a devkit bundle snapshot source (BUNDLE_SNAPSHOT_UNSUPPORTED), and installation statements in two capabilities, three architecture documents, five guide files, READMEs and the smoke script that name devkit-docs plus devkit-catalog.'
findings:
- issue: Sibling requirements are exact pins of the actual version (devkit-docs==0.1.6 form) with a workspace source per sibling; devkit-spec and devkit-docs also pin devkit-core and require click directly. identity.consistent() and metadata.selected() refuse any other specifier, metadata.generated() rewrites the pin at release, prepare() runs uv lock, and test_lockstep asserts the pin for every packages/* and tools/* project, so a new package is covered without registration.
