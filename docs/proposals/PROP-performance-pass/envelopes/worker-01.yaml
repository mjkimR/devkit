  title: Route for agreed performance changes
  prompt: How should the agreed behavior-preserving performance changes of a run be developed when they edit several modules?
  context: 'The design reuses review-refactor''s application steps, but its route for multi-module changes (direct-mode overall-refactor without a Unit) is granted only to review-refactor runs by the delivery workflow capability, the delivery architecture and the spec classification rules. This decides whether performance-pass needs an exception to those rules and edits outside this proposal''s current scope. Development cannot start until it is settled.

    '
  options:
  - id: a
    description: 'Use the repository''s feature workflow at the depth its own classification gives (with the spec bundle, session when no contract or specification text changes), for one module or several. No change to the classification rules; the 2026-10-27 pass already ran this way on its own branch.

      '
    recommended: true
  - id: b
    description: 'Extend review-refactor''s direct-mode overall-refactor route to performance-pass. Adds a decision record and edits to the delivery workflow capability, the delivery architecture and the devkit-spec classification reference, which widens this proposal''s scope.

