  context: 'The measurement steps (interleaved runs, warm-up, exit and output checks, median, minimum and range) are repetitive and deterministic, which the skill-authoring playbook says belongs in a script; the 2026-10-27 pass hit mechanical traps such as a shell variable not split into arguments. No bundle ships a script yet. This decides the playbook''s file list and Development''s scope.

