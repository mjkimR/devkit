questions:
- id: q1
  title: Where the write scope comes from
  prompt: Should the command take the write scope only from explicit arguments, or also fall back to the spec's scope registry record?
  context: The proposal says to reuse an existing delegation record when available, but no record of a worker's write scope exists today. The scope registry (devkit spec scope) stores declared spec paths, which differ from what the Host grants a worker (unit directory, Living Spec targets, linked feedback). This decides whether the command has one input source or two.
  options:
  - id: a
    description: Explicit only. The Host passes --scope <path> (repeatable) or --scope-file; the command never infers scope. Smallest command, no second authority for scope.
    recommended: true
  - id: b
    description: Explicit first, falling back to the unit's scope registry record when no --scope is given. Saves typing for Development units but can report false out-of-scope paths when the registry differs from the payload.
    recommended: false
  allow_note: true
- id: q2
  title: Command name
  prompt: Which name should the inspection command have?
  context: The name is the public CLI surface the spec-delegate and spec-orchestrate guidance will cite; it is cheap to choose now and a breaking rename later.
  options:
  - id: a
    description: devkit spec worker inspect --unit <dir> --base <accepted> --head <returned> --scope <path>... (a new small 'worker' group named after what it inspects).
    recommended: true
  - id: b
    description: devkit spec range inspect with the same arguments (named after the Git range, usable for reviewer payloads outside worker returns).
    recommended: false
  - id: c
    description: devkit spec scope inspect under the existing scope group (reuses a group, but mixes the informational check with the scope registry commands).
    recommended: false
  allow_note: true
- id: q3
  title: Report the base checkout too
  prompt: Should the command also report the base checkout's HEAD and dirty paths when given --base-checkout <path>?
  context: The spec-delegate procedure also requires the base checkout's status and HEAD to be as recorded before spawning, since a stray worker write lands there. The approved scope lists only the worktree checks, so this would be a small addition. It reports only; comparing with what the Host recorded stays the Host's step.
  options:
  - id: a
    description: Yes, optional --base-checkout <path> reports its HEAD and git status paths as information; without the option nothing changes.
    recommended: true
  - id: b
    description: No, keep the approved check list; the Host keeps checking the base checkout by hand.
    recommended: false
  allow_note: true
