questions:
- id: q1
  title: Who runs Planning acceptance
  prompt: Who should run the composed `devkit spec proposal accept <slug> --mode ...` at the end of Planning?
  context: The composed command already records and commits the acceptance, merges plan-<slug>, cleans up and optionally hands off, so one route is enough and the pilot's split route (Host accept, commit, then operator integration) is dropped either way. This decides whether git-operator gains an acceptance job. Host actions per acceptance are one in both A and B; B keeps merge and cleanup output and recovery inspection out of the Host context but is unexercised, and it lets the operator write the gate:plan-accept record, which the accepted ADR-reusable-lifecycle-resource-manager does not list, so B needs a PADR.
  options:
  - id: a
    description: The Host runs the composed command itself; the git-operator references say so in one line and no operator integration follows it. No operator or ADR change.
    recommended: true
  - id: b
    description: Add a git-operator `accept-proposal` job limited to `--mode accept_only` (Development keeps the existing handoff job), with a PADR for the widened operator effect and a CAP-DLV-delivery-workflows 4.6.1 update.
    recommended: false
  - id: c
    description: 'Keep and document the split route: Host basic accept and commit in the Planning worktree, then operator prepare-integration and execute-integration (about four Host actions per acceptance).'
    recommended: false
  allow_note: true
- id: q2
  title: Stage for the final Planning return
  prompt: 'When `devkit workflow next` prints `[STAGE: - complete=yes]` for a still-reviewing proposal (plan-accept=auto), how should a Planning worker know which stage to record?'
  context: The envelope contract refuses `-`, and any other stage text is accepted at write time; an unknown stage holds every gate, and a question recorded at `handoff` would not hold the basic acceptance under ask. Recording at `direction-handoff` holds plan-accept for every acceptance path. This decides whether the fix is guidance in this proposal's boundary or an engine change in packages/devkit, which this proposal excludes.
  options:
  - id: a
    description: 'Guidance only: worker-records.md and planning.md name `direction-handoff` for this case, pinned by one behavior test that a question there makes `accept --mode` refuse.'
    recommended: true
  - id: b
    description: 'Engine change: `next` keeps reporting `direction-handoff` while the proposal is reviewing under auto policy; this extends the boundary into packages/devkit (workflow evaluation and render.py) and needs a new ADR.'
    recommended: false
  allow_note: true
- id: q3
  title: Dry run for composed acceptance
  prompt: Should the composed `accept --mode` gain a read-only `--check`?
  context: Readiness refusals raised in preparation already precede any write. Checks on the built merge (CI rules, receipts, finish guards) run after the acceptance commit, and after the moved-target change they can newly refuse there; a dry run repeats only the preparation, so it would not catch those. This decides whether Development adds a CLI flag or only corrects the usage error wording and documents the post-commit recovery.
  options:
  - id: a
    description: 'No --check: the usage error states that preparation refusals precede the first write and a later failure returns needs_recovery with completed_steps, and names `devkit spec proposal report` and `devkit workflow envelope check` for read-only review.'
    recommended: true
  - id: b
    description: Add `--mode ... --check` that runs the preparation read-only and reports readiness and prospective effects; it cannot detect refusals on the built merge.
    recommended: false
  allow_note: true
