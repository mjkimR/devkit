answers:
- question: q1
  choice: a
  decision: One fixed flat directory docs/steering/ holding one Markdown file per topic (for example glossary, product, style), with no further split.
  constraints:
  - A namespace copy docs/packages/<name>/steering/ is added only if Planning finds a real need; otherwise it is dropped.
- question: q2
  choice: null
  decision: The group is named steering (Steering document), not foundation, because foundation collides with the core code layer; the proposal slug PROP-foundation-documents and its paths stay.
  constraints:
  - 'Add a glossary row Steering document with Avoid: foundation, background.'
- question: q3
  choice: a
  decision: glossary.md and glossary.yaml move into docs/steering/ with no migration or notice; each literal path consumer is an acceptance item with a test, and the handbook tool falls back to docs/glossary.md for older commits.
- question: q4
  choice: a
  decision: Search stays unchanged; steering documents need no search coverage because their frontmatter list is always loaded.
  constraints:
  - Every steering file's frontmatter (title and a one-line scope summary) is always loaded and printed by devkit get-context spec at run time from docs/steering/, not rendered by sync; bodies are read only when a decision concerns that scope.
  - The get-context change in devkit-dist is in scope and in owns.
  - A rule caps the number of steering files and the body size of each file, sized so the moved glossary (about 7.8 kB) fits.
