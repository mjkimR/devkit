questions:
- id: q7
  title: Steering caps and glossary growth
  prompt: Which caps does RULE-steering-documents enforce, and what happens when the glossary reaches the body cap?
  context: The rule runs at error severity in the commit gate. The glossary grew from 4385 to 7808 bytes in one week and gains frontmatter and a Steering document row here; it cannot be split (one Owner check path, one synonym file, table format excluded). The always-loaded list costs about 400 bytes per file. Body means the text after the frontmatter; all caps are rule settings a project can raise.
  options:
  - id: a
    description: max_files 10 and max_body_bytes 24576 (about three times today's glossary) for every file, glossary included; a project raises the setting when it needs more.
    recommended: true
  - id: b
    description: max_files 10 and max_body_bytes 12288 (the skill document budget), with glossary.md exempt from the body cap because only its frontmatter is always loaded.
    recommended: false
  - id: c
    description: max_files 10 and max_body_bytes 12288 for every file, and the glossary may split into several steering files; reverses the table-format exclusion and makes the Owner check and synonym expansion read several files.
    recommended: false
  allow_note: true
