questions:
- id: q1
  title: Specialized AST walk scope
  prompt: Should rules with nested scopes or conditional walks (unique_code._calls tracking function-level imports, layers._imports skipping if TYPE_CHECKING:) keep their custom walks, or should the shared index be extended?
  context: Whole-tree traversals in RULE-architecture, RULE-usecase-boundaries, RULE-cli-tool-command-boundary, RULE-cli-tool-library-output, and top-level module indexing in RULE-advisory-unique-code map directly to flat node type queries. However, unique_code._calls tracks lazy imports inside enclosing functions, and layers skips TYPE_CHECKING.
  options:
  - id: a
    description: Migrate all flat whole-tree walks to the shared node index; keep custom scoped walks (unique_code._calls and layers._imports) rule-internal, with optional short-circuiting when no target nodes exist in the file.
    recommended: true
  - id: b
    description: Extend the shared node index contract to record lexical scope hierarchies and conditional blocks so every rule without exception uses the index.
    recommended: false
  allow_note: true
- id: q2
  title: Node index accessor API shape
  prompt: What API shape should WorkspaceCache expose for reading indexed AST nodes?
  context: The prototype showed indexing all 826 files costs only 8.97 MB RSS and cuts repeated walk time from 1,151 ms to 1.82 ms. Callers need to query one or more node types (e.g. ast.Import, ast.ImportFrom).
  options:
  - id: a
    description: WorkspaceCache.get_python_nodes(path, *types) returning a read-only tuple of ast.AST matching any of the requested types in document traversal order, lazily built on first request and invalidated with the AST.
    recommended: true
  - id: b
    description: WorkspaceCache.get_python_node_index(path) returning a Mapping[type[ast.AST], Sequence[ast.AST]] exposing the full type-to-nodes dictionary.
    recommended: false
  allow_note: true
