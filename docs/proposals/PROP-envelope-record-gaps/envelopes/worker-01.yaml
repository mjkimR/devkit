questions:
- id: answer-fold-round
  title: Review rounds after folding answers
  prompt: At high effort, when a Planning folds your answers into a proposal that already went through review rounds, how should the review loop count the rounds that follow?
  context: Decides the review-loop rule for high Planning (PADR-reverify-closes-challenger-rounds). Today the loop caps rounds at the third after the initial review and says nothing about answer folds; two open feedback items ran into this. It matters now because the rule goes into review-loop.md in this Development.
  options:
  - id: same-loop-extra-round
    description: The fold is a new batch in the same loop; if it reaches the cap, it gets one more fresh round outside the cap, as a fix you requested does today. The loop stays bounded and your answer never forces a hand-over by itself.
    recommended: true
  - id: same-loop
    description: 'The fold is a new batch in the same loop with no extra round. Strictest: a fold at the cap is handed back to you even though it only applied your answer.'
    recommended: false
  - id: fresh-loop
    description: The fold starts a fresh loop at round 1. Simplest, but every round of answers resets the cap, so the loop has no bound across answer rounds.
    recommended: false
  allow_note: true
- id: new-boundary-paths
  title: Declaring paths a change will create
  prompt: The new boundaries rule warns when a proposal's target_area or boundaries.owns names a path that does not exist. How should a proposal declare a path that its Development will create?
  context: Decides how authors write boundaries for new areas, files or packages (PADR-proposal-boundaries-name-existing-paths). The boundary list is copied as written into the spec and its task boundary at handoff, so any new syntax also changes handoff.
  options:
  - id: nearest-ancestor
    description: Name the nearest existing parent directory (for example packages/devkit-spec/src/devkit_spec/bundle/rules/). No new syntax and no handoff change; the new path itself is named in the proposal text.
    recommended: true
  - id: creates-key
    description: A separate list boundaries.creates for new paths, checked to have an existing parent; handoff copies it as a planned new boundary. Precise, but adds a frontmatter field and a handoff change.
    recommended: false
  - id: new-prefix
    description: Mark the entry inline, for example 'new:capabilities/foo/'. Short, but handoff must strip the marker or it leaks into the spec's task boundary.
    recommended: false
  allow_note: true
