questions:
- id: q1
  title: Handbook delivery form
  prompt: In what form is the handbook delivered?
  context: Decides whether a two-language snapshot is tracked on main (and so carries the cli-contract exclusion, the tree check and README links) or is built outside the repository. No external consumer exists yet; the entry point for people is the purpose of the proposal.
  options:
  - id: a
    description: Tracked handbook/ on main, committed before the release tag, so the tag contains a browsable handbook matching its own docs/.
    recommended: true
  - id: b
    description: GitHub Release asset built by scripts/release.sh from the tagged commit; nothing tracked, no cli-contract exclusion, no README link to a path.
    recommended: false
  - id: c
    description: On-demand untracked artifact like weekly-report; no release binding at all.
    recommended: false
  allow_note: true
- id: q2
  title: Refresh cadence
  prompt: Which releases refresh the handbook?
  context: Tags v0.1.0 to v0.1.3 came within 11 days and docs/ changed 239 files between two of them, so refreshing at every tag means a near-full English rewrite, translation and human review every few days. A release that does not refresh keeps the previous handbook, whose provenance names the older tag.
  options:
  - id: a
    description: Every release tag.
    recommended: false
  - id: b
    description: Minor releases (vX.Y.0) only; patch releases keep the previous handbook under its older tag.
    recommended: true
  - id: c
    description: Only when the release preparer chooses to run the playbook.
    recommended: false
  allow_note: true
- id: q3
  title: Does handbook failure block the tag
  prompt: When a refreshing release fails handbook verification, or its docs/ tree differs from the manifest source commit, is the release blocked?
  context: Decides whether scripts/release.sh fails the build (section 3.3 step 5) or only warns. Blocking keeps every tag's handbook matching its docs/; warning keeps releases independent of the handbook.
  options:
  - id: a
    description: 'Block: the release build fails for a release that refreshes the handbook; releases that do not refresh are unaffected.'
    recommended: true
  - id: b
    description: 'Warn only: the release proceeds and the mismatch is reported.'
    recommended: false
  allow_note: true
- id: q4
  title: Languages and English-only exception
  prompt: Which languages does the first handbook carry, and how wide is the exception to the English-only documentation rule?
  context: AGENTS.md says all documentation is written in English; no rule enforces it and no ADR records it, so the exception ADR is the first decision on documentation language. Its scope bounds where non-English text may appear.
  options:
  - id: a
    description: en and ko; the exception covers handbook/<lang>/ for languages other than en only, and nothing else in the repository.
    recommended: true
  - id: b
    description: en only for the first release; ko and the exception ADR come in a later proposal.
    recommended: false
  allow_note: true
- id: q5
  title: docs/ readability policy
  prompt: Does the existence of the handbook let docs/ drop human readability in the agent-first restructuring?
  context: The original text stated this as settled. Accepting it would change how Living Spec documents are written, independent of whether a handbook is ever produced.
  options:
  - id: a
    description: 'No: the Living Spec writing instructions stay as they are; any change is a separate proposal after the first handbook exists.'
    recommended: true
  - id: b
    description: 'Yes: record as part of this proposal''s ADR that docs/ is written for agents only and people read the handbook.'
    recommended: false
  allow_note: true
- id: q6
  title: Playbook home and contract area
  prompt: Where do the handbook playbook and its contract live?
  context: devkit-dev today ships only structure instructions and rules, and ARCH-05-1-containers defines it so; a playbook there widens that definition. weekly-report, the precedent, ships in the devkit-catalog maintenance bundle with its contract in capabilities/delivery/. The script and justfile recipe stay in root scripts/ either way.
  options:
  - id: a
    description: Playbook in the devkit-dev bundle (repository-only), ARCH-05-1 updated, contract as a capability in capabilities/delivery/.
    recommended: true
  - id: b
    description: Playbook in the devkit-catalog maintenance bundle beside weekly-report (opt-in for other repositories), contract in capabilities/delivery/; boundaries then own packages/devkit-catalog/ instead of tools/devkit-dev/.
    recommended: false
  - id: c
    description: 'No bundle asset: the script and justfile recipe only, with the procedure written into the ARCH-07-deployment release preparation and the contract in capabilities/delivery/.'
    recommended: false
  allow_note: true
- id: q7
  title: Decision digest scope
  prompt: Does the first handbook include decisions.md?
  context: ADR compaction (ADR-immutable-decisions-editable-records) already keeps the ledger to the decisions in effect (42 accepted), so a digest no longer has to fold supersession chains.
  options:
  - id: a
    description: Yes, as a generated list of accepted ADRs with their summaries and tag-pinned links; no folding or rewriting.
    recommended: true
  - id: b
    description: 'No: drop decisions.md from the first handbook.'
    recommended: false
  allow_note: true
