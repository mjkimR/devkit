summary: 'Spike Q1-Q7 answered: existing index and git cover the deterministic parts; handbook/ is outside the document index and spec rules but inside repo-wide Markdown rules; devkit-dev has no playbooks; no English-only enforcement exists.'
findings:
- issue: 'Q1: spec list/resolve/refs --format json expose id, kind, path, status, title, area, summary and references, enough for the table of contents, ID lists and source links; a Python generator can load DocumentIndex directly. Glossary, command and error-code tables have no CLI and need their own small readers.'
  evidence: packages/devkit-spec/src/devkit_spec/features/documents/models/model.py:61-82; packages/devkit-spec/src/devkit_spec/features/documents/usecases/search.py:61,199; docs/glossary.md:10; packages/devkit-dist/src/devkit_dist/bundles/advisory/bundle/rules/unique_code/rule.py:168-183
  suggested_action: Reuse the index for IDs and links; add a click-tree reader, an error-code scan and a glossary table reader in the handbook script.
  resolution: open
- issue: 'Q1: devkit generated would report the handbook stale between releases, which conflicts with intentional staleness.'
  evidence: docs/capabilities/generated/CAP-GEN-tracked-artifacts.md:18
  suggested_action: Do not register handbook/ as a generated artifact.
  resolution: open
- issue: 'Q2: no devkit command outputs a git blob SHA (the index memo key is BLAKE2b of text); resolve the path by ID, then use git rev-parse <commit>:<path>. Coverage gap is a set difference of list usecase/capability against cited sources.'
  evidence: packages/devkit-spec/src/devkit_spec/features/documents/repositories/memo.py:84-86
  suggested_action: Key sources by ID and compute SHAs with git in the script.
  resolution: open
- issue: 'Q3: the document index scans only docs/ and specs/, so search, get-context and the docs/specs-scoped spec rules (RULE-document-summary, RULE-document-reference, RULE-id-convention) ignore a root handbook/ without change. Repo-wide Markdown rules (RULE-markdown-link for relative links, RULE-cli-contract for devkit citations, RULE-file-length) do check it; CI runs a whole-workspace rules-check.'
  evidence: packages/devkit-spec/src/devkit_spec/features/documents/repositories/index.py:49,70-73; packages/devkit/src/devkit_agt/features/rules/usecases/project.py:414; .devkit/config.toml:20-23; .github/workflows/ci.yml:49
  suggested_action: 'Smallest exclusion: handbook/** in [rules.settings.RULE-cli-contract].exclude; keep RULE-markdown-link active.'
  resolution: open
- issue: 'Q4: weekly-report has no scripted link check (agent prose only). ID existence (spec resolve exits 2 with SPEC_ID_UNRESOLVED), path existence at a commit (git cat-file -e), parity and normative keywords must be scripted; contradiction stays in human review.'
  evidence: packages/devkit-catalog/src/devkit_catalog/maintenance/bundle/playbooks/weekly-report.md:60; packages/devkit/src/devkit_agt/bundles/authoring/bundle/rules/agent_asset_wording/rule.py:21-41
  suggested_action: Implement the mechanical checks in the handbook script.
  resolution: open
- issue: 'Q5: no release playbook exists; release preparation is just version-sync and a metadata commit, then a v* tag on main triggers release.yml, which builds notes from scripts/release.sh plus generated notes. The handbook commit fits into release preparation before the tag (ARCH-07 section 1).'
  evidence: docs/architecture/ARCH-07-deployment.md:52-68; .github/workflows/release.yml:14,37,47-50; scripts/release.sh:48-92
  suggested_action: Add the handbook step to ARCH-07 release preparation; leave release notes unchanged.
  resolution: open
- issue: 'Q6: SPEC-document-id-aliases-and-compaction is completed and excludes ADR compaction; ledger compaction is governed by ADR-immutable-decisions-editable-records and the adr-compaction playbook. The index holds 49 decisions (42 accepted).'
  evidence: specs/2026-10/20261022-document-id-aliases-and-compaction/spec.md:5,48-51; docs/decisions/2026-10/20261022-immutable-decisions-editable-records.md:65-73
  suggested_action: A digest is a read-only listing of accepted ADR summaries; no overlap remains.
  resolution: open
- issue: 'Q7: the devkit-dev bundle has two instructions and two rules, no playbooks or scripts, and ARCH-05-1 defines it as repository-specific structure checks; weekly-report ships in devkit-catalog maintenance with its contract in delivery/. No rule or ADR enforces English-only documentation; RULE-document-summary checks only summary script in docs/ and specs/.'
  evidence: tools/devkit-dev/src/devkit_dev/bundle/bundle.toml; docs/architecture/ARCH-05-1-containers.md:144-146; packages/devkit-catalog/src/devkit_catalog/maintenance/bundle/bundle.toml:15-17; docs/capabilities/delivery/CAP-DLV-weekly-report.md:5; AGENTS.md:19
  suggested_action: Ownership and area are a user decision (q6).
  resolution: open
