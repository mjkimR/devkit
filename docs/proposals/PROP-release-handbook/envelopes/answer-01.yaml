- question: q1
  choice: a
  decision: The handbook is a tracked handbook/ directory on main, committed before the release tag.
- question: q2
  choice: c
  decision: The handbook is refreshed only when the user explicitly requests it by running the playbook; there is no release cadence.
  constraints:
  - A release that does not refresh keeps the previous handbook, whose provenance names its older tag.
- question: q3
  choice: a
  decision: Only a release whose preparation explicitly refreshed the handbook fails on handbook verification or a docs/-versus-manifest-source mismatch; every other release is unaffected.
  constraints:
  - scripts/release.sh determines from committed state whether this release refreshed the handbook, without running any generation or refresh automatically.
- question: q4
  choice: a
  decision: The first handbook carries en and ko; the exception to the English-only rule covers handbook/<lang>/ for languages other than en only.
- question: q5
  choice: null
  decision: No docs/ policy change; the writing instructions are already agent-first and carry no human-readability requirement for docs/, so the proposal drops the claim that docs/ keeps human readability or that the handbook relieves it, and no ADR records a docs/ policy decision.
- question: q6
  choice: a
  decision: The playbook ships in the repository-only devkit-dev bundle, ARCH-05-1-containers is updated, and the contract is a capability in capabilities/delivery/.
- question: q7
