  decision: Handbook source links stay external, tag-pinned GitHub links opened in a new browsing context.
- question: staleness-reference
  choice: a
  decision: 'Staleness compares the manifest tag with v<VERSION>, read as a file, by version order: ahead, equal, behind and absent VERSION as in PADR-handbook-staleness-from-version; no Git.'
