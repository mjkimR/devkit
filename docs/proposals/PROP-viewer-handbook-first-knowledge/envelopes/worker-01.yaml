questions:
- id: tab-shape
  title: Tab shape for handbook and book
  prompt: How should the handbook and the Living Spec book appear in the viewer's left rail?
  context: Today the rail has a Book tab (view id 'book') that indexes and renders all of docs/ on open. Hosts such as autohub can deep-link with initialView='book' and receive view 'book' in sdd:path-change, so the id matters; the label is only text. This decides the rail, the absence state for repositories without a handbook, and the SddViewer test that finds the button by name.
  options:
  - id: a
    description: 'One tab, id ''book'' kept, label renamed to ''Read'' (title ''Handbook and Living Spec book''): it opens the handbook where a manifest exists, otherwise an absence note; a ''Living Spec book'' control inside computes the book.'
    recommended: true
  - id: b
    description: 'Two tabs: a new ''Handbook'' tab (new view id) and the existing ''Book'' tab, which now waits for a start control. A repository without a handbook shows an empty Handbook tab.'
    recommended: false
  - id: c
    description: One tab with id 'book' and the label 'Book' unchanged, otherwise as option a.
    recommended: false
  allow_note: true
- id: book-deep-links
  title: Deep links into the book
  prompt: When a library host (such as autohub) opens the viewer with initialView 'book' and an initialPath naming a Living Spec file under docs/, what should happen before the book was computed?
  context: The book is computed only on request. The standalone page always opens on the Dashboard and no Dashboard card targets the book, so this concerns library hosts only; autohub's actual use was not verified. The default initialPath 'docs/' never counts as a request. Computing the book costs about 1.1 s and 922 reads cold on this repository (MAT-viewer-handbook-cold-load); one document with working ID links still needs the 0.6 s index.
  options:
  - id: a
    description: 'Treat the host link as the request: compute the whole book and jump to the chapter, as today.'
    recommended: true
  - id: b
    description: Render only the requested document (with the index for its ID links) and offer the book control; the full book is computed only on the control.
    recommended: false
  - id: c
    description: Open the handbook (or the absence note) and show the book control; the link target is applied after the reader selects it.
    recommended: false
  allow_note: true
- id: source-links
  title: Handbook links to Living Spec sources
  prompt: Where should a handbook page's links to its Living Spec sources go when read in the local viewer?
  context: 'Every source link is https://github.com/<repository>/blob/<tag>/<path>, pinned to the release the handbook describes (CAP-DLV-release-handbook 3.1 rule 5). The local working tree holds the current version of the same file, which may differ from the tag. During release preparation the tag is not pushed yet (now: links name v0.1.4, newest tag v0.1.3), so external links return 404 until the release; a local mapping works offline but shows current contracts rather than the snapshot''s.'
  options:
  - id: a
    description: 'Keep them external: open the tag-pinned GitHub page in a new browsing context; the version always matches the page.'
    recommended: true
  - id: b
    description: Map them to the local document in the viewer (Files tab), with a note that it shows the current version, not the tag.
    recommended: false
  - id: c
    description: 'Both: the external link stays and a small ''current'' link opens the local document.'
    recommended: false
  allow_note: true
- id: staleness-reference
  title: What handbook staleness compares
  prompt: What should the viewer compare the handbook's manifest tag with to decide whether to show a staleness note?
  context: 'Between a handbook refresh and its release both VERSION and the latest Git tag trail the manifest tag (now: manifest v0.1.4, VERSION 0.1.3, latest tag v0.1.3), so an equality test would call a fresh snapshot stale. The viewer''s ordinary reads start no Git process (CAP-VIEW-repository-viewer section 2). See PADR-handbook-staleness-from-version.'
  options:
  - id: a
    description: 'VERSION read as a file, compared by version order: manifest ahead = ''snapshot for the upcoming release'', equal = tag and date only, behind = staleness note naming both; no VERSION = tag and date only.'
    recommended: true
  - id: b
    description: 'The latest Git tag by version order: same states, exact ''released'' meaning, but a new Git read in ordinary requests (contract exception) and a new data-source method for hosts.'
    recommended: false
  - id: c
    description: 'No comparison: show the tag and generation date only.'
    recommended: false
  allow_note: true
- id: book-rendering-feedback
  title: Fate of FB-viewer-book-rendering
  prompt: How should FB-viewer-book-rendering (render book chapters near the viewport) be disposed of by this proposal?
  context: On-demand computation removes the book from the cold load, but once requested the book still renders 154 chapters and 124k DOM nodes (about 0.47 s each time the tab is re-entered). Feedback is resolved only when the implementation fully addresses it; resolving it also needs its file in this proposal's write scope. FB-viewer-knowledge-anchor-loading stays open either way (Proposals and Specs keep the 0.6 s index).
  options:
  - id: a
    description: Keep it open, rescoped to rendering after the request; this proposal does not change post-request rendering.
    recommended: true
  - id: b
    description: 'Resolve it with this proposal: add its file to owns and a Source feedback disposition, accepting that post-request rendering is unchanged.'
    recommended: false
  - id: c
    description: Dismiss it as not worth pursuing once the book is on demand.
    recommended: false
  - id: d
    description: 'Expand scope: also render book chapters near the viewport in this proposal (dev effort and size grow).'
    recommended: false
  allow_note: true
