summary: 'One pass at medium: 7 findings (4 P2, 3 P3), no P1. The design holds; the statement text is under-defined against the masking reader and against items that end in a trace or citation, the pointer-text check is undefined without a pointer, and the migration''s no-decision-changed claim has one pair whose sources differ. Findings 3 and 7 need the user''s decision.'
findings:
- issue: Section 3.1 reads statements and pointers from visible lines only while handoff copies the text verbatim. visible_lines blanks every inline code span that is not a single document ID, link labels and escapes, so text taken from it loses those spans and a comparison through it treats texts that differ only inside code spans as equal.
  evidence: docs/proposals/PROP-partial-adr-supersession-statements/proposal.md:93,119-120; packages/devkit-docs/src/devkit_docs/features/documents/models/markdown.py:9,16; docs/decisions/2026-11/20261102-steering-documents.md:17
  failure_condition: A statement contains a code span such as a command. Handoff writes a pointer with the span missing, devkit docs supersession prints text with gaps, and AC-05 still passes because both sides pass through the same masked reader.
  suggested_action: Use visible lines only to locate a statement or pointer, take its text from the raw source lines of that block and compare raw text after whitespace collapse. Add a code-span case to AC-04 and AC-05.
  resolution: open
  severity: P2
- issue: '''Text runs to the end of that list item'' takes in whatever ends the item. Decision Outcome items end with a trace, consolidated ADRs end each item with a source ID in parentheses, and one existing item states the replaced scope of two earlier ADRs; section 3.6 covers joining items but not splitting one.'
  evidence: docs/proposals/PROP-partial-adr-supersession-statements/proposal.md:111-113,194-196; docs/decisions/2026-11/20261105-selective-package-versions.md:61-64; docs/decisions/2026-11/20261102-decision-ledger.md:148-151; packages/devkit-docs/src/devkit_docs/bundles/docs/bundle/instructions/decision-writing.md:45-47; packages/devkit-spec/src/devkit_spec/bundles/spec/bundle/playbooks/adr-consolidation/SKILL.md:42
  failure_condition: 'Migrating those two ADRs, or a consolidation that rewrites a statement as a Section 4 item: the earlier ADR''s pointer has to repeat a foreign trace or citation, or the statement drops it against the writing and consolidation conventions. A nested list inside a statement item is undefined for the one-paragraph pointer.'
  suggested_action: State that a statement is an item or paragraph of its own without a trace, source citation or nested list, and that an item naming several earlier ADRs or mixing a clause with the scope is split, with where its trace goes.
  resolution: open
  severity: P2
- issue: 'AC-06 cannot show that no decision changed, and one pair has sources that name different scopes: the Decision Outcome of ADR-skill-local-swarm-roles replaces ''the role-set clauses'', while its pointer and an unlisted frontmatter key supersedes_clause say ''role-set and role-authority clauses''. Section 3.6 lets the worker pick the more exact description. AC-06''s diff clause also contradicts AC-01, which edits docs/decisions/README.md.'
  evidence: docs/proposals/PROP-partial-adr-supersession-statements/proposal.md:194-196,271-272,318; docs/decisions/2026-11/20261106-skill-local-swarm-roles.md:8,70-71; docs/decisions/2026-11/20261102-adaptive-development-and-research.md:20; docs/proposals/PROP-partial-adr-supersession-statements/materials/planning-evidence.md:75-87
  failure_condition: 'The migration worker writes one text for that pair: the later ADR''s stated scope widens or the earlier ADR''s pointer narrows. The rule compares text only, and review of a wording-only diff has no before and after per pair to catch it.'
  suggested_action: 'Decision needed: which source governs when the later ADR''s outcome and the hand-clarified pointer name different clauses (one known pair), and whether supersedes_clause is removed or kept. Then require reconcile.md to show, per pair, the earlier sentences, the earlier pointer and the new statement, flag every pair whose sources differed, and limit the diff clause to ADR files.'
  resolution: open
  severity: P2
- issue: 'Check 3 is undefined when the earlier ADR has no pointer naming the superseder: ''no pointer repeats the text'' holds, the location ''first pointer naming the superseder'' does not exist, and the existing replacement-target finding already fires for the pair.'
  evidence: docs/proposals/PROP-partial-adr-supersession-statements/proposal.md:141-143,246-249; packages/devkit-docs/src/devkit_docs/features/governance/usecases/decision_supersession.py:54,101-106
  failure_condition: The pointer is deleted. With both files targeted the pair gets two errors against AC-04's one error per pair; with only the earlier ADR targeted there is no line to report at, or the rule needs a reverse scan of every ADR's supersedes that section 3.2 does not describe.
  suggested_action: Limit check 3 and AC-04 to pairs with at least one pointer naming the superseder; leave the zero-pointer case to the existing finding at supersedes.
  resolution: open
  severity: P2
- issue: 'Section 3.6 is stale and leaves the general case open. On main PROP-adaptive-package-extraction is handed off: its PADR is ADR-adaptive-dev-distribution, a 27th pair, and no open PADR names supersedes. The text still tells Development to edit that PADR, covers only pairs landing before Development starts, and boundaries.owns holds all of docs/proposals/ for it.'
  evidence: docs/proposals/PROP-partial-adr-supersession-statements/proposal.md:34,192-193,199-200; git show main:docs/decisions/2026-11/20261102-adaptive-development-and-research.md line 20; git ls-tree main docs/proposals/
  failure_condition: A pair or an accepted PADR lands on the target after Development starts, for example a handoff run from a branch without the changed handoff. The post-merge rules check fails, and the repair edits another unit's accepted decision text with no stated rule.
  suggested_action: State that every pair and every open PADR on the Development head at final verification is migrated and that another unit's PADR gets only a restatement of its own Decision Outcome. Drop docs/proposals/ from owns if no such PADR exists at handoff.
  resolution: open
  severity: P3
- issue: AC-05's 'leaves the working tree unchanged' holds only for the plain handoff. The composed handoff --effort creates dev-<slug> before the handoff step and never rolls it back, and the fix edits an accepted PADR on the base.
  evidence: docs/proposals/PROP-partial-adr-supersession-statements/proposal.md:159-160,260-261; docs/capabilities/delivery/CAP-DLV-proposal-planning.md:678-682
  failure_condition: A PADR without a statement reaches acceptance, for example in a repository that lowers the rule's severity (packages/devkit/src/devkit_agt/features/rules/models/policy.py:81-85).
  suggested_action: 'Scope AC-05''s refusal clause to the plain handoff and state the composed outcome in section 3.3 (worktree kept, statement added on the base, rerun). Optional: also refuse at acceptance preparation.'
  resolution: open
  severity: P3
- issue: '''Whole replacement through a PADR: Unchanged'' understates the change. The rule and handoff now require a PADR that replaces a whole ADR to carry a sentence saying ''Supersedes in part'', and the sentence stays in the ledger after superseded is set.'
  evidence: docs/proposals/PROP-partial-adr-supersession-statements/proposal.md:137-138,146,315; docs/proposals/PROP-partial-adr-supersession-statements/decisions/PADR-partial-supersession-statements.md:109-111
  failure_condition: 'The first whole replacement through a PADR (none of 65 ADRs today): a truthful PADR without the sentence is a rule error and a refused handoff, and devkit docs supersession prints scope=whole with an ''in part'' text.'
  suggested_action: 'Decision needed: accept the permanent ''in part'' sentence for whole replacements, or let a PADR declare a whole replacement in a form the rule and handoff accept.'
  resolution: open
  severity: P3
