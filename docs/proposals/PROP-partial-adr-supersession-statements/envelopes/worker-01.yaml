- id: q2
  title: Whole replacement through a PADR
  prompt: How does a PADR that replaces a whole ADR satisfy the statement check?
  context: After this change the rule and the handoff require a statement for every supersedes entry whose ADR is not superseded. While the PADR is written the earlier ADR is still accepted, so a decision meant to replace it wholly is handled like a partial one. Handoff already writes a "Superseded in part by" pointer in that case and leaves status superseded and superseded_by to the author. None of the 65 ADRs is wholly superseded. The answer fixes the rule and handoff contract before Development starts.
  options:
  - id: a
    description: Keep one form. The PADR writes "Supersedes in part ADR-<old>:" naming every decision, handoff writes the pointer, and the author then sets superseded and superseded_by. The "in part" sentence and pointer stay in the ledger as history, and devkit docs supersession shows scope=whole with that text. No scope is added.
    recommended: true
  - id: b
    description: Add a whole form. A second fixed sentence ("Supersedes ADR-<old> as a whole.") satisfies the rule, and handoff then sets the earlier ADR's status superseded and superseded_by instead of writing a pointer. This changes the handoff contract that leaves a whole supersession to the author and adds rule, handoff and test work to this proposal.
