  options:
  - id: a
    description: Role-set and role-authority clauses. The statement takes the scope of the pointer and of the frontmatter key, and the Decision Outcome sentence is reworded to match. The later ADR's own outcome clauses on task overlays, Git authority and worker commits support this scope.
    recommended: true
  - id: b
