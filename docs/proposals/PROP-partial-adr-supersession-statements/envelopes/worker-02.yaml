  title: Scope of the steering-registers pair
  prompt: Which parts of ADR-namespace-steering-directories does ADR-namespace-steering-registers replace?
  context: 'The migration writes one fixed statement per existing pair and settles no scope by itself; the answer becomes the statement and the pointer text of this pair, and the rule compares text only, so nothing later catches a wrong scope. Comparing the pairs on the refreshed base found this second pair whose sources differ. The later ADR''s Decision Outcome says it "replaces the glossary-exclusion and package-glossary-location clauses" and that the earlier ADR''s "other decisions remain in force". The earlier ADR''s pointer names more: "namespace glossary locations and exclusions, root-only search synonyms, and the deferred namespace UX object register". In the earlier ADR the root-only synonyms stand inside its glossary item, and the deferred register is a follow-up in Consequences. Other outcome items of the later ADR place namespace UX object registers in the namespace steering directory and make search load namespace synonym files, without naming the earlier ADR.'
  options:
  - id: a
    description: The pointer's scope. The statement names the namespace glossary locations and exclusions, the root-only search synonyms and the deferred namespace UX object register; the later ADR's Decision Outcome sentence is reworded to that scope and the earlier ADR's pointer keeps it. The later ADR's own outcome items on namespace registers and namespace synonym files support this scope.
    recommended: true
  - id: b
    description: The Decision Outcome sentence's scope. The statement names the glossary-exclusion and package-glossary-location clauses only, and the earlier ADR's pointer narrows to them. The root-only synonyms and the deferred register then read as in force in the earlier ADR, although the later ADR's other outcome items change both.
    recommended: false
  allow_note: true
