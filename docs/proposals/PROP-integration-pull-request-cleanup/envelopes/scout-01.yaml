summary: Mapped code, platform and contract boundaries for a PR route. gh 2.96.0 pins the PR head (--match-head-commit) but nothing pins the base; recommended option A (check a locally built merge, merge with the head pinned, verify the landed merge's parents and tree) behind a GitHub-only gh adapter in devkit.worktree; no accepted ADR sentence forbids the route, CAP-INT and CAP-WT need amending.
findings:
- issue: gh is used only read-only by the stale-branch report (injectable GhRunner, 60 s timeout, 127 missing, 124 timeout); nothing writes to GitHub today.
  evidence: packages/devkit/src/devkit/worktree/stale.py:36-61
  suggested_action: Put the GitHub adapter beside run_gh in devkit.worktree (integration may import worktree, not the reverse).
  resolution: open
- issue: finish without --merge counts a branch merged only when it is an ancestor of the local base HEAD, fetches nothing on that path and never deletes the remote branch.
  evidence: packages/devkit/src/devkit/worktree/lifecycle.py:251-263, 1168-1177
  suggested_action: The PR route fetches the target and deletes the remote branch itself, with a lease on the approved source SHA.
  resolution: open
- issue: pull_request = required is refused in finish(merge=True), plan_finish and the service (WORKTREE_PR_POLICY); the service is local-only by construction (network forbid, merge_method ff-only, network_operations excluded, cleanup extensions must declare integration_local_only).
  evidence: packages/devkit/src/devkit/worktree/planning.py:88-89; packages/devkit/src/devkit/integration/models.py:30-33,123-124,165,170; packages/devkit/src/devkit/integration/providers.py:122-128
  suggested_action: Add an explicit pull-request route to the service; keep the CLI finish --merge local and refused under required.
  resolution: open
- issue: gh pr merge has --merge, --match-head-commit SHA, --auto, --admin, --delete-branch (local and remote); no base-SHA option. REST merge takes sha (head) and merge_method; nothing pins the base (REST part unverified).
  evidence: gh pr merge --help (gh 2.96.0)
  suggested_action: Enforce the source server-side with the head pin; check the target before and verify it after; refuse --auto, --admin and merge queues; do not use --delete-branch (it deletes the local branch outside devkit's guards).
  resolution: open
- issue: 'No compare-and-swap on the base exists through the PR merge: a target advance between the last check and the platform merge cannot be prevented, only detected from the merge commit''s first parent.'
  evidence: gh pr merge --help; PADR-target-advance-readiness (PROP-integration-follow-ups)
  suggested_action: Report a landed merge whose first parent is not the checked target as a distinct outcome with readiness run on the landed merge; never report it as a checked success.
  resolution: open
- issue: Push and PR creation happen after approval, so required CI is pending when the approving call wants to merge; requests are process-local with no durable journal.
  evidence: docs/capabilities/integration/CAP-INT-mcp-services.md:168-173
  suggested_action: Decide how the call waits for checks and how a later call may merge.
  resolution: open
- issue: 'Contract texts needing amendment: CAP-INT section 1 (network exclusion, PR operations excluded), section 2 (fixed FF method and network exclusion), section 4 (executor invokes no network operation), section 6 (no external API); CAP-WT section 5 (devkit never pushes the task branch or opens a pull request). ADR-integration-approval-asserted holds if only the native form grants the authority; ADR-branch-guards-and-close-discard requires a non-forced conditional remote deletion and allows PR-bound tasks on a --no-worktree branch.'
  evidence: docs/capabilities/integration/CAP-INT-mcp-services.md:34-35,58-59,77,151-152,193; docs/capabilities/worktree/CAP-WT-task-worktrees.md:125; docs/decisions/2026-10/20261016-branch-guards-and-close-discard.md:60-71
  suggested_action: Amend CAP-INT and CAP-WT in Development's reconcile; no superseding ADR.
  resolution: open
- issue: devkit-spec cleanup _is_post_git requires HEAD == source_sha, false after any merge commit (already planned by PROP-integration-follow-ups for the local route).
  evidence: packages/devkit-spec/src/devkit_spec/cleanup.py:167-176
  suggested_action: Reuse the follow-ups change (HEAD contains the result); for the PR route the result is the platform merge commit.
  resolution: open
