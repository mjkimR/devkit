answers:
- question: q-checks-wait
  choice: a
  decision: 'Both paths: an already-pushed ready PR with passing checks is merged in the approving call; otherwise the call publishes and returns INTEGRATION_CHECKS_PENDING, and integration_resume merges only while the remote target is unchanged.'
- question: q-unchecked-landing
  choice: null
  decision: Cleanup always runs once the merge is confirmed and the approved source SHA is an ancestor of the fetched target, whether or not devkit checked the target the merge landed on; a landing on an unchecked target is reported as a notice with a stable code and a directive to run the checks on the landed target, never as a checked success.
  constraints:
  - Cleanup stops only when source ancestry fails (a rewritten target), because removing the branches could then lose commits.
  - Re-running the checks on the landed merge is not part of this route.
