summary: single medium pass; direction, gh port and layering hold and no accepted ADR is contradicted; 2 P1 (confirmation target taken from the local base instead of the fetched remote target; one-call merge impossible with required checks or reviews until q-checks-wait is decided), 9 P2 and 3 P3 on cleanup order, push/upstream binding, PR identity, unknown outcomes, post-landing policy source, remote deletion, lock and timeouts, codes and fakes.
findings:
- issue: The confirmation target, target policy and source-contains-target check stay on the local base while the merge lands on the remote target; the approval binds no remote target SHA.
  evidence: proposal.md 3.4 Approval binding and Execution; packages/devkit/src/devkit/worktree/planning.py:104-106; PROP-integration-follow-ups proposal.md (only advances after prepare are tolerated)
  failure_condition: Local main lags origin/main; the merge absorbs N pre-prepare commits as later advances. Local main ahead; the route always refuses.
  suggested_action: Fetch the bound remote target ref at prepare, make it the confirmation target, require the source to contain it, bind the remote target ref from the local target's upstream, read the target policy from that commit.
  resolution: open
  severity: P1
- issue: One-call execution pushes, creates the PR and merges at once; required checks start only after the push and the author cannot approve their own PR, so repositories with required checks or reviews always refuse.
  evidence: proposal.md 3.4 Execution; CAP-INT-mcp-services.md:168-173; spec-integrate/SKILL.md:61; PROP-integration-follow-ups approval lifetime
  failure_condition: Any repository with a required status check or review.
  suggested_action: 'Decide: W1 publish before approval (agent pushes and opens the PR as spec-integrate does today) with W2 fallback, or W2 publish and return a waiting code with strict resume; reject in-call waits, --auto and resume tolerance.'
  resolution: open
  severity: P1
- issue: Landing classification lumps an advance in the race window, a rewritten target and a tree mismatch; guards, receipt check and result policy never ran against the real first parent; cleanup after it is undecided.
  evidence: proposal.md 3.4 Landing verification; PADR-pull-request-merge-with-pinned-source-and-verified-landing
  failure_condition: Cleanup removes the worktree a fix would be made in although readiness fails on the landed merge; a rewrite is treated as a benign advance.
  suggested_action: Separate codes per case; for an advance continue cleanup only when post-hoc checks pass (U3), always stop before cleanup for a rewrite or tree mismatch.
  resolution: open
  severity: P2
- issue: Local fast-forward and cleanup preconditions contradict plan_finish/validate_finish (base on target and clean); skipping the fast-forward breaks finish's merged test, _is_post_git and git branch -d; the --no-worktree case is unspecified.
  evidence: planning.py:88-93,132-140; service.py:232-238; cleanup.py:167-176; ADR-branch-guards-and-close-discard
  failure_condition: A merged PR whose worktree and branch cannot be cleaned through the route.
  suggested_action: Keep the existing base preconditions, order cleanup (fast-forward, worktree and branch -d, remote deletion, extensions), stop with a code before local deletion when the fast-forward is skipped, require a --no-worktree base checkout switched back first.
  resolution: open
  severity: P2
- issue: prepare refuses a source whose upstream lacks its commits (WORKTREE_BRANCH_UNPUSHED) and validate_finish binds source_upstream, both clashing with the push step; remote head judgement and push timeout unspecified.
  evidence: planning.py:73-78,107-108,156-157; lifecycle.py:1270-1292
  failure_condition: The route refuses the normal pre-push state, or a push with -u voids the request mid-call.
  suggested_action: Skip that refusal on the PR route, push an explicit refspec without -u or force, judge the remote head via ls-remote, resolve a timed-out push from ls-remote.
  resolution: open
  severity: P2
- issue: PR identity, title/body, draft handling, stale closed PRs and gh repository resolution (-R) are unspecified.
  evidence: proposal.md 3.4 Approval binding; packages/devkit/src/devkit/worktree/stale.py:43-61
  failure_condition: Wrong repository, silently adopted foreign PR, earlier merged PR mistaken, draft refused after approval.
  suggested_action: -R from the bound remote on every call, bind create or the exact PR number, devkit-composed title and body, define draft handling, select OPEN PRs by head and base.
  resolution: open
  severity: P2
- issue: Unknown outcomes covered only for the merge; run_gh drops stderr; restart re-entry detects merged from local state.
  evidence: stale.py:39-61; PROP-integration-follow-ups Already merged
  failure_condition: A transport failure after a server merge reported as failed; a restart leaves a merged PR whose cleanup cannot be prepared.
  suggested_action: Classify nonzero exits as unknown unless a recognised refusal, resolve push/create/delete from ls-remote and PR lists, detect cleanup-only on the PR route from PR state and the fetched target.
  resolution: open
  severity: P2
- issue: The post-landing policy check reads the local base after fast-forward, which may carry later foreign config changes.
  evidence: packages/devkit/src/devkit/integration/service.py:232-234,257-264
  failure_condition: A correct merge's cleanup fails with INTEGRATION_REQUEST_STALE after another unit changes config on the target.
  suggested_action: Check the result policy digest on the landed merge commit.
  resolution: open
  severity: P2
- issue: 'Remote deletion side effects: dependent PRs, unnamed lease mechanism and its upstream pruning, deleteBranchOnMerge regardless of delete_branch.'
  evidence: PADR-github-pull-request-adapter-in-devkit-worktree; CAP-WT-task-worktrees.md:106
  failure_condition: Another task's open PR closed; the form misstates the remote branch outcome.
  suggested_action: Refuse deletion when an open PR uses the branch as base, name git push --force-with-lease=<ref>:<sha> --delete after git branch -d, disclose deleteBranchOnMerge.
  resolution: open
  severity: P2
- issue: Network steps run under the integration lock and outside the follow-ups time budget against host tool-call timeouts.
  evidence: PROP-integration-follow-ups 3.2 Bounds; packages/devkit/src/devkit/worktree/stale.py:36
  failure_condition: The host cuts the call mid-push or mid-merge, or a concurrent local integration fails LOCK_HELD.
  suggested_action: Per-step bounds and a total budget measured against hosts; lock only around local build, checks, fast-forward and cleanup; document host timeouts and integration_status.
  resolution: open
  severity: P2
- issue: No code table and no offline test design.
  evidence: proposal.md 3.4; CAP-INT-mcp-services.md:191-193
  failure_condition: Invented codes; race and unknown paths untested.
  suggested_action: Add a code table and a fake PR port backed by a bare repository with configurable merge parents, tree, exit and timeout; list acceptance tests.
  resolution: open
  severity: P2
- issue: MCP tool annotations become open-world.
  evidence: packages/devkit/src/devkit/integration/mcp.py:70-105
  failure_condition: Annotations understate effects.
  suggested_action: Add openWorldHint to the contract list.
  resolution: open
  severity: P3
- issue: gh pr merge --subject without --body lets GitHub fill caller text; delete_branch meaning extends to remote branches.
  evidence: CAP-DLV-project-policy.md:52-53,137
  failure_condition: Caller text in a protected commit; unexpected remote deletions.
  suggested_action: Explicit devkit-composed body; state the delete_branch extension in CAP-DLV and the form.
  resolution: open
  severity: P3
- issue: GitHub classified by URL refuses SSH aliases and GitHub Enterprise.
  evidence: PADR-github-pull-request-adapter-in-devkit-worktree
  failure_condition: A legitimate GitHub remote refused.
  suggested_action: Resolve the repository with gh repo view -R; refuse only when gh cannot.
  resolution: open
  severity: P3
