summary: 'Engine findings confirmed. Recommended option B conflicts with 01 4.7 (separate Planning and Development PRs, accepted proposal on the base as the start queue) and breaks the 7.4 supersede/abandon close; the comparison omitted rows where A wins. Shared gaps: task_kind not shown at acceptance, handoff guard scope, planning_effort hint, sweep check precision, two misquoted sources.'
findings:
- issue: B breaks the 01 4.7 principle that Planning and Development use separate branches and PRs (the accepted proposal on the base is the start queue; reviewers may differ); neither the strategy-change list nor the comparison mentions it.
  evidence: workbench docs/strategy-layer/01-master-flow.md:238; proposal.md 3.2; materials/options-comparison.md table
  failure_condition: Under pull_request=required with a team reviewer the direction is first reviewed inside the Development PR, after the implementation exists.
  suggested_action: List 4.7 as an amendment for B or prefer A; add the row to the comparison.
  resolution: open
  severity: high
- issue: 'Under B the 01 7.4 supersede and abandon closes cannot act on a directly accepted draft: the base copy stays draft, and proposal new --supersedes refuses a non-accepted proposal.'
  evidence: 01-master-flow.md:558-559; packages/devkit-spec/src/devkit_spec/proposals/scaffold.py:161-190; references/classification.md 4
  failure_condition: A supersede after a direct acceptance under B fails with SPEC_PROPOSAL_NOT_APPROVED; abandon has no accepted proposal on the base to reference.
  suggested_action: Specify close semantics for B or choose A, where the close works unchanged.
  resolution: open
  severity: high
- issue: In B the eligibility check runs only after dev-<slug> exists; a refusal or an interrupted session leaves a draft on dev-<slug> that attach refuses and the new guard turns into a Backlog block.
  evidence: packages/devkit-spec/src/devkit_spec/attach.py:86-87; PADR-direct-acceptance-command-and-handoff-guard 4
  failure_condition: Resume with --existing-branch fails WORKTREE_ATTACH_REFUSED; running Planning instead needs an unmentioned discard.
  suggested_action: Add a read-only eligibility pre-check before any branch is started and state the discard on refusal.
  resolution: open
  severity: medium
- issue: B's state 'draft on the base while dev-<slug> owns the slug' is guarded only by check; Planning start, padr and list display still treat it as a runnable draft.
  evidence: packages/devkit-spec/src/devkit_spec/proposals/backlog.py:44; scaffold.py:574; cli/documents.py:438-443; sdd-proposal.md Planning start
  failure_condition: Planning starts on plan-<slug> from the base draft while dev-<slug> is in review; the two merges conflict.
  suggested_action: Guard Planning start, padr and display against dev-<slug>, or avoid the state (A).
  resolution: open
  severity: medium
- issue: 'cloud-pr and autohub are not covered: under B a draft never becomes accepted on the base, so autohub''s start action never offers it.'
