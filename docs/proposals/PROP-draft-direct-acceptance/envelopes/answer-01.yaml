answers:
- question: acceptance-point
  choice: a2-backlog-base
  decision: Direct acceptance is Backlog work on the base checkout under every pull_request policy; under required the request names the missing PR review and the user may choose Planning for that draft instead.
- question: gates-in-one-exchange
  choice: one-request-two-answers
  decision: One request may ask plan-intent and plan-accept together for an eligible draft without a recorded intent, when it names both decisions and the user answers both explicitly; accepting only the intent leaves a draft for Planning.
- question: session-reclassification
  choice: allow-with-user-decision
  decision: A queued draft without PADRs may, on the user's explicit decision at pickup, be deleted as Backlog work that preserves its open feedback and be done as a session task; the exception to the lowering rule is recorded in an ADR.
