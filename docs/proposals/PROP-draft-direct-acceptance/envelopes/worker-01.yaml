questions:
- id: acceptance-point
  title: Direct acceptance path
  prompt: Which path does direct acceptance take, if any?
  context: Compared against today's Planning at low in materials/options-comparison.md, revised after four challenger passes. A2 commits the acceptance on the base as Backlog work under every policy, inside the existing Backlog exemption; it saves the plan branch, its merge or PR, the reviewing commit, the worker record and the question round, and needs 01 section 4.7, 03 section 3 and 03 section 4 amended explicitly. Under pull_request = required the direction then gets no PR review unless the user chooses Planning for that draft. A2a offers it only under pull_request = auto, which keeps the Planning PR under required but needs a new rule and makes a policy key decide the flow structure (against 03 section 1). D adds no path and ships only the handoff guard and the planned accept command. A3 (one-commit Planning branch), B and C were dominated or rejected in the comparison. Under the defaults (auto, no worktree) A2 saves two Git operations, a commit, a record and a question round per small draft.
  options:
  - id: a2-backlog-base
    description: A2. Backlog acceptance on the base under every policy; under required the request names the missing PR review and the user may choose Planning
    recommended: true
  - id: a2a-backlog-base-auto-only
    description: A2a. As A2 but offered only under pull_request = auto; under required small drafts keep Planning at low
    recommended: false
  - id: d-no-new-path
    description: D. No direct acceptance; ship only the handoff guard and the planned accept command
    recommended: false
  allow_note: true
- id: gates-in-one-exchange
  title: Both gates in one request
  prompt: May one request ask plan-intent and plan-accept together for an eligible draft whose plan-intent is not yet recorded?
  context: Drafts may be filed without a recorded intent (01 section 5.1). Either way the two are separate records, each the user's explicit answer, and plan-accept is never inferred from plan-intent; the engine records plan-intent first, then plan-accept. Moot if acceptance-point is D.
  options:
  - id: one-request-two-answers
    description: Yes, when the request names both decisions (intent with task-kind, depth and effort hints; acceptance with Planning skipped and the eligibility reason) and the user answers both explicitly; accepting only the intent leaves a draft for Planning
    recommended: true
  - id: intent-first
    description: No; eligibility requires plan-intent recorded in an earlier exchange
    recommended: false
  allow_note: true
- id: session-reclassification
  title: Session-depth drafts
  prompt: May a queued draft whose work is session depth be deleted at pickup and done as a session task instead?
  context: Direct acceptance always ends in a spec Unit (spec.md, plan, tasks, reconcile), which is heavier than session work. Deleting a draft is already Backlog work, but doing so to run it as a session lowers the depth the draft was confirmed with, which 01 section 2.2 and classification.md section 3 forbid except through a handoff; allowing it needs that rule amended and an ADR. A session task cannot be a milestone member; the draft's open feedback is preserved per feedback retirement.
  options:
  - id: allow-with-user-decision
    description: Allow it on the user's explicit decision at pickup, as a Backlog deletion that preserves open feedback, for drafts without PADRs; record the exception to the lowering rule in an ADR
    recommended: true
  - id: always-direct-acceptance
    description: Not allowed; a session-depth draft uses direct acceptance (or Planning) and becomes a spec Unit
    recommended: false
  allow_note: true
activity_effort: high
