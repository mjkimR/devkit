answers:
- question: planning-acceptance-without-record
  choice: revert-planning-merge
  decision: A Planning acceptance without its gate record is recovered by reverting the whole Planning merge on the base back to draft and running Planning again, and a refused --direct repair is undone the same way by reverting its draft->accepted edit; no new command path is added.
- question: base-checkout-definition
  choice: positive-base-check
  decision: accept --direct runs only when the current worktree is the main worktree and its branch equals the integration base (the origin/HEAD target when it resolves, as the integration resolves it); anything else is refused.
- question: reclassification-on-protected-base
  choice: keep-restriction
  decision: Session reclassification stays limited to bases the Host can push to (or with no remote); on a protected base the draft keeps its normal route, as for direct acceptance.
