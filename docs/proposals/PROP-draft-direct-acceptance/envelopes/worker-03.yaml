questions:
- id: planning-acceptance-without-record
  title: Unrecorded Planning acceptance recovery
  prompt: The handoff guard refuses a proposal that went through Planning (it has a worker envelope) and is accepted without a recorded plan-accept. Which recovery should the proposal name?
  context: 'Only a hand edit can produce this state. Every accepted proposal in this repository has its gate record. Round 5 dropped the plain-form repair. Round 6 showed that the example recovery it left ("revert the hand edit") strands the proposal: status reviewing on the base, no plan-<slug>, and no route out (challenger-06 #1, which recurs challenger-03 #2).'
  options:
  - id: revert-planning-merge
    description: Revert the whole Planning merge on the base back to draft, then run Planning again. A refused --direct repair is likewise undone by reverting its draft->accepted edit. No new command path.
    recommended: true
  - id: plain-form-repair-on-fresh-branch
    description: The plain form also accepts an accepted proposal with no gate record when a worker envelope exists. It runs on a fresh plan-<slug> from the base and is merged per policy (a PR under required). This adds a code path, and whether the engine allows it has not been checked.
    recommended: false
  - id: leave-to-user
    description: Keep the current text (the refusal goes to the user, no route is named) and list the gap at plan-accept.
    recommended: false
  allow_note: true
- id: base-checkout-definition
  title: Base checkout for a direct acceptance
  prompt: How should accept --direct decide that it runs on the base?
  context: 'Today it refuses a detached HEAD, plan-*/dev-* branches and branches with a recorded devkitBase. A hand-made wip or release branch still passes, so the claim "any branch other than the base is refused" is false (challenger-06 #2, which recurs challenger-05 #6).'
  options:
  - id: positive-base-check
    description: Positive check. The current worktree must be the main worktree, and its branch must equal the integration base (the origin/HEAD target when it resolves, as the integration resolves it). Anything else is refused.
    recommended: true
  - id: negative-list-only
    description: Keep the negative list and drop the false claim. A non-devkit branch is then accepted, and the Host's push-access check is the only guard.
    recommended: false
  allow_note: true
- id: reclassification-on-protected-base
  title: Reclassification on a protected base
  prompt: Round 5 limited session reclassification to bases the Host can push to. Should it stay that way?
  context: 'With this limit, a repository with a protected base always sends queued session-depth work through Planning and a spec Unit. Direct acceptance is unavailable there too. Your earlier answer (session-reclassification) did not cover this (challenger-06 #4, Decision needed).'
  options:
  - id: keep-restriction
    description: Keep it. A protected base keeps the draft on its normal route, the same as for direct acceptance.
    recommended: true
  - id: deletion-on-session-branch
    description: Make the deletion the first commit of the session's dev-<newslug> PR. The draft then stays visible and editable on the base until that merge.
    recommended: false
  allow_note: true
