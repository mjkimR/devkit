questions:
- id: q1
  title: Split each area record by outcome
  prompt: Should compaction write one record per capability area and outcome (FB-compacted-<area>-<status>), or one record per area with a new terminal status `compacted`?
  context: A feedback record has one status, and the four outcomes (resolved, promoted, dismissed, forwarded) mix within an area. Splitting by outcome keeps every record's status true with today's vocabulary, keeps `--status dismissed --history` meaningful and keeps the change inside devkit-spec; it means up to four records per area instead of one. A single record per area needs a new terminal status in the feedback kind (devkit-docs kinds table, devkit-spec STATUSES, terminal-history tests and CAP-DOCS-document-model), widening the spec to a second package. The proposal and both PADRs are written for the recommended option.
  options:
  - id: a
    description: One record per area and outcome, existing statuses unchanged (at most four records per area).
    recommended: true
  - id: b
    description: One record per area with a new terminal status `compacted`; adds devkit-docs and CAP-DOCS-document-model to the scope and drops status filtering of past outcomes.
    recommended: false
  allow_note: true
