- question: q1
  choice: a
  decision: Both roles are read-only; the Host applies only what the user decides with the existing commands.
- question: q2
  choice: a
  decision: No envelope for a Backlog role return; the role returns a message and the Backlog commit body names the role used.
- question: q3
  choice: a
  decision: The Host delegates triage on a native host when the open-feedback listing has more than 5 items, and stays inline otherwise.
- question: q4
  choice: a
  decision: The decomposer runs from Backlog only, for a needs_decompose draft after its Planning return is merged or on the user's split request, never self-initiated.
  constraints:
  - 'Redefine size XL as judgeable: the work would produce two or more specs, or bundles deliverables of different nature.'
  - An XL draft cannot pass plan-intent or start Planning; the deterministic check is an error at the plan-intent gate, workflow next and plan-intent acceptance with a directive to decompose first; the exact place (workflow condition or rule) is settled from evidence in Planning.
  - 'Both ways out end in decomposition through the decomposer: split into --decomposed-from children, or promote to a new milestone holding the children when there are three or more children or the theme is long-running.'
  - A mis-sized draft declared M or L stays caught by Planning's needs_decompose return.
  - Multi-unit orchestration hardening is a non-goal only, with no follow-up proposal and no milestone.
  - A challenger round on the folded result is allowed.
