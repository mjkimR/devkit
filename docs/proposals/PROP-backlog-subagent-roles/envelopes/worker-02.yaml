    description: 'Read it as would need separate specs or a different task_kind, with one example of each side in the template and CAP-DLV-proposal-incubation. Pros: checkable from the handoff model (one proposal hands off to one spec of one task_kind); this proposal stays M. Cons: clause 2 then adds little beyond clause 1 apart from mixed task kinds.'
    recommended: true
  - id: b
    description: 'Keep the wording as written and add examples only (for example, agent guidance together with an engine change). Pros: catches bundles of unrelated deliverables that could still share one spec. Cons: remains a judgment two Hosts can make differently, and this proposal would likely be XL and need a split.'
