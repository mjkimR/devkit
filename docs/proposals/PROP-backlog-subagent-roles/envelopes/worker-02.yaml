questions:
- id: q5
  title: Where does the XL gate speak?
  prompt: The XL gate blocks deterministically in every option; should devkit workflow next and workflow answer also print a decompose directive themselves, which needs a devkit-agt change?
  context: The user asked for an error, not a warning, at the plan-intent gate, workflow next and plan-intent recording. devkit-spec alone can block at all three, but next then shows a stage unmet at exit 0 with detail size=XL, and answer refuses with the generic REQUEST_UNKNOWN; devkit-spec owns no coded output there (spike F7, challenger-02 findings 1 and 2). This decides whether packages/devkit/ stays excluded and whether dev_effort stays medium.
  options:
  - id: a
    description: 'devkit-spec only. The intent-proposal exit condition blocks the gate under ask and auto; accept --direct lists a size blocking line with the decompose text under SPEC_PROPOSAL_NOT_ELIGIBLE; the plan- attach adds a decompose reason under WORKTREE_ATTACH_REFUSED; Planning step 1 returns an XL proposal; skill text tells the agent to read the unmet size check as decompose first. Pros: no cross-package contract, size M and dev_effort medium hold. Cons: next and answer show no directive of their own, so an agent that skips the skill text could edit size to pass; Planning''s return limits that.'
    recommended: true
  - id: b
    description: 'Add a generic devkit-agt feature: a workflow exit check may declare a fix, which next renders beside the unmet check and answer adds to REQUEST_UNKNOWN details (FB-workflow-exit-check-without-directive); devkit-spec uses it for the size check, plus everything in a. Pros: the directive reaches the agent from the command output, reusable for every bundle. Cons: lifts the packages/devkit/ exclusion, changes the workflow schema and CLI output contract, raises size to L and dev_effort to high.'
    recommended: false
  - id: c
    description: 'Add a new devkit-agt extension group that lets devkit-spec raise a coded [ERROR] advisory at next and answer for an XL unit. Pros: a real error code at every point, as literally asked. Cons: next would fail for a valid queued Backlog draft, a new cross-package extension contract likely needs an ADR, and it lifts the packages/devkit/ exclusion with the same size and effort rise.'
    recommended: false
  allow_note: true
- id: q6
  title: What does different nature mean?
  prompt: How should the second clause of the XL definition, deliverables of different nature, be judged?
  context: XL means the work would produce two or more specs, or bundles deliverables of different nature. Two Hosts must classify the same draft the same way, because the gate refuses XL. Read literally, this proposal (agent contracts plus gate code) could itself count as XL; the decision also sets its own size.
  options:
