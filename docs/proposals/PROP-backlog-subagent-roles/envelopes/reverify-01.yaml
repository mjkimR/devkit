  failure_condition: The Host moves a parent's open feedback into a child or names it in Source feedback, misplacing it or promoting it without a hygiene decision
  suggested_action: Drop per-child assignment; leave open feedback to the retirement move; optionally flag relevance as hygiene input
  resolution: resolved
  severity: P1
- issue: Resolve-before-write rule drops proposed child IDs and edges to them, which cannot resolve before the children exist
  evidence: proposal.md:84-88,100-101; backlog.md.jinja Prerequisite disposition step 2
  failure_condition: A rewired incoming depends_on to PROP-<child> is dropped and the dependent loses its prerequisite silently
  suggested_action: Existing IDs must resolve; proposed child slugs must not; edges to children are written after creation in the same commit
  resolution: resolved
  severity: P2
- issue: git status --short unchanged misses a write to an already-modified file; Backlog has no clean-tree requirement; scout matrix lacks disallowedTools
  evidence: proposal.md:42-44,96,107-108; backlog.md.jinja:11; feedback-hygiene/SKILL.md:8; subagents/scout.md:10-14 vs challenger.md:13-16
