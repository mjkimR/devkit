summary: 'round 5; outside the cap at the user''s request, on the round-4 fix batch 05c068b..ac05a91. challenger-04 #2, #3, #4, #5 and #7 resolved; #1 partly (mode and contract source stated, the Development Host''s validation has no defined basis: F1); #6 resolved for its two bullets (the live-turn bullet: F6). No P1, no recurrence; four P2 (Development Host validation basis, unrecorded pause, nested role outside the bounded turn, bounded turn without a Host side) and four P3 (Fails cleanup, live-turn acceptance check, direct mode not carried into the spec, Codex Host test rerun).'
findings:
- issue: The Development Host validates the live turn's range "with the checks of references/worker.md", which are written for the spawning Host; its outcome feeds nothing (Passes counts only the Codex Host's check), and the request names no write scope, activity-effort or base head for the Codex Host's payload, so the two range checks can judge one range against different scopes.
  evidence: PADR-codex-process-worker.md:95-101, :105-106, :108-109, :112-114; main spec-delegate/references/worker.md:21,30-31,34,40,41-46; main payload.md:3,23
  failure_condition: The Codex Host's payload has a wider write scope than the spec's tasks; its check passes, Passes is recorded and the key ships while the Development Host's check of the same range fails with no stated effect, or blocks after Passes was recorded.
  suggested_action: State the Development Host's checks (named head an ancestor of the final head, worktree HEAD equals it, every path in the named write scope, clean status, affected tests rerun in the worktree), a failure being its own blocking worker envelope and a Fails; add the Development Host's validation to Passes; add the write scope, activity-effort and expected last accepted head to the request.
  resolution: open
  severity: P2
- issue: The Development Host's pause for the user is unrecorded and leaves the range start loose; worker-records requires a direct Host to write its worker envelope whenever it stops for the user, and a needs_input envelope needs a question or a problem, which would bring back the dropped user-action question.
  evidence: main skills/spec/references/worker-records.md:9,20; main workflows/sdd-spec-feature.md:155; main bundle/AGENTS.md:65-66; PADR-codex-process-worker.md:93-101, :105, :128-129
  failure_condition: The Host writes a needs_input action question (the removed hold), a malformed needs_input without one, or asks with uncommitted edits so the two Hosts' range starts differ; a session ending while waiting leaves no record of the pending turn.
  suggested_action: Before asking, the Development Host commits all its work and ends its run with a completed worker envelope at the current stage naming the pending verification task; its final head is the head named in the request and the start of both range checks; the pause is a step of the accepted plan, not a stop on a problem; the user's report starts a new Host run.
  resolution: open
  severity: P2
- issue: The live task_goal requires one nested support role while the bounded-turn clause says the turn does only the named spec tasks, and nothing in the development-worker procedure spawns a role during a build task.
  evidence: PADR-codex-process-worker.md:85-87, :95-96, :113-114; main development-worker.md:40
  failure_condition: The worker spawns no role and the turn Fails for a reason unrelated to the launch, or it spawns one its contract does not allow.
  suggested_action: Reword to "does only those tasks and the support roles the task_goal names"; the request names the role and where its return is recorded; the contract test asserts the wording.
  resolution: open
  severity: P2
- issue: The bounded turn has no Host side since the fold dropped "the Host continues with a new turn"; main defines completed as the final change report holding, CAP-DLV says the worker runs to the final change report, and spec-orchestrate says a worker never leaves the finishing to the Host; on Fails the bounded turn ships with no procedure that uses it.
  evidence: round5-diff.patch:34-37 vs :44-47; PADR-codex-process-worker.md:85-88, :120, :124-126; main development-worker.md:50; CAP-DLV-delivery-workflows.md:360-361; main spec-orchestrate/SKILL.md:32
  failure_condition: The shipped contract allows a completed that leaves Development unfinished while CAP-DLV and spec-orchestrate promise a full turn; a Host reads a bounded completed as a finished turn.
  suggested_action: The development-worker Return, CAP-DLV-delivery-workflows §4.6 and spec-orchestrate step 2 state the bounded turn (a Host may pass one and on its completed validates the range and continues with a new turn or itself), shipped whatever the outcome; or ship the bounded turn only with the launch (a decision change, for plan-accept).
  resolution: open
  severity: P2
- issue: The Fails cleanup is unnamed; a live turn stopped on a problem leaves a problem envelope and possibly uncommitted files, so the unit stays blocked and "either outcome completes Development" depends on an unassigned resolution and cleanup.
  evidence: PADR-codex-process-worker.md:117-120, :128-129; PADR-worktree-access-preconditions.md:96-105; main worker-records.md:44-47; main worker.md:34
  failure_condition: Development records Fails and removes the key, but the gates stay held and devkit worktree finish --merge refuses the branch (WORKTREE_BLOCKED).
  suggested_action: The Development Host first commits or removes what the live turn left uncommitted, commits the removal with a resolution naming each problem envelope of the live turn, and reverts or finishes the live turn's unfinished commits.
  resolution: open
  severity: P3
- issue: The sixth acceptance check is neither mechanical nor labelled a review check and cites the live turn's own worker envelope, which a not-run or refused-probe turn does not have.
  evidence: proposal.md:152-154; PADR-worktree-access-preconditions.md:92-94
  failure_condition: A not-run or refused-probe Fails outcome has no envelope to show, or nobody owns the check.
  suggested_action: Reword as a review check of the tasks.md record (and the worker envelope when the turn ran past its probe) against the Passes criterion.
  resolution: open
  severity: P3
- issue: The direct-mode decision lives only in the PADR while main lets the user choose local-orchestrated at any turn boundary, and the handed-off spec is not told to carry the constraint.
  evidence: PADR-codex-process-worker.md:89-91; main spec-orchestrate/SKILL.md:8,32; main bundle/AGENTS.md:73-75
  failure_condition: Mid-Development the user invokes spec-orchestrate and the Host spawns main's development-worker, which lacks the probe and the bounded turn.
  suggested_action: The spec's plan.md and its verification task state it; a Host asked to orchestrate this unit tells the user the conflict before it spawns.
  resolution: open
  severity: P3
- issue: The Codex Host's escalated steps leave out rerunning the unit's checks in the sibling worktree, which worker.md requires on the returned head and a base-rooted Codex session cannot do inside its sandbox.
  evidence: PADR-codex-process-worker.md:98-99; main worker.md:35; PADR-worktree-access-preconditions.md:32-34
  failure_condition: The rerun is denied, so the Codex Host stops and the live turn is lost, or accepts without confirming the tests.
  suggested_action: Add rerunning the affected tests in the worktree to the escalated steps, or leave the test rerun to the Development Host.
  resolution: open
  severity: P3
assumptions:
- The branch's references/worker.md keeps main's checks plus the PADR-worktree-access-preconditions additions
- The Development Host runs on a host other than the Codex Host; the Codex Host is an interactive session that can ask for escalation
- A completed worker envelope written mid-activity, before the final stage, is valid (worker-records lists completed as a run outcome)
- The decisions summarized to the user count as the user's; findings challenge only how they are specified
