questions:
- id: codex-worker-scope
  title: Codex worker path in Development
  prompt: Should Development add a Codex process worker (codex exec rooted in the worktree), or keep Codex running each activity in direct and document the verified reasons only?
  context: 'A Codex subagent cannot reach a sibling worktree: spawn_agent keeps the parent''s cwd and sandbox, and a commit needs both <repo>/.git and <repo>/.git/worktrees/<name> granted exactly (verified with codex sandbox). A codex exec process rooted in the worktree with those two grants can commit, but each turn is a separate model session started as an escalated command, approval is never inside exec, and nested roles, trust, the commit gate''s tooling and the Host''s command timeout are unverified until one live turn. PADR-codex-process-worker ships the launch only if that live turn passes. process-worker keeps dev_effort high and size M; keep-unsupported lowers them to medium and S and deletes PADR-codex-process-worker before handoff.'
  options:
  - id: process-worker
    description: Add the Codex process worker, shipped only if one live Codex turn passes in Development
    recommended: true
  - id: keep-unsupported
    description: Keep Codex unsupported; document the verified reasons and preconditions only
    recommended: false
  allow_note: true
- id: codex-live-turn
  title: Who runs the live Codex turn
  prompt: If the Codex process worker is in scope, who runs its one live verification turn during Development?
  context: The turn uses your Codex account and credentials, starts a model session, and must be launched from a Codex Host so the escalated launch, approval and timeout are exercised. A Development worker on Claude Code could run codex exec itself, but that skips the Codex Host's sandbox and approval path the procedure depends on. Ignored when codex-worker-scope is keep-unsupported.
  options:
  - id: user-codex-host
    description: You run it from a Codex session in this repository when Development reaches the verification task; the record goes into the spec's materials
    recommended: true
  - id: authorize-development
    description: Authorize the Development run to invoke codex exec itself from the current Host (no Codex Host sandbox or approval path exercised)
    recommended: false
  allow_note: true
- id: antigravity-verification
  title: Antigravity live verification
  prompt: Should Development run a live Antigravity worker check, or keep Antigravity unverified with its documented preconditions?
  context: Antigravity is installed locally. Its docs show subagents inheriting the parent's scopes, access outside the project folders off by default (allowNonWorkspaceAccess, /add-dir) and an undocumented .git handling. A live check would need an Antigravity session set up for non-workspace access and adds a third host to Development's verification.
  options:
  - id: keep-unverified
    description: Keep Antigravity unverified; document the preconditions only
    recommended: true
  - id: live-verify
    description: Run one live Antigravity worker turn in Development and set the status from its result
    recommended: false
  allow_note: true
activity_effort: high
