summary: 'Claude Code and Antigravity documentation: no host gives a subagent its own working directory or a per-agent extra directory; Claude Code access is session-level (additionalDirectories needs trust, edits follow the permission mode, the sandbox protects base .git objects/refs from a base-rooted session); isolation: worktree and WorktreeCreate cannot target an existing devkit worktree; --add-dir loads a project''s agents; Antigravity keeps outside-project access off by default.'
findings:
- issue: 'Claude Code: permissions.additionalDirectories is a session-level list of literal directory paths (globs undocumented); a checked-in .claude/settings.json applies it only after the user accepts the workspace trust dialog and never under claude -p in an untrusted folder. It grants file access only; edits follow the permission mode (acceptEdits auto-approves edits in working and additional directories; default prompts).'
  evidence: code.claude.com/docs/en/settings-reference#permissions-additionaldirectories; /permissions#project-allow-rules-and-workspace-trust; /permission-modes
  suggested_action: Do not project per-worktree paths from devkit sync; document the session precondition per permission mode in spec-delegate references/hosts.md.
  resolution: open
  severity: high
- issue: Claude Code subagents start in the main conversation's working directory; frontmatter has no cwd or per-agent additionalDirectories key; permissionMode is ignored when the parent runs in auto, acceptEdits or bypassPermissions.
  evidence: code.claude.com/docs/en/sub-agents (supported frontmatter fields, permission inheritance)
  suggested_action: Keep absolute paths and git -C in the worker host block; no projection key solves the working directory.
  resolution: open
  severity: medium
- issue: 'Claude Code sandbox: inside the cwd, .git/hooks, .git/config and top-level HEAD, objects and refs are write-protected and allowWrite cannot exempt them; only when the cwd is a linked worktree are writes to the main repository''s shared .git allowed. A session rooted in the base checkout with the sandbox on therefore cannot commit from a sibling worktree through Bash.'
  evidence: code.claude.com/docs/en/sandboxing#filesystem-isolation,
  suggested_action: State the sandbox as a precondition that blocks worker commits from a base-rooted session; a process rooted in the worktree avoids it.
  resolution: open
  severity: high
- issue: 'Claude Code isolation: worktree creates <repo>/.claude/worktrees/<name> on worktree-<name> from worktree.baseRef (fresh or head only), one fresh worktree per subagent run, enforces refusal of paths and git redirects into the main checkout. A WorktreeCreate hook replaces creation for every worktree event (sessions, subagents, workflows), receives name plus common fields (agent_type inside a subagent), may return a path outside the repository, and its worktrees are kept (WorktreeRemove not run) when a subagent ends.'
  evidence: code.claude.com/docs/en/worktrees; /hooks#worktreecreate,
  suggested_action: The hook has no slug or branch input, so it cannot map a run to an existing plan-/dev- worktree; keep host-native isolation excluded.
  resolution: open
  severity: medium
- issue: Claude Code headless claude -p with cwd = worktree loads the worktree's (or, read through, the main checkout's) agents and skills, supports --agent, --permission-mode, --json-schema/--output-format json; project allow rules and additionalDirectories are unused when untrusted; prompts are denied non-interactively.
  evidence: code.claude.com/docs/en/headless; /cli-reference; /worktrees#what-worktrees-share-with-the-main-checkout
  suggested_action: Viable process worker for Claude Code if ever needed (sandbox case); not required while the native subagent works.
  resolution: open
  severity: low
- issue: Claude Code project subagents are discovered walking up from the cwd only; a parent-workspace session does not load a child project's .claude/agents, but --add-dir and /add-dir (v2.1.257+) load the added folder's agents and skills (the settings key does not).
  evidence: code.claude.com/docs/en/sub-agents; /permissions#additional-directories-grant-file-access-not-configuration
  suggested_action: In hosts.md, offer /add-dir <project> before falling back to emulation for a parent-workspace session (verify in Development).
  resolution: open
  severity: medium
- issue: 'Antigravity: documented .agents/agents/*.md subagents via invoke_subagent with workspace modes inherit, branch (own Git worktree, removed when the subagent is killed) and share; subagents inherit the parent''s file scopes and sandbox; access outside the project folders is off by default (allowNonWorkspaceAccess, /add-dir in the CLI); .git and sibling-directory behaviour, invoke_subagent parameters and branch-mode worktree location are undocumented.'
  evidence: antigravity.google/docs/subagents; /agent-settings; /cli/reference; /sandbox; /permissions (summarised renders)
  suggested_action: Keep antigravity unverified; record the access precondition (project folder or /add-dir) in hosts.md.
  resolution: open
  severity: medium
