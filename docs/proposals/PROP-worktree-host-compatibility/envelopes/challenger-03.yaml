findings:
- issue: 'The Host''s handling of a turn that ends without a committed envelope is undefined: no check of HEAD and status, no head value, the stopped worker''s earlier commits could be accepted at the next spawn, and a probe file left behind would block the next worker.'
  evidence: PADR-worktree-access-preconditions §4; spec-delegate references/worker.md last accepted head, clean status, blocked rule
  suggested_action: Host checks HEAD and status after any return without an envelope; the uncommittable case keeps the last accepted head and records a blocking worker envelope by explicit path when the Host can commit; the probe removes its file in the same command.
  resolution: open
  severity: medium
- issue: The Codex live turn's Passes criterion cannot be met by a Planning turn and asks only that tests run, not pass.
  evidence: PADR-codex-process-worker §4; proposal.md §4; planning-worker.md has no test step
  suggested_action: Make the live turn a Development turn whose affected tests run and pass inside the process; a sandbox-only failure is Fails.
  resolution: open
  severity: medium
- issue: The refused-probe exception (nothing written) conflicts with the sdd-proposal workflow and the sweep reference, which require feedback and sweep evidence from every Planning run, and neither file is in the boundary.
  evidence: packages/devkit-spec/src/devkit_spec/bundle/workflows/sdd-proposal.md; spec-feedback references/sweep.md; planning-worker.md step 6
  suggested_action: State in the worker contracts that a refused probe ends the turn before any of the run's write duties apply, pointed to from worker-records.md.
  resolution: open
  severity: medium
