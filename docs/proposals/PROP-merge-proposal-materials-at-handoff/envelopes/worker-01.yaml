questions:
- id: q1
  title: Merge or directive-only fix
  prompt: Should this proposal build the guarded material merge, or keep the refusal and only change the materials-case [ACTION] directive?
  context: 'The trigger (PROP-persistent-python-facts-cache) was a workflow deviation: measurements were written to docs/materials/ before handoff instead of into the proposal''s materials/. The merge only engages when the handoff falls on the same day as the existing dated directory; a next-day handoff splits materials across two directories silently. The merge adds a new mutation path whose data-loss risks the challenger mapped (findings 1-5). This decides the size and whether q2-q4 apply.'
  options:
  - id: a
    description: Build the per-leaf guarded merge as the proposal describes, with the Planning refinements in section 3 (size M). q2-q4 apply.
    recommended: true
  - id: b
    description: Keep the refusal; change only the SPEC_PROPOSAL_TARGET_EXISTS fix for an existing materials directory to 'move the files of [TARGET] into the proposal's materials/, then rerun the handoff' and update the contract (size S). q2-q4 become moot.
    recommended: false
  allow_note: true
- id: q2
  title: Concurrent target change guarantee
  prompt: Must leaf moves be no-clobber against a file that appears at a planned path after preflight, or is a documented residual window acceptable?
  context: os.rename silently replaces an existing file on POSIX, and the cross-file-system copy overwrites too, so a file created by another agent or editor between preflight and the move is lost. The ADR writes already have the same window. Applies only if q1 = a; if q1 = b nothing changes here.
  options:
  - id: a
    description: 'No-clobber: re-check absence with lstat right before each leaf move, move regular files with os.link + os.unlink (fails on EEXIST) and copy with O_CREAT|O_EXCL across file systems; a late collision fails the handoff with a full roll-back.'
    recommended: true
  - id: b
    description: Accept and document the residual window like the ADR writes; remove 'detect concurrent target changes' from Q2 and the acceptance criteria.
    recommended: false
  allow_note: true
- id: q3
  title: 'Equal symlinks: duplicate or conflict'
  prompt: When both the proposal and the destination hold a symbolic link at the same path with identical link text, is that a duplicate or a conflict?
  context: Bytes are compared only when both sides are regular files (lstat); a symlink against a regular file, or different link text, is always a conflict. This decides only the equal-link-text case. Applies only if q1 = a.
  options:
  - id: a
    description: 'Conflict: refuse with SPEC_PROPOSAL_TARGET_EXISTS; the user reconciles by hand. Simplest and never follows a link.'
    recommended: true
  - id: b
    description: Duplicate when os.readlink() text is equal; keep the destination link and drop the proposal's.
    recommended: false
  allow_note: true
- id: q4
  title: Reporting a successful merge
  prompt: How should a successful handoff that merged into an existing materials directory report it?
  context: Today the result carries only the materials directory. In a merge, byte-identical proposal copies are dropped and pre-existing files stay. Agent-first output carries only what changes the next step or must reach the user; a NOTICE goes to stderr and does not change the exit code. Applies only if q1 = a.
  options:
  - id: a
    description: Add result fields (merged into an existing directory; dropped duplicate paths) to the handoff result and JSON output, with no NOTICE.
    recommended: true
  - id: b
    description: Add the result fields and also emit one NOTICE listing the dropped duplicate paths.
    recommended: false
  allow_note: true
