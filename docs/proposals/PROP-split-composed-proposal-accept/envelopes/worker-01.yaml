questions:
- id: q1
  title: Composed acceptance subcommand shape
  prompt: Which command form should replace `devkit spec proposal accept --mode accept_only|accept_and_handoff`?
  context: This fixes the new contract that the CLI, the spec bundle guidance, CAP-DLV-proposal-lifecycle and the tests are rewritten to. `accept` keeps only the basic form (--by, --note, --direct, --check) in every option. The use case, its approval reply and its outputs already speak in `mode` (accept_only|accept_and_handoff) and require an effort only for accept_and_handoff.
  options:
  - id: a
    description: '`devkit spec proposal accept-plan <slug> --by user|policy --mode accept_only|accept_and_handoff [--effort low|medium|high]`: one subcommand, the mode vocabulary and use case unchanged; the effort-needs-handoff check stays in the use case (SPEC_PROPOSAL_APPROVAL_REPLY_INVALID) as today.'
    recommended: true
  - id: b
    description: '`devkit spec proposal accept-plan <slug> --by user|policy [--handoff-effort low|medium|high]`: no --mode; giving the effort selects accept_and_handoff, omitting it accept_only. Removes the last option dependency but renames the CLI vocabulary away from the documented mode names.'
    recommended: false
  - id: c
    description: 'Two subcommands, `accept-plan <slug> --by ...` (accept_only) and `accept-plan-handoff <slug> --by ... --effort ...` (accept_and_handoff): each help is complete with no conditional option, at the cost of two near-identical commands.'
    recommended: false
  allow_note: true
