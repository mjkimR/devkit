summary: 'All nine findings folded at c1aaeb02: text-digest key, widened fingerprint, fully tagged codec, unstorable marker, non-regular and symlink rules, defined speed baseline, snapshot claim corrected, Living Spec edits named (CAP-DIST unchanged, following its existing listing practice).'
findings:
- issue: The entry key is incomplete; the walk (read_text, universal newlines) and the rules reader (bytes decoded, CR kept) turn the same bytes into different texts, so a bytes-digest hit can return offsets wrong for the caller's text.
  evidence: index.py:61-62 read_text translates CRLF and lone CR; governance/services/documents.py:46-47 decodes bytes; frontmatter.py:12 supports CRLF; rewrite.py:17-30 splices at ref.start/end; the prototype decoded bytes and the repository has no CRLF document.
  failure_condition: A CRLF document cached by a walk load is reused by devkit rules fix, which rewrites the wrong characters; reported lines and columns differ from a fresh build.
  suggested_action: Key each entry on the digest of the exact text passed to parse_document; add CRLF, lone-CR and BOM cases loaded by a walk and a supplied reader in both orders, including rules check and fix.
  resolution: resolved
  severity: P1
- issue: The parser fingerprint omits code that shapes the stored result.
  evidence: index.py:61-62 (_read) and 116-118 (reason text) live in repositories/; the memo codec and devkit_core/base/errors.py (FrontmatterError.message) are outside the fingerprint.
  failure_condition: A change to reading, reason formatting or encoding keeps the fingerprint and returns stale results.
  suggested_action: Fingerprint the read path, the parse path and the codec modules and the errors module; the unit test enumerates all three.
  resolution: resolved
  severity: P2
- issue: The JSON round trip is not faithful for values the strict loader accepts.
  evidence: frontmatter.py:159-161 checks only top-level keys; json.dumps coerces non-string keys; a literal one-key {"$d":...} mapping decodes as a date; datetime is a date subclass.
  failure_condition: Frontmatter with nested non-string keys, tag-shaped mappings or datetimes differs with a memo.
  suggested_action: Specify an unambiguous whitelist codec (mappings tagged, datetime before date with offset, non-finite floats and other types unstorable) and add round-trip cases.
  resolution: resolved
  severity: P2
- issue: Files without a stored result make every walk load rewrite the memo, contradicting AC4.
  evidence: the write rule 'entries differ' versus 'not stored' for unstorable results and OSError; atomic_write_bytes fsyncs about 1 MB.
  failure_condition: One unstorable document makes every lookup write and fsync the memo.
  suggested_action: Store an unstorable marker with the digest; unreadable files have no entry on either side; add AC4 cases.
  resolution: resolved
  severity: P2
- issue: The directory-in-place corruption case cannot be rewritten without deleting a directory.
  evidence: atomic_write_bytes ends in os.replace, which fails on a directory target (files.py:77).
  failure_condition: The test either fails or the implementation deletes data under .devkit/transient/spec/.
  suggested_action: Never remove a non-regular file at the memo path; return a fresh build, skip the write, log under -v.
  resolution: resolved
  severity: P2
- issue: The speed criterion's baseline is undefined.
  evidence: proposal 3.2 item 5 'without a memo'; the baseline was measured with concurrent load.
  failure_condition: Deleting the memo per run includes a write and fsync; results are not comparable or mechanical.
  suggested_action: Define the baseline workspace and procedure (interleaved runs, discarded warm-up) and record versions and run numbers.
  resolution: resolved
  severity: P2
- issue: Git snapshot runs never see the memo; the PADRs claim they read it.
  evidence: devkit_agt rules project.py:346-348 materializes snapshots in a temporary directory without .devkit/transient/.
  failure_condition: No wrong result; the safety argument targets the wrong runs.
  suggested_action: State that only loads whose root is the working tree (walks and in-place rule runs) read the memo.
  resolution: resolved
  severity: P3
- issue: Contract documents beyond the PADRs are not named.
  evidence: ADR-spec-package-on-devkit records the derived-data cache as dropped; CAP-DOCS-document-model.md:20 and index.py:3-4 say rebuilt on every load; CAP-DIST-workspace-ownership lists transient files but not work/ or mcp/.
  failure_condition: The reversal is not recorded against the earlier decision and section 1 contradicts the new section 3.4.
  suggested_action: Cite the ADR in the PADR context; list CAP-DOCS section 1 and the index.py docstring as required edits; decide whether CAP-DIST lists the memo.
  resolution: resolved
  severity: P3
- issue: The symlink guard covers only .devkit/transient/ itself.
  evidence: atomic_write_bytes runs mkdir(parents) and creates its temporary file in path.parent, following a symlinked spec/.
  failure_condition: With .devkit/transient/spec a symbolic link, the memo is written outside the workspace.
  suggested_action: Skip the memo when spec/ or the memo path is a symbolic link or resolves outside the root.
  resolution: resolved
  severity: P3
