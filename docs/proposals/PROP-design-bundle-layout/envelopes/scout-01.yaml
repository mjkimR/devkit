summary: 'Q1/Q3: table rows alone cannot carry the bundle or domain area grammar; id_convention, role_artifacts, spec_format, entrypoint_paths and search need kind-layout code. Index, resolve, refs, list and aliases are ID-keyed and survive an area move.'
findings:
- issue: KindDefinition.anchor is coupled to summary=ANCHOR, and area_scoped drives only hand-written id_convention grammar entries; a design bundle needs a new row layout fact and grammar code, domain needs an area_scoped flip plus its grammar entry.
  evidence: packages/devkit-docs/src/devkit_docs/features/documents/models/kinds.py:79,371-372; packages/devkit-docs/src/devkit_docs/features/governance/usecases/id_convention.py:303-342
  failure_condition: Setting anchor on a DESIGN row raises KindTableError; flipping area_scoped alone leaves the flat _role grammar rejecting area paths.
  suggested_action: Add a table layout fact (flat | area | area-bundle with anchor name) consumed by id_convention.
  resolution: open
  severity: P1
- issue: role_artifacts.artifact_parent and artifact_state assume <dir>/<ID>/artifacts/ and parent <dir>/<ID>.md, so bundle support Markdown becomes an unclassified living-spec document failing RULE-spec-format and id_convention.
  evidence: packages/devkit-docs/src/devkit_docs/features/governance/services/role_artifacts.py:17-73; packages/devkit-docs/src/devkit_docs/features/governance/usecases/spec_format.py:240-246
  failure_condition: Any .md beside design.md fails RULE-spec-format for missing frontmatter.
  suggested_action: Add a bundle branch whose parent is the bundle anchor and whose support is every non-anchor file in the bundle.
  resolution: open
  severity: P1
- issue: spec_format forbids area on every role kind and derives a missing id from the file stem.
  evidence: packages/devkit-docs/src/devkit_docs/features/governance/usecases/spec_format.py:110-118,161-170,335
  failure_condition: area on a design or domain fails; rules fix writes id design into a bundle anchor.
  suggested_action: Derive the area exemption from area_scoped and the anchor ID from the bundle directory.
  resolution: open
  severity: P1
- issue: entrypoint_bearing accepts only flat three-segment DESIGN paths, so RULE-code-entrypoints and devkit-spec derive silently skip bundle designs.
  evidence: packages/devkit-docs/src/devkit_docs/features/governance/services/entrypoint_paths.py:26-43; packages/devkit-spec/src/devkit_spec/features/entrypoints/services/derive.py:96-97
  failure_condition: A dead entrypoint in a bundle design passes the rule; derive reports NOT_ENTRYPOINT_BEARING.
