review: challenger-01.yaml
summary: 'Closes challenger-01 finding 19 after answer-01 q5: the run commits carry the fixed devkit identity, folded into proposal §3.2 and PADR-history-branch-publication §4'
findings:
- issue: The record is frozen at finish and the branch never overwrites, but CAP-DLV-review-refactor and CAP-DLV-performance-pass require a report's outcome to be updated when its work item integrates or stops; the design has no amendment path and §3.5 claims the playbook procedures do not change
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:116-118,130-131,143-146; docs/capabilities/delivery/CAP-DLV-review-refactor.md:133-134; docs/capabilities/delivery/CAP-DLV-performance-pass.md:172-173
  failure_condition: A run publishes at finish with outcome partially applied and open work items; the work item integrates later; the required outcome update has nowhere to go, so list/get return a record contradicting the integrated state
  suggested_action: Add an append-only amendment (history update publishing runs/<playbook>/<run-id>/updates/<time>.json as a new commit) and state that the two playbooks' existing update step calls it; or declare the published copy as the state at finish with the update local, as an exception the user chooses
  resolution: resolved
  severity: P1
- issue: start writes the run directory and retained diff into --into <dir> inside the working tree; those untracked paths enter git status, add -A and the untracked-bytes digest, so finish reports drift on every run and the unchanged-status test fails by definition
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:70-71,103-106,137-139; packages/devkit-catalog/src/devkit_catalog/maintenance/bundle/playbooks/weekly-report.md:21-23
  failure_condition: --into docs/materials/...; start captures the state and writes the record; finish recaptures and the run directory and report are new untracked paths, so the tree and digest differ
  suggested_action: Exclude the run directory, report path and diff_path from dirty_paths, the temporary-index add -A and the digest, and state the unchanged-status test applies outside <dir>; or require --into outside the worktree or under an ignored path
  resolution: resolved
  severity: P2
- issue: 'The non-forced ref update protects commits, not index lines: a writer that rebuilds on the new head but reuses the index blob built on the old head fast-forwards over the winner''s index line; the design does not say the index is re-read from the new head, and the interleaved-writers test does not assert both lines'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:126-128,150-153; docs/proposals/PROP-maintenance-history/materials/planning-options.md:55
  failure_condition: A publishes A'; B's PATCH is rejected; B rebuilds with base_tree A'.tree but keeps its index blob from H; PATCH succeeds and A's index line is gone, so list never shows A's run
  suggested_action: State that every attempt re-reads index and record path from the head it builds on and appends to that content, and that the interleaved-writers test asserts both index lines and both run directories at the final head
  resolution: resolved
  severity: P2
- issue: 'Index rollover and lookup are underspecified: size-based rollover does not say whether old lines move, who measures or how concurrent writers agree; list reads only index/<playbook>.jsonl; get --run-id has no playbook although the path is runs/<playbook>/<run-id>/'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:73-74,87,93-94
  failure_condition: After the first rollover list --source-sha X misses runs in the other file; get must guess the playbook; two writers crossing 1 MB at once create two layouts
  suggested_action: Shard the index by calendar year of the run ID from the start (index/<playbook>/<YYYY>.jsonl), have list read the current year then earlier years until --limit, and give get the playbook (option or run ID segment)
  resolution: resolved
  severity: P2
- issue: The existing-branch validation 'its root commit has no parents' is true of every branch; finding the root needs paging the whole history and a README marker at the head can pass a foreign branch; the compare-based check needs an expected root the proposal never defines
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:69; docs/proposals/PROP-maintenance-history/decisions/PADR-history-branch-publication.md:90-91; docs/proposals/PROP-maintenance-history/materials/github-publication-api.md:49
  failure_condition: 'init --branch main, or a stale maintenance-history someone merged code into: the root has no parents and HISTORY_BRANCH_FOREIGN is never produced'
  suggested_action: Make the root deterministic (fixed README bytes, pinned identity and date give one constant root commit SHA) and validate an existing branch with GET compare/<ROOT>...<head> status identical or ahead; record the constant in the capability
  resolution: resolved
  severity: P2
- issue: 'The Result codes column mixes stdout sentinels and error advisories without channel, level, exit code or mode: HISTORY_PUBLISH_PENDING arises from a refusal, race exhaustion maps a DEFER condition to failed while promising a retry, FOREIGN/UNKNOWN/DRIFTED are unassigned, list with no runs has no [OK]'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:64-74,126-128,133-135; docs/capabilities/advisory/CAP-ADV-agent-advisory-protocol.md:30-36,216-224; docs/architecture/ARCH-08-cross-cutting.md:76-80; docs/architecture/ARCH-08-1-agent-output.md:56
  failure_condition: A playbook branching on HISTORY_PUBLISH_PENDING on stdout never sees the stderr refusal; a three-time race exhaustion marks the record failed while the agent is told to retry
  suggested_action: Add a table per code with channel, exit code, advisory mode and [ACTION]; map race exhaustion to HISTORY_PUBLISH_DEFERRED with outcome pending; reserve failed for 401/403/ruleset/collision; make HISTORY_RUN_DRIFTED a warning; name init's and list's [OK] lines
  resolution: resolved
  severity: P2
- issue: init creates a commit and a branch on GitHub but takes no --authority and nobody is named as its caller; the authority model covers publish only
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:69,122-125; docs/capabilities/delivery/CAP-DLV-weekly-report.md:93-94; docs/decisions/2026-11/20261102-delivery-approval-and-lifecycle-authority.md:79
  failure_condition: 'A publication step finds no branch and an agent runs init on the configured or origin repository: a remote branch is created under invocation alone'
  suggested_action: Give init the same --authority requirement, record it in the branch README or a local init record, state that publish never initializes implicitly and that the playbook names init as a separately authorized action
  resolution: resolved
  severity: P2
- issue: The record claims to be the weekly-report companion record but has no supersedes field (reruns MUST name superseded runs) and no link to prior reports or earlier report keys; start/finish have no flag for them
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:70-71,98-114; docs/capabilities/delivery/CAP-DLV-weekly-report.md:73-74; docs/capabilities/delivery/CAP-DLV-drift-reconciliation.md:55-56
  failure_condition: A weekly rerun for the same interval publishes a second completed run; list --limit 1 returns one with nothing saying it supersedes the other
  suggested_action: Add supersedes and prior_runs to the identity section, --supersedes to start/finish, and supersedes to the index line so list can skip superseded runs
  resolution: resolved
  severity: P2
- issue: 'diff_digest is not reproducible: git diff --binary output depends on repository and global config (external diff, textconv, noprefix, renames, autocrlf); untracked bytes are concatenated without name or length framing; diff_path''s content is undefined relative to the digest input'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:103-106; docs/proposals/PROP-maintenance-history/decisions/PADR-inspected-state-identity.md:41-44,47,80-81; packages/devkit-core/src/devkit_core/core/git.py:138-141
  failure_condition: Two machines with different diff config digest the same dirty content differently; a reader with the retained diff cannot recompute the digest because the untracked bytes are not in it
  suggested_action: 'Specify the retained file as the digest input: git -c diff.noprefix=false -c core.quotepath=false diff --no-ext-diff --no-textconv --no-renames --binary HEAD followed by length-prefixed path and bytes per untracked path in byte order; diff_digest is its SHA-256'
  resolution: resolved
  severity: P2
- issue: A new devkit maintenance command group and a [maintenance.history] config table need entries in packages/devkit/pyproject.toml, and AGENTS.md requires package READMEs and docs/development/reference/ to describe new modules; none is in boundaries.owns
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:13-25; packages/devkit/pyproject.toml:22-30,37-40; packages/devkit-dist/src/devkit_dist/features/distribution/services/installation/config_template.py:47
  failure_condition: Development cannot mount the command or template the config table without editing a path outside its write scope
  suggested_action: Add packages/devkit/pyproject.toml, packages/devkit/README.md and docs/development/reference/ to owns
  resolution: resolved
  severity: P2
- issue: §3.5 makes history start/finish unconditional playbook steps, but the maintenance bundle is content-only on devkit-dist and a project may install devkit-dist without devkit-agt; the Background promises manual delivery does not depend on history
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:38-39,143-145; packages/devkit-dist/README.md:31; packages/devkit-catalog/pyproject.toml:7-12
  failure_condition: A dist-only consumer runs the updated weekly-report playbook; devkit maintenance history start is an unknown command at intake with no stated fallback
  suggested_action: State that the record steps apply where devkit maintenance is installed and that without it the playbook keeps its current local record
  resolution: resolved
  severity: P2
- issue: run_gh removes GH_REPO and runs with a 5 s per-call timeout and 20 s budget tuned for PR reads; the materials recommend GH_REPO, and a multi-MB blob POST can exceed 5 s and be classified as a lost response
  evidence: packages/devkit/src/devkit_agt/features/worktree/repositories/pull_request.py:22-23,52-56,95-99; docs/proposals/PROP-maintenance-history/materials/github-publication-api.md:99,124; docs/proposals/PROP-maintenance-history/proposal.md:62-63
  failure_condition: Reusing run_gh as is, a publication of several files times out mid-sequence and every retry repeats the timeout
  suggested_action: Address the repository explicitly in the endpoint path and give publish its own timeout and budget per request class
  resolution: resolved
  severity: P3
- issue: 'started_at and finished_at ''with timezone and UTC offset'' have no input: start has no --timezone and the weekly report''s configured timezone is asked in conversation'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:70,90,100-101; docs/capabilities/delivery/CAP-DLV-weekly-report.md:30-32
  failure_condition: A machine with TZ unset records a different timezone from the user's configured one; two runs of one week disagree on the day boundary
  suggested_action: 'Add --timezone <IANA name> to start (default: the system zone, recorded as such) and record both the name and the offset'
  resolution: resolved
  severity: P3
- issue: The temporary index path is shared by concurrent start/finish runs in one checkout, and add -A runs clean filters and writes loose objects; the proposal states only that index/HEAD/refs/worktree stay unchanged
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:137-139; packages/devkit-spec/src/devkit_spec/bundles/spec/bundle/skills/spec-delegate/SKILL.md:31-36
  failure_condition: Two runs use the same temporary index at once and one records the other's tree; a repository with an LFS filter but no git-lfs binary fails add -A in start
  suggested_action: Use a per-run temporary index name, delete it after write-tree, state that object store growth is accepted and define the result of a failing clean filter
  resolution: resolved
  severity: P3
- issue: Absence permits the attempt treats a contents GET 404 as proof of absence, but GitHub answers 404 for a private repository the token cannot read and for a missing branch
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:129-132; docs/proposals/PROP-maintenance-history/materials/github-publication-api.md:36,60
  failure_condition: 'A token lacking access: ref GET 404 read as branch missing; record GET 404 as absent; blob POST 404 unclassified'
  suggested_action: Read the repository or the ref first and classify its 404 as failed (permission or destination); only a 404 on the record path at a readable head is absence
  resolution: resolved
  severity: P3
- issue: The collision check compares digests of a re-serialized record.json without a canonical JSON form, so a retry from another machine or devkit version can report a collision for the same run; after a lost-but-successful PATCH history_commit must be looked up, which the design omits
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:112-114,129-131
  failure_condition: 'publish, lost response, retry from a second checkout with a copied run directory serialized with different key order: refused as a collision'
  suggested_action: Define the published record as canonical JSON (sorted keys, compact separators, UTF-8, newline-terminated), compare the blob SHA, and state the commits?sha=<branch>&path=<record path> lookup for history_commit
  resolution: resolved
  severity: P3
- issue: Publication through gh api bypasses commit gates, so the secret_leak rule never sees --file content or reports with command output; no check before send is named
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:72,86,175; docs/proposals/PROP-maintenance-history/decisions/PADR-inspected-state-identity.md:33; packages/devkit/src/devkit_agt/features/rules/services/builtins/secret_leak
  failure_condition: A report pastes an environment dump with a token; publish sends it to a branch that is never force-updated or deleted by design
  suggested_action: 'Optional: run the installed secret_leak check over the files to publish and refuse on a hit, or state that publication runs no content check'
  resolution: resolved
  severity: P3
- issue: dev_effort medium sits beside size L, six commands, an in-memory GitHub model, a PATH shim, four playbook edits, four capability edits, a new capability, two use cases, glossary rows and a live exercise
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:9-11,150-157,160-166
  failure_condition: Development at medium skips the high-effort review loop on the surface most likely to hide concurrency defects
  suggested_action: 'Optional: set dev_effort high or split verification of the fake GitHub model into its own task'
  resolution: waived
  waiver: 'dev_effort stays medium: the race, retry and inspection paths are mechanical integration tests with the modelled runner, the mandatory code-reviewer pass covers them and the implementer re-calls the reviewer for uncertain correctness; the user may raise it at plan-accept'
  severity: P3
- issue: '''Author and committer identity and dates are pinned from the record'' leaves open which identity the history commits carry (publisher''s git identity, the gh account, or a fixed devkit identity); presented as settled'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:91-93; docs/proposals/PROP-maintenance-history/decisions/PADR-history-branch-publication.md:50-51
  failure_condition: Two users retry the same unknown publication with their own identities and get different commit SHAs for the same content, contradicting the stated reproducibility
  suggested_action: 'Decision needed: which author and committer identity the history commits carry, recorded in the record so the pinned-SHA claim is precise'
  resolution: resolved
  severity: P3
