  resolution: open
- issue: Invocation and integration policy MUST NOT authorize commit, push or other external mutation, and destinations are invocation inputs with no standing publication permission; a default-on history write conflicts, so publication must be an explicitly authorized per-run step with pending as the default outcome
  evidence: docs/capabilities/delivery/CAP-DLV-weekly-report.md:93-94; docs/decisions/2026-11/20261102-mcp-runtime-and-shared-artifacts.md:190-196; docs/decisions/2026-11/20261102-delivery-approval-and-lifecycle-authority.md:79,211
  resolution: open
- issue: The shared artifact store forbids overwrite and deletion, expires after seven days and a production remote adapter is deferred; the history store must not be a SharedArtifactAdapter
