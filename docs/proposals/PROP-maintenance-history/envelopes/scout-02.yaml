summary: 'Internal contracts collected from docs refs --direction in of the touched capabilities and ADRs: the history store is a new destination kind outside the shared artifact store, needs its own capability and decision, must publish only under explicit per-run authority, restates the weekly-report companion record and four publication states, needs a dirty-state content identity outside source_sha, and any gh api code belongs in a feature package rather than the content-only catalog.'
findings:
- issue: CAP-DLV-weekly-report excludes a history backend from its scope and ADR-mcp-runtime-and-shared-artifacts keeps it independent; the history branch therefore needs its own capability and a new decision, and the weekly-report scope clause must point at it at spec-sync
