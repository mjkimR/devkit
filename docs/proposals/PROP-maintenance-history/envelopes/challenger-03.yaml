summary: 'round 3; examined the fix batch ef6a99a8..ae598acb and reverify-02 against CAP-ADV §2 and §5, ARCH-08 §4, the delivery capabilities, the secret_leak builtin and the feature edges: the nine challenger-02 findings are folded as written with no stale text and no recurrence. Four P2 defects the fix introduced or exposed (5xx-or-timeout class specified twice, rate limits without retry-after misclassified, the cross-machine claim moved to inspected_tree with the same config dependence, publish without the pre-send digest recheck while two playbooks edit the report after finish) and three P3 (finish-only --report and the diff location, 5xx on content-creating requests unclassified, optional: the rule context inherits project exclusions). No hidden decision beyond q1-q5.'
findings:
- issue: 'A 5xx or timeout on a read has two codes: §3.2 and PADR §4 send it to HISTORY_GH_UNAVAILABLE (INTERACTION, exit 2), §3.4 and the HISTORY_DEFERRED row to HISTORY_DEFERRED (DEFER, exit 1); the HISTORY_GH_UNAVAILABLE row overlaps both'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:110,181-184,199-200; docs/proposals/PROP-maintenance-history/decisions/PADR-history-branch-publication.md:86-87
  failure_condition: 'The compare answers 502 during publish: one clause stops to ask the user, the other says retry later; the implementer picks one and the other text is wrong'
  suggested_action: 'One rule in §3.2, §3.4, the two table rows and PADR §4: a 5xx or timeout on any read is HISTORY_DEFERRED with a default retry_after; HISTORY_GH_UNAVAILABLE is only a missing or logged-out gh; drop ''or retry when GitHub answers'''
  resolution: open
  severity: P2
- issue: Rate limits are classified only as 403 or 429 with retry-after; a 403 on the repository read maps to HISTORY_PUBLISH_FAILED before any rate-limit test, and a 403/429 without retry-after on the compare falls to any other non-2xx
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:109-110,169-170; docs/proposals/PROP-maintenance-history/decisions/PADR-history-branch-publication.md:91-92; docs/proposals/PROP-maintenance-history/materials/github-publication-api.md:76-77
  failure_condition: 'A burst exhausts the primary limit: the repository GET answers 403 with x-ratelimit-remaining 0 and no retry-after; publish records failed and asks to fix credentials'
  suggested_action: 'Test for a rate limit before the status mapping on every request: 429, or 403 with retry-after or x-ratelimit-remaining 0, is HISTORY_DEFERRED with retry_after from retry-after or x-ratelimit-reset; only then is 401/403/404 on the repository HISTORY_PUBLISH_FAILED'
  resolution: open
  severity: P2
- issue: The cross-machine claim moved from diff_digest to inspected_tree, but git add -A reads core.excludesFile, info/exclude, global clean filters and core.autocrlf; the §3.6 and PADR §6 test varies only diff settings that do not affect add -A
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:135,234-235,280; docs/proposals/PROP-maintenance-history/decisions/PADR-inspected-state-identity.md:47,74,102-103
  failure_condition: 'Machine A ignores *.log globally and B does not: the same dirty checkout with an untracked debug.log gives two inspected_tree values'
  suggested_action: Narrow the claims to 'the same content under the same ignore rules and clean filters gives the same tree' and add the test under a global excludes file
  resolution: open
  severity: P2
- issue: With the secret check moved to finish, nothing at publish verifies the report or --file bytes against the SHA-256 frozen in the record, while CAP-DLV-weekly-report §4 requires a digest recheck before send; CAP-DLV-review-refactor §5 and CAP-DLV-performance-pass §6 require the report's outcome to be updated in the file after finish
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:80,146,164-168,172-176,215-219; docs/capabilities/delivery/CAP-DLV-weekly-report.md:81,89,95-96; docs/capabilities/delivery/CAP-DLV-review-refactor.md:133-134; docs/capabilities/delivery/CAP-DLV-performance-pass.md:172-173
  failure_condition: 'A run finishes, the work item integrates, the playbook edits the report''s outcome in the file, the user authorizes publish: the edited report is uploaded beside a record whose report digest names the finish-time bytes'
  suggested_action: publish recomputes the SHA-256 of the report and each --file and refuses a mismatch as an INPUT_ERROR (changed content is a new run); add the case to §3.6; state in §3.5 and §3.7 that the amendment replaces the in-file outcome update of the two capabilities
  resolution: open
  severity: P2
- issue: --report is optional at start and at finish and only the both-present case is defined; a report named only at finish counts as drift; the retained diff file's location is no longer stated
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:78-79,128-132; docs/proposals/PROP-maintenance-history/materials/internal-constraints.md:32-34
  failure_condition: 'start without --report; finish --report <file>: the untracked report changes the inspected tree and finish prints HISTORY_RUN_DRIFTED for the run''s own output'
  suggested_action: Require --report at start and let finish only confirm it, rejecting a finish-only --report as INPUT_ERROR; state that the retained diff lives in the run directory
  resolution: open
  severity: P3
- issue: A 5xx or timeout on a content-creating request or on the reference PATCH other than a lost response is in no failure class
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:177-185,199-200,208
  failure_condition: 'POST git/blobs answers 502 on the third blob: the implementer chooses between failed, unknown or deferred'
  suggested_action: 'Add to the DEFERRED class: a 5xx or timeout before the reference PATCH is HISTORY_DEFERRED; only the PATCH itself can be HISTORY_PUBLISH_UNKNOWN'
  resolution: open
  severity: P3
- issue: 'Optional: ''the installed secret_leak rule'' leaves open whether finish calls the builtin directly or the project''s rule evaluator, whose RuleContext applies [rules] exclude patterns; a project excluding its materials location would check nothing'
  evidence: docs/proposals/PROP-maintenance-history/proposal.md:164-168; packages/devkit/src/devkit_agt/features/rules/models/contracts.py:97-99; packages/devkit/src/devkit_agt/features/rules/services/builtins/secret_leak/rule.py:66-69
  failure_condition: A project lists docs/materials/** under [rules] exclude; the weekly report there quotes a token; finish reports no hit
  suggested_action: State that finish and publish call SecretLeakRule.check directly with a RuleContext whose changed_files are the targets and whose exclude is empty
  resolution: open
  severity: P3
