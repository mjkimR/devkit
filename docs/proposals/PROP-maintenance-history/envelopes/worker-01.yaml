questions:
- id: q1
  title: Command family or content-only procedure
  prompt: Should the history store be a `devkit maintenance history` command family in devkit-agt that the playbooks call, or a content-only `gh api` procedure in the playbook references that the agent runs itself?
  context: The Planning design (proposal §3.1) adds a devkit-agt feature with init, start, finish, publish, list and get commands behind an injectable gh runner. This makes the retry, concurrency, idempotency and unchanged-local-state rules testable without network and gives the playbooks stable codes, but it grows the scope (boundaries now own packages/devkit/src/devkit_agt/features/, its tests and the feature edges; size M to L). The original draft said 'a documented gh api procedure'; a content-only reference keeps size M, but the same rules become prose an agent follows per run with base64 blobs in conversation, and verification is manual scenario evidence only.
  options:
  - id: a
    description: Command family in devkit-agt (proposal §3.1), size L; the catalog playbooks stay content and call the commands.
    recommended: true
  - id: b
    description: Content-only gh api procedure in a playbook reference file; size stays M; boundaries revert to the catalog bundle and docs; verification is a labelled manual exercise.
    recommended: false
  allow_note: true
- id: q2
  title: Playbooks that record history
  prompt: Which maintenance playbooks record and publish a run record?
  context: The draft named weekly-report, drift-reconciliation and review-refactor. The maintenance bundle also ships performance-pass, which already records a run ID and its own outcome vocabulary; the design keeps its vocabulary in the playbook-specific result field. Including it means one more playbook edit, capability edit and content test.
  options:
  - id: a
    description: All four maintenance playbooks, including performance-pass.
    recommended: true
  - id: b
    description: Only the three named in the draft; performance-pass joins later as its own work.
    recommended: false
  allow_note: true
- id: q3
  title: Publication authority model
  prompt: Does every run's publication need the user's explicit authority in that run, or may a standing opt-in in .devkit/config.toml authorize publication for every run?
  context: 'CAP-DLV-weekly-report §4 says invocation and integration policy MUST NOT authorize commit, push or other external mutation, and ADR-mcp-runtime-and-shared-artifacts says destinations are invocation inputs that create no standing publication permission. The design follows them: publish refuses without --authority, the default outcome is pending, and the configured repository and branch are inputs only. A standing opt-in would let unattended runs publish, but it needs a superseding ADR for those clauses and a change to CAP-DLV-weekly-report and CAP-DLV-project-policy.'
  options:
  - id: a
    description: Per-run explicit authority; pending by default; configuration supplies the repository and branch only (PADR-history-branch-publication as written).
    recommended: true
  - id: b
    description: Standing opt-in in configuration ([maintenance.history] publish = "auto") that authorizes every run; Planning adds a superseding PADR and the capability changes.
    recommended: false
  allow_note: true
- id: q4
  title: Inspected-state identity
  prompt: How does a run record identify the state it inspected when the checkout held uncommitted changes?
  context: Spike question Q2. PADR-inspected-state-identity records the source SHA, the dirty path list, a tree hash from a temporary index (read-tree HEAD, add -A, write-tree, as spec-delegate does) and a SHA-256 digest of the retained local diff; the diff itself stays local because it may hold secrets, and source_sha keeps its meaning as a commit. The cheaper alternative records only the source SHA and dirty paths, which cannot tell two different dirty contents apart.
  options:
  - id: a
    description: Source SHA, dirty paths, temporary-index tree hash and local diff digest; the diff is published only when the run selects it (the PADR as written).
    recommended: true
  - id: b
    description: Source SHA and dirty paths only; the PADR is withdrawn.
    recommended: false
  - id: c
    description: As a, and the diff is published with every dirty run by default.
    recommended: false
  allow_note: true
- id: q5
  title: Identity of the history run commits
  prompt: Which author and committer identity do the run commits on the history branch carry?
  context: Challenger-01 finding 19. The root commit uses a fixed devkit identity so its SHA is a constant. For run commits the design pins the identity and dates from the record so a rebuilt commit for the same content has the same SHA; that property holds across machines only with a fixed identity. A fixed identity shows the commits as unattributed to a person; the publisher's git identity attributes them but makes the SHA reproducible only per publisher; the gh account identity needs an extra lookup per publication.
  options:
  - id: a
    description: A fixed devkit identity (name `devkit maintenance history`, a no-reply address), recorded in the record; the record's `authority` field names the person.
    recommended: true
  - id: b
    description: The publisher's local git identity (user.name and user.email), recorded in the record; reproducible SHAs hold per publisher only.
    recommended: false
  - id: c
    description: The gh account's login and no-reply address, looked up once per publication.
    recommended: false
  allow_note: true
