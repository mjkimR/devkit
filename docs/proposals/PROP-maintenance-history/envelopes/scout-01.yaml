summary: 'Q1 answered from official GitHub docs read 2026-11-04: the Git Database sequence (blobs, tree, commit, non-forced ref PATCH) is the only documented atomic multi-file publication; Contents PUT is per-file, GraphQL createCommitOnBranch undocumented for atomicity and orphan creation. API-level idempotency, exact error texts and gh api error behavior stay unverified without a live test.'
findings:
- issue: Only the Git Database sequence (blobs, tree with base_tree, commit, one ref PATCH) publishes several files in one commit; the ref PATCH with force omitted is the single publication point and refuses non-fast-forward updates
  evidence: docs/proposals/PROP-maintenance-history/materials/github-publication-api.md sections 1-2 (docs.github.com/en/rest/git/refs Update a reference; /rest/git/trees Behavior notes)
  suggested_action: Select option (a) Git Database; parse HTTP status classes, never message text
  resolution: open
- issue: Contents API PUT is one commit per file and not atomic; GraphQL createCommitOnBranch carries expectedHeadOid but its atomicity, stale-head error, branch creation and orphan behavior are undocumented in the pages read
  evidence: materials/github-publication-api.md section 1 options (b) and (c)
  suggested_action: Keep (b) and (c) as rejected alternatives; (c) becomes the simpler choice only if a live reference confirms atomic fileChanges and a stable stale-head error
  resolution: open
- issue: 'Orphan root: POST git/commits with empty parents writes a root commit; POST git/refs creates the branch; empty repositories refuse reference creation; no ancestry validation endpoint exists, so an existing branch is validated by reading its head and a compare/root check'
  evidence: materials/github-publication-api.md section 3 (docs.github.com/en/rest/git/commits Body parameters; /rest/git/refs Create a reference)
  resolution: open
- issue: 'Retrieval limits: contents GET 1 MB full / 100 MB raw, directory listing 1,000 entries, recursive tree 100,000 entries or 7 MB, list commits per_page max 100 with a path filter; no combined search by revision exists, so the revision filter must live in the record path or an index file'
  evidence: materials/github-publication-api.md section 4 (docs.github.com/en/rest/repos/contents Get repository content; /rest/git/trees Get a tree)
  resolution: open
- issue: 'Rate limits: 5,000 requests/hour primary; secondary 80 content-generating requests/minute and 500/hour; mutating requests score 5 points; retry-after and x-ratelimit-reset govern waits; a run of N files costs N+3 mutating requests'
  evidence: materials/github-publication-api.md section 5 (docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api)
  resolution: open
- issue: 'Idempotency is derived from Git object hashing, not documented by GitHub: blob and tree shas are content-addressed, and a commit sha is reproducible only with pinned author, committer and dates; whether repeated POSTs or a repeated same-sha PATCH succeed is unverified, so the retry design must check the record path by content and the ref head before resending'
  evidence: materials/github-publication-api.md section 5 Idempotency (git-scm.com/book/en/v2/Git-Internals-Git-Objects)
  suggested_action: Make the run ID in the record path the idempotency key; verify by GET before any retry
  resolution: open
- issue: gh api resolves {owner}/{repo} placeholders from the current directory's repository or GH_REPO; GH_REPO=[HOST/]OWNER/REPO selects the repository without reading local Git; GH_TOKEN takes precedence; gh api exit codes, retry and rate-limit printing are undocumented in the manual
  evidence: materials/github-publication-api.md section 6 (cli.github.com/manual/gh_api Placeholder substitution; gh_help_environment)
  resolution: open
- issue: Rulesets with restrict creations or restrict updates matching the history branch name block the initializing POST git/refs or the ref PATCH for non-bypass identities; block force pushes is on by default and matches the non-forced design
  evidence: materials/github-publication-api.md section 7 (docs.github.com rulesets available-rules)
  resolution: open
assumptions:
- Isolated native claude-code subagent (scout contract); no live GitHub call was made
- Page summaries marked (summary) in the materials file came from a reader model and need rechecking before becoming normative
unverified_areas:
- Exact non-fast-forward PATCH status/message, 422 reference-exists and 409 empty-repository texts
- API-level dedupe of repeated blob/tree/commit POSTs and a repeated same-sha ref PATCH
- createCommitOnBranch atomicity, stale-head error, branch/orphan creation and FileAddition limits
- gh api exit codes on HTTP errors, retry behavior and whether placeholder resolution reads local Git state; gh auth status scope listing
- Classic branch protection and ruleset bypass for API ref actions
