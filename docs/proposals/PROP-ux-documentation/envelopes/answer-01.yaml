answers:
- question: decomposition
  choice: a
  decision: Keep one proposal, delivered as one spec with ordered tasks for the kind, the link rules, ux-writing and the reviewer.
- question: ux-document-set
  choice: a
  decision: One UX kind with one document per screen, modal or panel; the use case is the flow and there is no flow document.
- question: ux-objects
  choice: a
  decision: The object register is docs/steering/ux-objects.md, created by ux-writing with the project's first UX document and not seeded; R6 is not applicable while it is absent or empty.
- question: step-screen-link
  choice: a
  decision: Use case steps cite the UX ID of their screen in prose, and each screen interaction names the served step as the UC ID code span plus the step key.
- question: ux-checks
  choice: b
  decision: Ship orphan and link-agreement checks plus the flow-graph checks and element and Interactions-table validation; no extension-to-state coverage.
- question: coverage-strictness
  choice: a
  decision: Contradictions are errors in RULE-ux-links; uncovered steps and step-less interactions are warnings in RULE-ux-coverage.
- question: review-method
  choice: b
  decision: The UX reviewer runs the walkthrough plus the R1-R6 0/1/2 rubric with evidence, without severity, at most two rounds.
- question: review-placement
  choice: a
  decision: The UX review is an optional delegation before code, in Planning and inside specify or characterize before the plan.
- question: ux-document-timing
  choice: a
  decision: Screens are drafted before code with new IDs as plain text, and spec-sync writes docs/ux/ and the use case citations.
