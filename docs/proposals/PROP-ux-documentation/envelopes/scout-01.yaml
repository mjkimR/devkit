summary: 'Kind machinery: about 20 touch points for a new kind; the PROP-table-driven-document-kinds table as drafted covers ID grammar, membership, directories, field typing, summary and entrypoint kinds, but not traceability pairs, stem regexes, terminal statuses, templates, seeds, viewer grouping and ID regex. One prefix is cheapest; there is no frontmatter kind field.'
findings:
- issue: 'ADRs constraining kinds: ADR-roadmap-and-milestones (no new kind without a reader that needs it), ADR-document-id-aliases (aliases and prefix-typed relation fields on every ID-bearing kind), ADR-terminal-statuses-are-historical (a new kind joins the terminal-status table only through a decision), ADR-usecases-replace-stories (precedent for adding a kind with prefix, directory and namespace directory).'
