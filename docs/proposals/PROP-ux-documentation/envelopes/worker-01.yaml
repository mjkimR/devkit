questions:
- id: decomposition
  title: One proposal or a split reviewer
  prompt: Should the UX kind, its rules, the writing instruction and the UX reviewer stay in this one proposal, or should the reviewer become a separate proposal?
  context: One proposal hands off to exactly one spec. The reviewer's walkthrough depends on the UX template and the step key form, so it cannot land before the kind. Keeping one proposal gives one spec with ordered tasks (kind and template, link rules, ux-writing, reviewer) and one review of the whole design; splitting gives two smaller specs and lets the kind ship and be used before the reviewer is designed in detail. A split ends this Planning (status draft, needs_decompose) and Backlog creates the children in MS-ux-documentation.
  options:
  - id: a
    description: Keep one proposal; Development delivers the kind, rules, instruction and reviewer as ordered tasks of one spec.
    recommended: true
  - id: b
    description: 'Split: return this draft for decomposition into (1) the UX kind, link rules and ux-writing and (2) the UX reviewer, which depends on (1).'
    recommended: false
  allow_note: true
- id: ux-document-set
  title: UX document set and prefix
  prompt: Which documents should the UX kind consist of?
  context: 'A kind is identified only by its ID prefix; each prefix costs a row in the kind definition table, a directory, a stem rule, a template and a relation field. A use case already holds a task''s step order and extensions, and each screen''s Interactions table (Trigger | Step | From | To | Target | Capability | Feedback) gives the transitions, so the navigation graph can be derived. Recommended shape per document: element (screen, modal or panel), Purpose, Content (prose region rules and a content tree, no character-cell layouts), States, Interactions and an optional Evidence section naming the project''s own wireframe or screenshot (the medium stays project-owned). See PADR-ux-screen-documents and MAT-ux-documentation-planning-spike section 2.'
  options:
  - id: a
    description: One kind, prefix UX, one document per screen, modal or panel; the use case is the flow and there is no flow document.
    recommended: true
  - id: b
    description: Two kinds, SCR screens and FLOW flow documents (screen inventory and transition table); an explicit overview, but transitions are written in both places.
    recommended: false
  - id: c
    description: One kind UX with two document shapes (screen and flow) told apart by frontmatter; one prefix, two schemas in one template and every reader.
    recommended: false
  allow_note: true
- id: ux-objects
  title: Where UX objects are registered
  prompt: Where should the objects a screen presents (their representations and calls to action per role) be registered?
  context: The glossary fixes names, synonyms to avoid and code identifiers, and moves to docs/steering/glossary.md under PROP-foundation-documents (at most 10 steering files, 24576 body bytes each, frontmatter listed by get-context, bodies read on demand). Adding glossary columns would silently disable its Owner check; a second table there is safe for the check but spends the glossary's byte budget. Seeds are written only once, so existing projects add the register themselves. Screens cite glossary terms in every option; R6 of the review scores against the register when one exists. The register keeps to object, role, representation and CTA names and, at the body cap, to the objects of use cases with UX documents.
  options:
  - id: a
    description: A steering file docs/steering/ux-objects.md that ux-writing creates with the project's first UX document (not seeded), scoped to the objects the use cases touch; projects without an interface never carry it, and R6 is not applicable while it is absent or empty.
    recommended: true
  - id: d
    description: The same steering file seeded by docs-skeleton in every spec project (PADR-ux-screen-documents as drafted); every project, with or without an interface, lists it in each agent context and uses one of its ten steering slots.
    recommended: false
  - id: b
    description: A separate UX object table inside docs/steering/glossary.md, counted against the glossary's 24576-byte cap.
    recommended: false
  - id: c
    description: No register; screens name objects and representations in prose only (no cross-screen consistency check, R6 not applicable).
    recommended: false
  allow_note: true
- id: step-screen-link
  title: How a use case step names its screen
  prompt: Should use case steps cite the UX ID of the screen they happen on?
  context: 'The milestone needs ''use case step without a screen'' and ''interaction serving no step'' checks. All 13 current use cases number steps regularly, and step prose already cites capabilities by ID. Citing UX IDs in steps reuses reference resolution, alias rewriting and devkit spec refs, and the use case author sees the screens. The cost: a product with two interfaces (web and mobile) cites every platform''s screen in every step, and a redesign that splits or merges screens edits use cases whose intent did not change. Screen-side links keep use cases UI-free but need a reverse index, and the use case author cannot see the screens. Either way each interaction names its step as `UC-<slug>` 2a.'
  options:
  - id: a
    description: Steps cite the screen's UX ID in prose next to their capability citations; screens name the served step key.
    recommended: true
  - id: b
    description: Use cases stay free of UX IDs; only the screens name the step keys they serve, and the rule builds the reverse index.
    recommended: false
  allow_note: true
- id: ux-checks
  title: Which mechanical checks ship
  prompt: Which mechanical checks should the UX rules provide?
  context: 'With targets in each screen''s Interactions table, the flow graph checks cost little beyond orphans once their meaning is defined: per listed use case, entries after off-screen steps, exits not required before an off-screen step or at the end, panels exempt, targets UX ID, close, back or end. Extension-to-state coverage needs every extension to name a declared state.'
  options:
  - id: a
    description: 'Orphans and link agreement only: steps without a screen, interactions without or with unknown step keys, usecases agreement.'
    recommended: false
  - id: b
    description: (a) plus the flow graph checks (unknown targets, screens without an exit, modal without close, unreachable screens) and element and table-shape validation.
    recommended: true
  - id: c
    description: (b) plus extension-to-state coverage (each extension reaches a declared state).
    recommended: false
  allow_note: true
- id: coverage-strictness
  title: Strictness of uncovered steps
  prompt: How strictly should the rules treat a use case step without a screen and an interaction that serves no step?
  context: Not every step happens on a screen (a system step, an off-screen actor decision, an *a extension), and screens carry global navigation or help that serves no single step. Every spec rule today has one severity, and an error refuses the commit through the pre-commit gate; RULE-spec-progress is the precedent for a separate warning rule. The milestone exit says the rules report these cases. Known limit under (a) - a system step that wrongly cites no screen also relaxes the exit and reachability errors around it, leaving only the warning.
  options:
  - id: a
    description: 'Split: contradictions (bad keys, link disagreement, graph defects) are errors in RULE-ux-links; uncovered steps and step-less interactions are warnings in RULE-ux-coverage.'
    recommended: true
  - id: b
    description: All reports are errors; authors must cite a screen on every step of a listed use case and give every interaction a step.
    recommended: false
  - id: c
    description: Errors, with a per-step opt-out marker for steps that happen on no screen (a new micro-syntax in use cases).
    recommended: false
  - id: d
    description: Check only steps that already cite a UX ID (no uncovered-step report; weakens the milestone exit condition).
    recommended: false
  allow_note: true
- id: review-method
  title: UX review method
  prompt: What should the isolated UX reviewer do?
  context: 'Evidence (MAT-ux-documentation-practice section 3): an LLM reviewer is credible for a step-by-step walkthrough over declared links, missing states and feedback, and single-screen content; not for severity or real-user validation; run-to-run consistency is moderate. Recommended rubric, 0/1/2 with evidence below 2: R1 task fit, R2 one primary region (no information dumping), R3 states offer a next action, R4 feedback and confirmation of irreversible actions, R5 terms match use case and glossary, R6 objects match the UX object table (not applicable without one). Link-rule items are checked by hand on drafts and kept out of scoring. No severity; at most two rounds; ux-review-NN envelopes with a closing record.'
  options:
  - id: a
    description: Walkthrough only (four questions per use case step).
    recommended: false
  - id: b
    description: Walkthrough plus the six-item 0/1/2 rubric with cited evidence, no severity, at most two rounds.
    recommended: true
  - id: c
    description: (b) with several independent runs merged, like 3-5 evaluators (several times the token cost).
    recommended: false
  allow_note: true
- id: review-placement
  title: When the UX review runs
  prompt: Where in the delivery workflows should the UX review run?
  context: A stage switched on by content (only for units that change screens) is a non-goal of CAP-DLV-delivery-workflows under ADR-delivery-classification, and no check primitive can express it; a mandatory stage would block every unit without a UI. An optional delegation needs no engine change but is not enforced; the effort table would recommend it at medium and high when screens change. At spec depth it runs inside specify, after the Screens section and before spec-plan, so fixes precede plan.md and tasks.md.
  options:
  - id: a
    description: Optional delegation before code, in Planning on drafted screens and inside specify at spec depth; open Planning findings are listed at plan-accept.
    recommended: true
  - id: b
    description: Optional delegation in Planning only; spec-depth units without Planning get no UX review.
    recommended: false
  - id: c
    description: An enforced workflow stage; needs a new decision superseding ADR-delivery-classification and workflow engine changes outside this proposal (scope and size grow).
    recommended: false
  allow_note: true
- id: ux-document-timing
  title: When UX documents are written
  prompt: When should screens become Living Spec documents in docs/ux/?
  context: spec-sync writes docs/ after code review, so docs/ states what exists. Implementation and the UX review need screens before build-verify, and a UX document links use case steps and possibly new use cases or capabilities that are otherwise written only at sync, so writing screens alone early makes the rules refuse the commit. See PADR-ux-drafts-before-code.
  options:
  - id: a
    description: Drafts before code (target-docs.md or a Screens section of spec.md, new IDs in plain text); spec-sync writes docs/ux/ and the use case citations; the rules first check them at living-spec-draft, and a defect the code shares returns the unit to build-verify.
    recommended: true
  - id: b
    description: 'Contract slice at specify: screens plus every use case and capability change they link are written to docs/ on the development branch before code, so the rules run before build; an exception to current-state writing that covers use cases and capabilities too.'
    recommended: false
  - id: c
    description: Review and write only after spec-sync; no timing change, but the review cannot shape the build.
    recommended: false
  allow_note: true
