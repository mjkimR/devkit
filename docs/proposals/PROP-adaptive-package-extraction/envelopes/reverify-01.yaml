summary: 'All five findings of challenger-01 folded at f9b9f2c2 and verified by the planning worker against the edited text: (1) section 3.3 names the seven catalog bundles and a base smoke run, AC-06 scopes pre-existing smoke failures; (2) section 3.6, AC-05 and materials set 3 name both codes, the same-ref step and the snapshot case; (3) release preparation looks a moved bundle up by name (section 3.3, AC-08, materials set 8), keeping the MUST of ARCH-07-deployment 1.1 instead of an exception; (4) AC-02 compares against the merge base; (5) test_deep_research.py imports devkit_adaptive.bundles statically.'
findings:
- issue: AC-06 requires just smoke to exit 0, but section 3.3 only removes adaptive-dev from the asserted set. smoke.sh asserts that the bundles provided by devkit-catalog equal five names; the catalog registers eight (seven after the move).
  evidence: tests/e2e/smoke.sh:228; packages/devkit-catalog/pyproject.toml:11-18; docs/proposals/PROP-adaptive-package-extraction/proposal.md:130-131, :233-237; docs/proposals/PROP-adaptive-package-extraction/materials/planning-evidence.md:160, :168-170
  failure_condition: 'just smoke reaches the discovery assertion in the fresh consumer: the comparison is 8 against 5 at the base and 7 against 4 after the planned edit, so the script exits nonzero and AC-06 is unmet.'
  suggested_action: State in section 3.3 that the assertion becomes the seven remaining catalog bundles; have Development run just smoke at its base first; add the Confirmation line of ADR-adaptive-development-and-research that names the smoke set (line 444) to the planned reference repair.
  resolution: resolved
  severity: P2
- issue: 'Section 3.6 and the guide clause of AC-05 give the step as add devkit-adaptive, sync, commit, and materials set 3 limits the duplicate-registration failure to release wheels of different releases. Two supported states reach it by following that step: a project that pins each devkit Git requirement to a ref and adds devkit-adaptive at the new ref beside a catalog at the old one, and a project whose catalog is a bundle source snapshot wrapper, which carries adaptive-dev until refreshed and then reports devkit remove adaptive-dev as the next action.'
  evidence: packages/devkit-dist/src/devkit_dist/features/distribution/services/installation/discovery.py:95-99; guides/INSTALL_GUIDE.md:109-117; docs/capabilities/distribution/CAP-DIST-content-packages.md:242-255; packages/devkit-dist/src/devkit_dist/features/distribution/services/snapshots/operations.py:93; docs/proposals/PROP-adaptive-package-extraction/materials/planning-evidence.md:99-103; docs/proposals/PROP-adaptive-package-extraction/proposal.md:156-164, :227-228
  failure_condition: 'An environment holds a catalog (old ref, old wheel URL or unrefreshed snapshot wrapper) that still registers adaptive-dev beside devkit-adaptive: every devkit command fails with BUNDLE_PACKAGE_INVALID duplicate installed bundle: adaptive-dev, which the guide neither predicts nor explains.'
  suggested_action: 'Keep the no-bridge option. Extend section 3.6 and the AC-05 guide clause: move every devkit requirement to the same ref or inventory in the step that adds devkit-adaptive; name BUNDLE_PACKAGE_INVALID as the symptom of an old catalog beside it; for a catalog snapshot, refresh the wrapper first and install or snapshot devkit-adaptive instead of following SNAPSHOT_DESELECT_REMOVED. Correct the sentence in materials set 3.'
  resolution: resolved
  severity: P2
- issue: The Version decision and the statement that scripts/releases needs no edit omit what release preparation does to the bundle. It looks up a bundle's previous identity under its package name, so adaptive-dev under the new package has none and takes the release version at the first just version-sync although its fingerprint is unchanged. ARCH-07-deployment 1.1 and ADR-selective-package-versions say a bundle advances only when its own enumerated content changes.
  evidence: scripts/releases/prepare.py:222-228; scripts/releases/identity.py:124-149; docs/architecture/ARCH-07-deployment.md:42-43; docs/decisions/2026-11/20261105-selective-package-versions.md:46-48; docs/proposals/PROP-adaptive-package-extraction/proposal.md:133-134, :262
  failure_condition: 'The first release preparation after the move runs with no edit to the bundle since the baseline: bundle.toml of adaptive-dev advances to the release version with unchanged content, against the MUST, and consumers see a bundle version change without an asset change.'
  suggested_action: Record the consequence as accepted in the Planning decisions and the PADR and add the sentence to the ARCH-07-deployment 1.1 edit; or preserve the version with a lookup by bundle name in scripts/releases/prepare.py, which is outside boundaries.owns and the release Non-Goal.
  resolution: resolved
  severity: P2
- issue: AC-02 anchors the tree comparison to the base commit of the Development branch. Integration merges a moved target into the branch by policy, and the bundle is edited often.
  evidence: docs/proposals/PROP-adaptive-package-extraction/proposal.md:192-198; AGENTS.md (Verification); git log -- packages/devkit-catalog/src/devkit_catalog/adaptive_dev
  failure_condition: The target gains an edit under the old bundle path after the branch base. If the merge carries it to the new path, the head tree differs from the original base tree and AC-02 fails on a correct result; if the merge resolution drops it, AC-02 passes while a landed edit is lost.
  suggested_action: 'Word AC-02 against the old path at the merge base of the checked HEAD and the target: git rev-parse $(git merge-base HEAD <target>):<old path>.'
  resolution: resolved
  severity: P2
- issue: test_deep_research.py stays in the catalog and reads the adaptive-dev bundle by path from packages/devkit-adaptive. The affected-test selector links a test to a package only by ownership or a static import, so a later change to the adaptive-dev bundle no longer selects the role-conflict tests.
  evidence: scripts/affected_tests.py:233-249, :391-424, :57-99; packages/devkit-catalog/tests/integration/bundles/test_deep_research.py:21, :103-118; docs/proposals/PROP-adaptive-package-extraction/proposal.md:133, :144-145; docs/architecture/ARCH-07-deployment.md:134-136
  failure_condition: 'A later edit adds or renames an adaptive-dev subagent that collides with a deep-research role: just test-affected passes locally and only the nightly full suite finds it.'
  suggested_action: In test_deep_research.py import devkit_adaptive.bundles statically and derive ADAPTIVE_DEV from the module, as test_bundle_citations.py does.
  resolution: resolved
  severity: P3
assumptions:
- Finding 3 was closed with the alternative the challenger named second (a lookup by bundle name in scripts/releases/prepare.py), which adds two paths to boundaries.owns; the first alternative would have recorded an exception to a MUST.
