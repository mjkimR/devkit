answers:
- question: ownership
  choice: a
  decision: spec owns the intake trigger and search, and the post-selection procedure is a spec reference file read only on a match; no separate spec-playbook skill exists.
- question: entry-skill
  choice: a
  decision: The generated devkit-playbook skill stays the generic explicit entry, reworded spec-neutrally without the 'other skills do not authorize' clause and keeping the draft offer for explicit discovery; spec adds its own intake step on top.
- question: apply-authority
  choice: a
  decision: Every discovered playbook is confirmed first; spec names the candidate in one line with its classification statement in intake step 1, the user's confirmation is the explicit invocation, and no match asks nothing.
- question: compaction-adr
  choice: a
  decision: The same new ADR partially replaces the adr-compaction invocation statement of ADR-immutable-decisions-editable-records so that confirming a discovered adr-compaction candidate counts as explicit invocation; the old statement gets a one-line pointer.
