summary: 'round 1; initial review: core design (no-ff, object-store merge, effective-policy digest) holds and conflicts with no accepted ADR; 3 P1 (unchecked CLI merge of an advanced base, duplicate merge on rerun, untested landed tree), 13 P2 and 6 P3 on fast-forward-era checks, recovery, signing, Git version and texts; 3 decisions for the user.'
findings:
- issue: Under the no-ff default the CLI devkit worktree finish --merge would merge an advanced base itself with no readiness provider, no commit hooks and no integration lock, and push it without --local-only; the landed tree is checked by nothing.
  evidence: packages/devkit/src/devkit/worktree/lifecycle.py
  failure_condition: The base advanced after the last verification and the agent takes the CLI fallback (every host returning INTEGRATION_CONFIRMATION_UNAVAILABLE); a semantic break lands on main and is pushed.
  suggested_action: Under no-ff the CLI builds a merge commit only when the target is an ancestor of the source and keeps WORKTREE_MERGE_NOT_FF for an advanced base.
  resolution: open
  severity: P1
- issue: 'commit-tree has no already-merged check: a rerun of finish --merge (or a source already contained in the target) builds a second merge commit, against the CAP-WT rerun contract.'
  evidence: docs/capabilities/worktree/CAP-WT-task-worktrees.md
  failure_condition: finish --merge stops after the merge (push failure, WORKTREE_DIRTY, timeout) and the user reruns it as its [FIX] says.
  suggested_action: When the source is already an ancestor of the current target, nothing is built and the merge step is a no-op, for CLI and service; test the rerun.
  resolution: open
  severity: P1
- issue: 'Decision needed: after a clean merge of a later target nothing tests the tree that lands; the provider runs CI rules only and session/unit test evidence was established on the source head, a weaker invariant than today''s ff-only.'
  evidence: docs/capabilities/delivery/CAP-DLV-delivery-workflows.md
  failure_condition: The target advance renames an API the source uses without textual conflict; rules pass and main breaks while the report states verified work.
  suggested_action: 'Decide: accept and disclose; merge only path-disjoint advances; or run a configured check in a scratch worktree (needs an ADR).'
  resolution: open
  severity: P1
- issue: E6 resume under the same approval is broken by unreplaced exact-target checks (ambiguous-merge recovery, validate_finish(merged=False), providers.check target binding); the recorded result commit has no home in a frozen request; post-merge steps require HEAD == result.
  evidence: packages/devkit/src/devkit/integration/service.py
  failure_condition: TARGET_MOVED stored as a failed merge step makes every later resume 'merge outcome is ambiguous'; a commit after the fast-forward makes cleanup stale forever.
  suggested_action: Specify the recovery state machine with a mutable latest-result field outside the digest; after the merge, HEAD contains the result.
  resolution: open
  severity: P2
- issue: Nothing requires the current target to descend from the confirmation target, and ff-only to the result also succeeds after HEAD was reset to an ancestor.
  evidence: packages/devkit/src/devkit/worktree/planning.py
  failure_condition: The user rewrites main to drop a bad commit during confirmation; the executor builds on the rewritten target or reintroduces the dropped commit.
  suggested_action: 'Invariants: the confirmation target is an ancestor of every build target; immediately before the fast-forward HEAD equals that build''s target.'
  resolution: open
  severity: P2
- issue: 'Decision needed: approval validity is unbounded; a retained request can be resumed at any later time onto any later target.'
  evidence: docs/proposals/PROP-integration-follow-ups/decisions/PADR-target-advance-readiness.md
  failure_condition: A partial or TARGET_MOVED request is resumed days later after many unrelated commits with no second look.
  suggested_action: 'Decide: bound the approval (expiry, commit count, or the same integrate call) or state that it is open-ended in the form.'
  resolution: open
  severity: P2
- issue: prepare passes plan.target_sha as the guard's merge_base, correct only under ff-only; prepare and execution guards judge different ranges and neither sees the result.
  evidence: packages/devkit/src/devkit/integration/service.py
  failure_condition: With an advanced base an envelope the target added is read as deleted by the branch and refuses (WORKTREE_BLOCKED).
  suggested_action: In prepare pass merge-base(target, source); state whether guards run on (build target, result).
  resolution: open
  severity: P2
- issue: devkit-spec cleanup decides post-git by HEAD == plan.source_sha; after a no-ff merge it always takes the pre-git branch; cleanup.py is missing from the impact list.
  evidence: packages/devkit-spec/src/devkit_spec/cleanup.py
  failure_condition: A transient error after the merge makes integration_validate raise instead of deferring; a completed integration ends partial or blocked.
  suggested_action: 'Post-git test: the source is an ancestor of HEAD and the worktree is gone; add cleanup.py to 3.3.'
  resolution: open
  severity: P2
- issue: IntegrationContext is digested and passed unchanged to cleanup and provider; adding result_sha and a per-build target leaves undefined which context is approved and which per execution.
  evidence: packages/devkit/src/devkit/integration/models.py
  failure_condition: Replacing request.context breaks digest and scope checks; passing the old context makes providers.check refuse.
  suggested_action: Define an execution context (approved context plus build target and result SHA); say what cleanup revisions may bind to.
  resolution: open
  severity: P2
- issue: commit-tree honours commit.gpgSign; with no TTY signing blocks or fails, and suppressing it makes protected pushes fail; commit-msg trailers (DCO, Change-Id) never appear.
  evidence: docs/proposals/PROP-integration-follow-ups/proposal.md
  failure_condition: A user with commit.gpgsign=true approves and the integration hangs or fails at commit-tree.
  suggested_action: Honour Git config, pre-check identity and non-interactive signing, time-bound commit-tree, document trailers as unsupported.
  resolution: open
  severity: P2
- issue: First minimum Git version (2.38) with no probe; every no-ff integration would depend on merge-tree even without an advance.
  evidence: packages/devkit-dist/src/devkit/core/git.py
  failure_condition: On Git < 2.38 every integration fails as a generic ProviderError or a fake conflict.
  suggested_action: Skip merge-tree when the target is an ancestor of the source; probe the version only when needed with its own code; exit 1 = conflict.
  resolution: open
  severity: P2
- issue: The merge message includes the task ID while claiming no caller text; session task IDs are free caller text.
  evidence: packages/devkit/src/devkit/integration/service.py
  failure_condition: A session task_id with a newline injects forged trailers into a commit devkit authors.
  suggested_action: Use only provider-verified IDs or leave the ID out of the message.
  resolution: open
  severity: P2
- issue: The claim that syncs no longer invalidate confirmations is unmeasured; two units that both re-synced change installation.json on both sides and E3 refuses.
  evidence: docs/proposals/PROP-integration-follow-ups/decisions/PADR-effective-policy-digest.md
  failure_condition: Two concurrent bundle-editing units are refused on every advance.
  suggested_action: Measure overlap; consider checking receipt consistency on the result tree instead of refusing every path changed on both sides.
  resolution: open
  severity: P2
- issue: The PushRejectedWarning [FIX] git pull --rebase drops the merge commit and replays unit commits with new SHAs, contradicting E1.
  evidence: packages/devkit/src/devkit/worktree/lifecycle.py
  failure_condition: The upstream moves between fetch and push in CLI finish --merge and the agent follows the [FIX].
  suggested_action: Change the fix to git pull --no-rebase (or --rebase=merges); update CAP-WT.
  resolution: open
  severity: P2
- issue: 'The impact list misses texts stating the replaced contract: CAP-DLV-delivery-workflows 4.8, MS-multi-host-native-integration exit condition, CAP-INT section 1, the --merge CLI help and lifecycle docstring, CAP-WT section 3, devkit_spec/cleanup.py.'
  evidence: docs/capabilities/delivery/CAP-DLV-delivery-workflows.md
  failure_condition: Reconcile reports a contract mismatch after review passes.
  suggested_action: Add them to 3.3; ask the user before rewriting the milestone exit condition.
  resolution: open
  severity: P2
- issue: E2 omits a scratch detached worktree merge option; the 18 merge commits are into activity branches, not first-parent history on main.
  evidence: docs/proposals/PROP-integration-follow-ups/materials/20261019-base-advance-options.md
  failure_condition: C is chosen without weighing the only option that can test the landed tree.
  suggested_action: Add row D and say why C wins.
  resolution: open
  severity: P3
- issue: The E6 in-call rebuild loop may be unnecessary, and 'devkit executors are serialized' is false for CLI finish --merge, which takes no lock.
  evidence: packages/devkit/src/devkit/worktree/cli.py
  failure_condition: A concurrent CLI finish --merge moves main mid-run; up to four readiness runs per call.
  suggested_action: Drop or justify the loop; have CLI finish --merge take the same common-directory lock.
  resolution: open
  severity: P3
- issue: Which [worktree] merge value applies when base and source disagree is unspecified.
  evidence: packages/devkit/src/devkit/integration/service.py
  failure_condition: Source ff-only, base no-ff; the result's policy contradicts the method used.
  suggested_action: ff-only in either wins; add merge to config KEYS and the template.
  resolution: open
  severity: P3
- issue: The provider's target-bound declaration is not bound in the request; [tool.spec] is only validated, never compared, by the provider re-run.
  evidence: packages/devkit-spec/src/devkit_spec/integration.py
  failure_condition: A provider declaring everything target-bound voids evidence equality; a [tool.spec] change is accepted silently.
  suggested_action: Record the declared set in the digest; reword the PADR consequence.
  resolution: open
  severity: P3
- issue: Building the prospected result at prepare writes objects while CAP-INT calls integration_prepare read-only.
  evidence: docs/capabilities/integration/CAP-INT-mcp-services.md
  failure_condition: Each preflight leaves unreachable objects; the read-only promise is wrong.
  suggested_action: Reword to no ref, index or worktree changes, or compute only the tree at prepare.
  resolution: open
  severity: P3
- issue: Superseded ADRs cited (ADR-worktree-and-pull-request-levels, ADR-approval-gates-intent-direction-integration); excludes docs/decisions vs handoff PADR promotion; title and summary still describe four extensions.
  evidence: docs/decisions/2026-10/20261015-worktree-and-pull-request-levels.md
  failure_condition: The spec names superseded ADRs and out-of-scope extensions.
  suggested_action: Cite superseding ADRs, allow PADR promotion, retitle to the base-advance scope before plan-accept.
  resolution: open
  severity: P3
- issue: 'Decision needed: Q1. Q2 contradicts an accepted ADR verbatim; the Q3-after-Q2 order is a preference, not a dependency.'
  evidence: docs/proposals/PROP-integration-follow-ups/proposal.md
  failure_condition: A draft is planned for a direction the user rejects at its first gate.
  suggested_action: The user decides whether a policy may ever grant merge authority before Q2 becomes a draft; state the order as a preference.
  resolution: open
  severity: P3
