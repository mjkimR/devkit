questions:
- id: q1-split
  title: Split and order of the four extensions
  prompt: Should this proposal narrow to the base advances and leave the other three extensions to separate drafts?
  context: This decides what this proposal hands off to Development and what stays for later Planning. Base advances affect every integration today, and auto dispatch needs them. Auto dispatch contradicts the accepted ADR-integration-approval-asserted word for word ('no policy value grants commit, merge, publication or deletion authority'), so it needs your decision on policy authority before anyone plans it. Pull request cleanup needs its own squash-equivalence proof. Host confirmation is research on the hosts, independent of the rest; the Claude Code terminal is already verified.
  options:
  - id: split
    description: Narrow this proposal to base advances (E1 to E6) and retitle it. Create child drafts for pull request cleanup (Q3) and host confirmation (Q4). Auto dispatch (Q2) stays as open feedback until you decide whether a policy may ever grant merge and deletion authority.
    recommended: true
  - id: split-all
    description: As above, but also create an auto-dispatch child draft now. Its Planning starts with the policy-authority decision and ends in a superseding ADR if you say yes.
    recommended: false
  - id: together
    description: 'Keep all four in one spec: one large XL Development, and auto dispatch still needs a superseding ADR inside it.'
    recommended: false
  - id: backlog
    description: Return the whole proposal to Backlog for decomposition (needs_decompose) and plan nothing now.
    recommended: false
  allow_note: true
- id: e1-merge-method
  title: Merge method default
  prompt: Should integration land every task as a merge commit (no-ff) by default, with ff-only as a project option?
  context: Your Backlog leaning was no-ff. Planning found it the only option whose history shape does not depend on timing. It keeps every SHA the unit records cite reachable, gives one --first-parent line per task, and lets a later target be merged in without a new confirmation. The cost is one extra commit per integration, even when the target did not move.
  options:
  - id: no-ff-default
    description: New [worktree] merge key, default no-ff, with ff-only available for projects that need linear history (ff-only in either policy wins).
    recommended: true
  - id: no-ff-only
    description: 'Always no-ff with no key: simpler, but a project cannot keep linear history.'
    recommended: false
  - id: ff-only-default
    description: 'Keep ff-only as the default and make no-ff opt-in: base advances stay refused unless a project opts in.'
    recommended: false
  allow_note: true
- id: t-tests-on-result
  title: Tests on the merged result
  prompt: When later target commits are merged in cleanly during the confirmation, is it acceptable that only the CI rules run on the merged result, not the tests?
  context: Today ff-only makes the landed tree the verified tree. With base advances tolerated, a target change that breaks the source semantically, with no textual conflict and no rule violation, can land on main. The window is limited to commits landed during the confirmation and execution, because prepare still requires the branch to contain the target. The executor never runs commands.
  options:
  - id: disclose
    description: Accept it. The form and the integration report say that tests and review ran on the source and only the CI rules ran on the result; main's own CI finds the rest.
    recommended: true
  - id: path-disjoint
    description: Merge in a later target only when its changed paths are disjoint from the source's. Otherwise refuse. This cuts textual merges, but semantic breaks across files remain.
    recommended: false
  - id: scratch-tests
    description: Build the result in a scratch worktree and run a configured check command there. The landed tree is then tested, but this needs an ADR, because the executor would run commands.
    recommended: false
  allow_note: true
- id: a-approval-lifetime
  title: Approval lifetime for target advances
  prompt: Should an approval tolerate target advances only within the integrate call that asked for it?
  context: The approval no longer binds the target SHA. Without a bound, a retained request could be resumed hours later onto a target that gained many unrelated commits, with no second look from you.
  options:
  - id: within-call
    description: Only within that call. integration_resume continues only onto the last build target (permission failures, cleanup after the merge); a later target needs a new confirmation.
    recommended: true
  - id: process-lifetime
    description: Any later target while the MCP process keeps the request, stated in the form text.
    recommended: false
  - id: expiry
    description: A time bound (for example 30 minutes from the confirmation), then a new confirmation.
    recommended: false
  allow_note: true
- id: m-milestone-wording
  title: Milestone exit-condition wording
  prompt: May Development update MS-multi-host-native-integration's exit condition from 'bound to the verified source and target commits' to 'bound to the verified source commit and the confirmation target and its descendants'?
  context: The base-advance design changes what the approval binds. The milestone text is yours to change, so Planning did not rewrite it. Left as is, reconcile would report a mismatch with the milestone.
  options:
  - id: update
    description: Development updates the wording during reconcile, in the same change.
    recommended: true
  - id: keep
    description: Keep the wording; the milestone then treats the new binding as not meeting its exit condition.
    recommended: false
  allow_note: true
