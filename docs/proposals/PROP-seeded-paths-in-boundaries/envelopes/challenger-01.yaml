  resolution: open
  severity: P2
- issue: Nothing checks or records that devkit sync --check exited 0 on the accepted head, which separates change outputs from drift.
  evidence: development-worker.md.jinja step 5 runs sync only after editing; the Host checks only the returned head
  failure_condition: Pre-existing drift is written, labelled (sync output) and passes the Host check.
  suggested_action: Worker runs sync --check before the first edit and records it as a check (sync_start); nonzero is a problem; Validate requires it.
  resolution: open
  severity: P2
- issue: worker inspect derives scope from _Boundary at the tip and strips notes, so its scope pass carries no information for (sync output) entries.
  evidence: inputs.py derive_scope; bundle.py split_boundary; inspect.py scope check
  failure_condition: An unrelated path labelled (sync output) passes inspect and is accepted without the receipt lookup.
  suggested_action: Validate states inspect's pass is not evidence for these entries; check each (sync output) entry tasks.md gained since accepted against the receipt rule.
  resolution: open
  severity: P2
