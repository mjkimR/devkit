summary: 'Host hook contracts from vendor documentation retrieved 2026-11-10: Claude Code and Codex both document Stop, SubagentStop and SessionStart with a decision block or exit 2 contract and stop_hook_active; Antigravity documents Stop and SessionStart with a different registration and input shape and no SubagentStop. Quotes were extracted by a summarizing fetch and are not byte-verified.'
findings:
- issue: 'Claude Code: a stop gate is feasible on Stop (main agent) and on SubagentStop (subagent) with the same block contract. Stop does not fire for subagents; a Stop hook in subagent frontmatter is converted to SubagentStop at runtime. agent_id and agent_type are present when a hook fires inside a subagent.'
  evidence: https://code.claude.com/docs/en/hooks sections Stop, SubagentStop, Stop decision control, Common input fields; https://code.claude.com/docs/en/sub-agents section on Stop hooks converted to SubagentStop; retrieved 2026-11-10
  suggested_action: Register the gate for Stop and SubagentStop separately; tell the main session from a subagent by the event and by agent_id; do not rely on Stop firing inside subagents.
  resolution: open
- issue: 'Claude Code loop protection: stop_hook_active is true when the turn already continues because of a stop hook; after eight consecutive stop-hook continuations the next block is overridden and the turn ends; the counter resets on each tool call; CLAUDE_CODE_STOP_HOOK_BLOCK_CAP raises the cap; Stop does not run on a user interrupt.'
  evidence: https://code.claude.com/docs/en/hooks section Stop; retrieved 2026-11-10
  suggested_action: The gate reads stop_hook_active and releases when it is true; it cannot hold a session indefinitely and a user interrupt bypasses it.
  resolution: open
- issue: Codex documents Stop and SubagentStop with the same JSON decision block or exit 2 contract, stop_hook_active on both, and agent_id, agent_type and agent_transcript_path on SubagentStop. CAP-HOST-lifecycle-observation lists six events without SubagentStop or SubagentStart, so devkit cannot register a subagent stop hook on Codex.
  evidence: docs/capabilities/host/CAP-HOST-lifecycle-observation.md:63; https://learn.chatgpt.com/docs/hooks (redirect target of https://developers.openai.com/codex/hooks) sections Hook Events, Per-Event Input Fields, Stop Output Contract; retrieved 2026-11-10
  suggested_action: Add SubagentStop with its fields and output contract to the Codex adapter and the capability if a subagent gate is delivered; otherwise state that subagent gating is out of scope.
  resolution: open
- issue: 'Codex timeout: when timeout is omitted Codex uses 600 seconds for most hooks; the 10 second default in CAP-HOST-lifecycle-observation is devkit''s own. Behavior on a timeout or on an exit code other than 0 and 2 is not stated for Stop or SubagentStop.'
  evidence: docs/capabilities/host/CAP-HOST-lifecycle-observation.md:58-62; https://learn.chatgpt.com/docs/hooks section Hook Shape and Timeouts; retrieved 2026-11-10
  suggested_action: Keep writing an explicit timeout into the registration; design the gate so that it releases by itself and never depends on the host's timeout behavior.
  resolution: open
- issue: 'Codex trust: hooks that are not managed must be reviewed and trusted before they run; trust is recorded against each hook''s hash, and a changed hook is skipped until reviewed again with /hooks. Project hooks load only when the project .codex layer is trusted. The capability does not state that a sync changing a registration makes Codex skip the hook until review.'
  evidence: https://learn.chatgpt.com/docs/hooks sections Trust and Review, Registration Locations; docs/capabilities/host/CAP-HOST-lifecycle-observation.md:35-38; retrieved 2026-11-10
  suggested_action: State the review step in the capability and the reference page; keep trust reported as unknown; treat an unreviewed gate as a silent release.
  resolution: open
- issue: Codex hooks are enabled by default; features.hooks = false disables them and codex_hooks is a deprecated alias.
  evidence: https://learn.chatgpt.com/docs/hooks section Feature Flag; https://learn.chatgpt.com/docs/config-file/config-reference table features; retrieved 2026-11-10
  suggested_action: Mention that host status cannot establish whether the user disabled hooks.
  resolution: open
- issue: 'Session start context limits differ: devkit caps handler context at 4096 characters; Codex applies a default threshold of about 2500 tokens per hook output message and saves larger output to disk with a preview (additionalContextLimit per handler); Claude Code caps additionalContext and plain stdout at 10000 characters and saves larger output to a file with a 2000 character preview.'
  evidence: docs/capabilities/host/CAP-HOST-lifecycle-observation.md:125; https://learn.chatgpt.com/docs/hooks section SessionStart; https://code.claude.com/docs/en/hooks section Common output; retrieved 2026-11-10
  suggested_action: Keep the 4096 character devkit limit, which is below both host limits, and record that the limit is devkit's own.
  resolution: open
- issue: 'Antigravity documents hooks at /docs/hooks/: events SessionStart, PreToolUse, PostToolUse, PreInvocation, PostInvocation and Stop, registered in the workspace file .agents/hooks.json as a map of named hooks with a default timeout of 30 seconds. Stop continues with decision continue and an optional reason; SessionStart injects through injectSteps. The input carries conversationId and workspacePaths, not session_id and cwd. No SubagentStop, exit-code contract, failure behavior, trust rule or size limit is stated.'
  evidence: https://antigravity.google/docs/hooks/ event table, Config file and shape, Stdin input fields, Output contract; https://antigravity.google/docs/sdk/lifecycle/ is the Python SDK, a different mechanism; retrieved 2026-11-10
  suggested_action: Do not treat Antigravity as a supported gate host in this proposal; its input and registration shapes differ from the other two hosts and need their own adapter; recheck the page before any Antigravity work. Gemini CLI hooks are a neighbour product and not Antigravity's contract.
  resolution: open
- issue: 'Claude Code registration: hooks are read from ~/.claude/settings.json, .claude/settings.json, .claude/settings.local.json, managed policy, plugin hooks/hooks.json and skill or subagent frontmatter; hook entries merge across settings levels; the same handler defined in more than one settings file runs once; settings-file edits are picked up by a file watcher; matching hooks run in parallel; hooks from settings files also run inside subagents; the default command timeout is 600 seconds and a timed-out hook renders no decision; an exit code other than 0 and 2 is a non-blocking error.'
  evidence: https://code.claude.com/docs/en/hooks sections Hook locations, Timeouts, exit codes; https://code.claude.com/docs/en/settings sections Settings files, Settings precedence; retrieved 2026-11-10
  suggested_action: A Claude Code adapter registers matcher groups under the hooks key of a project settings file whose other keys the user owns; a failed or timed-out gate releases the stop.
  resolution: open
- issue: Claude Code Stop input lists stop_hook_active, last_assistant_message, background_tasks and session_crons; Codex Stop input lists stop_hook_active and last_assistant_message. Codex Stop output must be JSON on stdout at exit 0; plain text is invalid.
  evidence: https://code.claude.com/docs/en/hooks section Stop input; https://learn.chatgpt.com/docs/hooks sections Per-Event Input Fields, Stop Output Contract; retrieved 2026-11-10
  suggested_action: A gate on Claude Code can read background_tasks to tell a pause that waits for running subagents from an end with nothing running; its shape needs a live probe.
  resolution: open
