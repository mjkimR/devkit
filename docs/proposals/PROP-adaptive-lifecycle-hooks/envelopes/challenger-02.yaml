summary: 'round 2; 10 findings (0 P1, 7 P2, 3 P3), none a Decision needed. The failure condition of every round 1 finding except 10 is removed by the fold and none recurs. The fold introduced seven specification defects: the O1 restriction, a wrong-block criterion that selects the block condition, the name-aware release rows, the held-turn reconciliation, the dependencies of the narrow SubagentStop gate, the ended variant of option (e), and the choice list for a Claude Code adapter. No size or spec count changes; keeping size L is still defensible.'
findings:
- issue: The O1 restriction added for concurrent sessions drops the assignments a resumed session inherits. O1 counts only assignments whose assigned_at lies inside the session window until N3 exists, but the interrupted-writer scenario counts F1 at the end of the resumed session for three assignments recorded in the earlier session, so F1 there is zero by construction. The same holds for any observed run that resumes earlier work.
  evidence: materials/gate-behavior-and-measurement.md:187, :199-201, :207-208, :217; PROP-adaptive-assignment-cli at 0cf00a40 proposal.md:223
  failure_condition: A resumed Host ends with the three inherited assignments open and unnamed. O1 is empty, no F1 is counted, and the Stop gate criterion is read against an undercount in the scenario built to count it.
  suggested_action: In O1, apply no restriction in constructed scenarios. For observed runs, take the assignments recorded in the session window plus, for a resumed run, those recorded in the window of the session it resumes. Say how another session recording during the window is detected, for example an assignment in the window whose new call is absent from the session transcript.
  resolution: open
  severity: P2
- issue: The wrong-block criterion does not test the name-aware condition and cannot be met by the state-only condition when Hosts behave correctly, so the criteria choose the block condition while the proposal says the choice is left to the specification. A would-be wrong block is a block although every outstanding ID is named; the name-aware condition blocks only when an ID is unnamed, so its count is zero by definition. The criterion also reads under the block condition to be delivered, which needs the choice before the decision it feeds. The real open decision is whether a handler may read .devkit/adaptive-dev.md, which changes CAP-DLV-adaptive-development:328 and the sentence No command reads or writes it of the ledger PADR in the other unit; W8 lists only the first.
  evidence: materials/gate-behavior-and-measurement.md:59, :66-68, :204-205, :219, :232; proposal.md:72, :91-93, :155-156; materials/devkit-gaps-and-work-breakdown.md:87; docs/capabilities/delivery/CAP-DLV-adaptive-development.md:328; PROP-adaptive-assignment-cli at 0cf00a40 decisions/PADR-adaptive-assignment-ledger-storage.md:60
  failure_condition: The user reads the criteria as an empirical test fixed before measurement. Five pause runs per host carry no information under the name-aware condition. If the context-file contract change is later refused, only the state-only condition remains and it fails the criterion whenever Hosts name their IDs, so no Stop gate is deliverable and nothing in the proposal said so.
  suggested_action: State in gate-behavior 3.1 and 4.4, and in proposal 3.5 and Q8, that the wrong-block criterion discriminates only the state-only condition; under the name-aware condition the decision rests on F1 and the probes. Evaluate the criterion for both conditions, and run the pause scenario only while state-only is a candidate. Name the read of the context file as the decision that selects the condition, add the ledger PADR sentence to the Documents of W8, and add it to the Host item of proposal 3.8 beside W6.
  resolution: open
  severity: P2
- issue: 'Three cells of the name-aware column do not hold as written. (1) Repeated stop after the model ran a tool is said to release because the IDs are named or the Host has acted, but return, verify and a new dispatch leave the IDs outstanding and unnamed; only naming or closing releases. (2) State the gate keeps: None means a cancel by second stop, and continuation 3, are forgotten at the next turn, where stop_hook_active is false again; the gate then blocks at every turn end until every outstanding ID is named, and an unrelated session in the checkout is blocked every turn, not once. (3) live-probes section 6 says the name-aware condition bounds its own blocks if stop_hook_active is false after a tool call; that is true only when the model chooses continuation 2.'
  evidence: materials/gate-behavior-and-measurement.md:57-64, :70-76, :83, :85, :88, :98-102; materials/live-probes.md:145; materials/devkit-gaps-and-work-breakdown.md:46; proposal.md:155-157
  failure_condition: A Host on Codex with three open, unnamed assignments is blocked, records a return and a verification, and stops. If probe CX-3b shows stop_hook_active false after a tool call, it is blocked again after each further action until it names or closes all three. A user who cancels with the second stop is blocked again at the end of the next turn.
  suggested_action: 'Correct the three cells: under the name-aware condition naming or closing is the only durable release, and acting, cancelling and not mine release for one stop only. Then either state that as the behavior and count its blocks as one per turn end until every outstanding ID is named, or give the name-aware condition the same per-session record, in which case G11 applies to both conditions and keeps no state is no longer a difference. W8 stays M either way.'
  resolution: open
  severity: P2
- issue: The reconciliation of the held turn is wrong for a hook that fails before devkit runs. Section 4.4 and live-probes section 6 say a held turn in CX-6 or CX-7 is not a reason against delivery because the handler gets a deadline and a failed dispatch already prints a valid release. CX-7 exits 1 without output, the proxy for a command that is not found or cannot import (gap G12); neither a handler deadline nor the dispatch fallback covers that. Proposal 3.2 also still states that a gate that cannot run releases silently on both documented hosts while its own table classes the Codex behavior as unknown.
  evidence: materials/live-probes.md:33-34, :110, :151; materials/gate-behavior-and-measurement.md:238-239; proposal.md:83-84, :106, :108-109; materials/devkit-gaps-and-work-breakdown.md:47; packages/devkit-dist/src/devkit_dist/features/host/repositories/adapters/codex.py:21-23; docs/capabilities/host/CAP-HOST-lifecycle-observation.md:101-104, :133-135
  failure_condition: CX-7 shows that Codex holds or continues the turn on a nonzero exit. The gate is delivered on Codex as the criteria allow. A Codex session started without the project environment on PATH then has every stop held by a command that never reaches devkit.
  suggested_action: 'Split the row of live-probes section 6: a held turn in CX-6 adds the handler deadline; a held turn in CX-7 means a missing or broken devkit holds every stop, so either the generated command gains a fallback that prints an empty object (a change to CAP-HOST-lifecycle-observation section 4 and to the receipt command, added to W1) or no Stop gate is delivered on Codex. Make section 4.4 say the same. Restrict the proposal sentence to Claude Code and devkit, with Codex unknown until CX-6 and CX-7.'
  resolution: open
  severity: P2
- issue: 'The narrow SubagentStop gate (W9a) omits a dependency and a criterion term. (1) Loop breaker: its conditions have no naming release, a blocked worker always runs tools before it stops again, and the host cap for SubagentStop is not stated; if stop_hook_active is false after a tool call the gate needs a per-agent record (G11), which W9a does not list, and no probe step observes it for a subagent. (2) The delivery criterion has no wrong-block term: a worker whose correct result is no change is blocked by the no-changes condition. (3) F3 counts failures of the commit check, for which the gate has no condition, and the gate''s uncommitted paths under a commit grant condition corresponds to no failed check.'
  evidence: materials/gate-behavior-and-measurement.md:117-126, :203, :234; materials/devkit-gaps-and-work-breakdown.md:46, :88; materials/live-probes.md:72-74, :76, :105-108; materials/host-capability-matrix.md:56; materials/host-documentation-extraction.md:43; PROP-adaptive-assignment-cli at 0cf00a40 proposal.md:166-171, :256, :278-280
  failure_condition: An assignee with a write scope finds that no change is needed and stops. The gate blocks on no-changes, the worker runs a command to check and stops again, stop_hook_active is false, and it is blocked at every stop until the host's turn limit, or it makes a change to pass.
  suggested_action: 'Add a fourth unestablished item to section 3.2 and to the risk of W9a: stop_hook_active on SubagentStop after a tool call and a host cap, with G11 in its modules unless the probes show the field persists. Add steps CC-3c and CX-4c: mode tool, then always-tool, with a subagent. Add a wrong-block term to the criterion, computable from the ledger: returns that verified pass although a gate condition held at the return. Align F3 with the conditions: add commits without a commit grant as a condition, or drop commit from F3.'
  resolution: open
  severity: P2
- issue: 'Option (e) with the recommended q2 variant, this unit ended without acceptance and its materials retained, is not executable as written. Ending without acceptance is status rejected: a hygiene pass writes a rejection ADR and deletes the directory. The text names neither the rejection nor its reason sentence, does not say who moves the five materials or when although they cite envelopes and proposal sections that are deleted with the directory, leaves no Backlog record for the pending measurement, would keep the user''s answers to q1 and q3 only in an answer envelope of the deleted directory, and names no owner for the probes.'
  evidence: materials/devkit-gaps-and-work-breakdown.md:113-124; proposal.md:201-205, :218-219; .devkit/managed/spec/skills/spec/references/backlog.md:7; .devkit/managed/spec/skills/spec/references/worker-records.md:49; materials/host-capability-matrix.md:41-42
  failure_condition: The user answers q2 with (e), ended. The proposal is rejected and later deleted, and a rejection ADR records hook gates as rejected although the outcome was decide after measuring. When the commands are delivered, nothing in Backlog names the measurement, its owner or its end, and the answer to q1 is gone.
  suggested_action: 'Spell out the ended variant in gaps section 5 item 5 and in q2: the status is rejected with the reason delivery decision deferred until the measurement, a criterion met reopens it as a new proposal; before that commit the Host moves the five materials under docs/materials/ with material IDs, replaces their references to the envelopes and the proposal, and writes the answers to q1 and q3 into them; a draft proposal for the measurement, depending on PROP-adaptive-assignment-cli, carries the trigger, owner and end; item 2 names who runs the probes. Ask q4 only when q2 selects an option with session-start injection.'
  resolution: open
  severity: P2
- issue: 'The new section 3.1 says the only open decision of a Claude Code adapter is which settings file devkit writes, and that it does not change the adapter''s size. Its three choices are variants of one ownership model. The same folder records two registration paths that write no settings file: a snippet the user installs, the third ownership model of the earlier evaluation, and hooks in subagent or skill frontmatter, where a Stop hook in subagent frontmatter becomes SubagentStop and devkit already writes the Claude Code role files as its own projections. Neither path needs the host configuration boundary changed in three capabilities, an ownership store or an adopt rule, which are what make W4 size L and the delivery two specs.'
  evidence: materials/devkit-gaps-and-work-breakdown.md:55-57, :62-73, :82, :131-133; materials/host-documentation-extraction.md:34, :41; envelopes/scout-01.yaml; packages/devkit-dist/src/devkit_dist/features/distribution/services/bundles/subagents.py:26-39; docs/capabilities/distribution/CAP-DIST-agent-projections.md:59-69; proposal.md:67, :71
  failure_condition: The user runs adaptive Host sessions on Claude Code, reads that the smallest delivery there is W4 at size L before anything else, and drops Claude Code or accepts a boundary change in three capabilities without having seen that a smaller registration path was available.
  suggested_action: 'Add a fourth row to section 3.1: devkit writes no Claude Code settings file; it prints the registration for the user to install and only reads the file to verify it at dispatch; for SubagentStop it can register through the projected role file. State the consequences (a manual step per clone, no removal by sync, frontmatter hooks documented but unprobed and not usable for SessionStart) and whether W4 stays L and the spec count stays two under that row, or record why the row is excluded. Adjust the size sentence and Q3 and Q7 of the proposal to match.'
  resolution: open
  severity: P2
- issue: Gaps section 7 says ADR-mcp-runtime-and-shared-artifacts limits automatic writes of host files to project files that are untracked and ignored. The cited clause sits under MCP runtime and project registration and governs MCP registration; the hook path writes .codex/hooks.json with no tracked-file test. Under the section 7 reading, choice 1 of section 3.1 would be barred, yet section 3.1 says its rules carry over unchanged.
  evidence: materials/devkit-gaps-and-work-breakdown.md:69, :180-182; docs/decisions/2026-11/20261102-mcp-runtime-and-shared-artifacts.md:132, :142-149, :158-159; docs/capabilities/host/CAP-HOST-lifecycle-observation.md:76-96; docs/capabilities/mcp/CAP-MCP-runtime-registration.md:59-65; packages/devkit-dist/src/devkit_dist/features/host/services/configuration.py:52-86
  failure_condition: The adapter's unit either drops choice 1 as barred by an accepted ADR, or picks it without knowing whether a superseding decision is needed.
  suggested_action: 'Reword section 7: the clause binds MCP registration; a hook adapter is bound by CAP-HOST-lifecycle-observation section 3. Say in the row of choice 1 that it follows the hook rule and departs from the MCP practice of writing only untracked ignored files.'
  resolution: open
  severity: P3
- issue: 'q3 now recommends running the probes now where the earlier text recommended the decision point, with no reason given. Probe results are bound to a host version: the matrix records codex-cli 0.167.0 against 0.163.0 in the spike 24 days earlier, and the delivery criteria read the probes at the end of a window that starts only after another unit''s Development. live-probes also says a probe changes no user-level host setting, while its own cleanup step removes a trust entry the host recorded.'
  evidence: proposal.md:203; materials/gate-behavior-and-measurement.md:232, :234; materials/host-capability-matrix.md:27; docs/materials/2026-10/20261017-hook-driven-integration-cleanup/codex-spike-evidence.md:8; materials/live-probes.md:6, :15-16; materials/devkit-gaps-and-work-breakdown.md:116
  failure_condition: The user spends about twelve live steps per host now. At the decision point the hosts are several releases on, and the criteria are read against stale probe results or the probes are run again.
  suggested_action: 'Give the reason in q3 and narrow the recommendation: run now only the probes that can remove an option before the measurement (CX-4, CC-3b and CX-4b, CC-2b and CX-3b, CX-7), and repeat the probes a criterion names on the host version current at the decision. Say in live-probes section 1 that the trust prompts write user-level host state, which the cleanup removes.'
  resolution: open
