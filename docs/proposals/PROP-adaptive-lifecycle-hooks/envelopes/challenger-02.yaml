- issue: Two small gaps in the probe procedure. (1) In mode tool the script blocks again whenever stop_hook_active is false, so in the outcome CC-2b and CX-3b look for, the session loops without a stated end. (2) Section 1 does not say whether the probe files are part of the one commit of main/; if they are, wt/ holds its own probe.py and registration, CX-10's copy step is void, and a line can land in wt/probe.log.
