summary: No bundle, preset, config-value or skill alias mechanism exists; sync refuses a selected bundle no package provides (SELECTION_INVALID, fix devkit remove) and never moves project-owned .devkit/incubation.md. Document IDs alias cleanly, but alias references in ADRs are reported and rewritten. Repository precedent for renames is in place with docs, under 0.x lockstep versioning.
findings:
- issue: 'A selected bundle no installed package provides makes sync refuse with SELECTION_INVALID (exit 2, fix devkit remove <names>); status reports it, config show does not. adaptive-dev then appears unselected (BUNDLE_UNSELECTED) and needs devkit add: a two-step manual migration unless a redirect is added.'
  evidence: packages/devkit-dist/src/devkit_dist/features/distribution/services/installation/config.py:238-276; packages/devkit-dist/src/devkit_dist/features/distribution/usecases/sync.py:220-242,891-900; usecases/status.py:209-220
  suggested_action: Document the remove-then-add steps; a redirect needs new code in devkit-dist
  resolution: open
- issue: No bundle, preset, config-value or skill-name alias exists; bundle.toml keys are closed; only playbooks and document IDs carry aliases. A shim bundle cannot reuse the entry-point name or deploy the same paths. Precedent devkit:run -> harness:run was an in-place rename failing with SELECTION_INVALID until the config changed.
  evidence: services/bundles/manifest.py:443-457; services/installation/discovery.py:79-104; docs/decisions/2026-10/20261022-package-split-and-namespaces.md:285-288; docs/decisions/2026-10/20261022-playbook-aliases-as-identifiers.md:44-50
  suggested_action: Follow the in-place precedent unless the user wants a deprecation window
  resolution: open
- issue: Deselected bundle files are removed by sync when byte-identical to the receipt; edited ones stay as ORPHAN_LEFT. Overrides under .devkit/overrides/incubation/ stay (OVERRIDE_RETAINED) and need a manual move.
  evidence: usecases/sync.py:290-339; docs/capabilities/distribution/CAP-DIST-workspace-ownership.md:71-106; usecases/commands.py:299-310
  suggested_action: Name the override move in the migration guide
  resolution: open
- issue: No deprecation-notice pattern for config values exists; DEVELOPMENT_CONFIG_INVALID refuses any unknown value and CAP-DIST-sync-and-transactions requires refusal. A warn-and-accept window needs normalization in development_approach, a new notice code and a contract amendment.
  evidence: packages/devkit-dist/src/devkit_dist/features/project/models/development.py:9-33; docs/capabilities/distribution/CAP-DIST-sync-and-transactions.md:605-613; features/project/models/presentation.py:23-31
  suggested_action: Prefer a targeted DEVELOPMENT_CONFIG_INVALID fix naming the replacement over a window
  resolution: open
- issue: .devkit/incubation.md is written only by the coordinator per skill text; no code reads it and sync never touches it, so a renamed path leaves an existing file invisible unless the entry reads or moves it.
