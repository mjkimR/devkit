questions:
- id: q1
  title: Legacy approach and bundle migration
  prompt: How should an existing consumer with approach = "incubation" and the incubation bundle reach adaptive-dev?
  context: Decides the devkit-dist parser behavior, its tests and the install-guide migration steps. No deprecation-notice mechanism exists, and CAP-DIST-sync-and-transactions requires refusing unknown values. A plain refusal also blocks the consumer's migration commit in devkit integration, because readiness parses the committed target config (old value) and the result (new value). Open challenger finding 3.
  options:
  - id: a
    description: Refuse "incubation" in the working config with DEVELOPMENT_CONFIG_INVALID and a fix naming the exact edit; read a legacy value in committed snapshots as adaptive-dev so the migration commit integrates; guides give ordered steps (upgrade all packages, edit value, devkit remove incubation, devkit add adaptive-dev, move overrides with asset paths, move the context file).
    recommended: true
  - id: b
    description: Refuse "incubation" everywhere with the targeted fix; the guide tells the consumer to commit the upgrade and config edit directly on the target branch, outside devkit integration. Smallest code change; the migration bypasses the integration path.
    recommended: false
  - id: c
    description: Accept "incubation" with a new deprecation warning for one minor release everywhere, normalizing it to adaptive-dev, then refuse. Needs a new notice code and an amendment of the CAP-DIST refusal rule; no consumer breaks in that release.
    recommended: false
  - id: d
    description: Refuse "incubation" everywhere and accept that a consumer's migration commit cannot pass devkit integration.
    recommended: false
  allow_note: true
- id: q2
  title: Replacement term for proposal incubation
  prompt: Which term replaces "proposal incubation" for the SDD proposal lifecycle?
  context: Decides the new IDs and titles of CAP-DLV-proposal-incubation and UC-incubate-and-hand-off-a-proposal, the devkit spec proposal help text and about 21 referencing files. The spec bundle already names this activity Planning (planning.md, plan-<slug>, plan-intent, plan-accept, planning-worker, planning_effort). No collision with existing IDs or glossary terms.
  options:
  - id: a
    description: 'proposal Planning: CAP-DLV-proposal-planning (Proposal Planning and Handoff), UC-plan-and-hand-off-a-proposal; reuses the existing Planning vocabulary.'
    recommended: true
  - id: b
    description: 'proposal lifecycle: CAP-DLV-proposal-lifecycle (Proposal Lifecycle and Handoff), UC-shape-and-hand-off-a-proposal; broader, adds a second word for the same activity.'
    recommended: false
  - id: c
    description: 'proposal shaping: CAP-DLV-proposal-shaping, UC-shape-and-hand-off-a-proposal; a new term the bundle does not use yet.'
    recommended: false
  allow_note: true
- id: q3
  title: Entry and role names in adaptive-dev
  prompt: Which names do the renamed bundle's entry skill, pointer guidance and shared researcher role take?
  context: Decides consumer-facing skill and subagent names projected into .claude/.agents/.codex; skill and role names have no alias mechanism, so a later change is another breaking rename. The researcher role is renamed only if it stays in this bundle after PROP-deep-research-bundle settles its owner.
  options:
  - id: a
    description: Entry /adaptive-dev (matches the bundle name as /spec matches spec), pointer adaptive-dev-pointer, researcher product-researcher (beside product-clarifier).
    recommended: true
  - id: b
    description: Entry /adapt (short verb), pointer adaptive-dev-pointer, researcher adaptive-researcher.
    recommended: false
  - id: c
    description: Entry /develop, pointer adaptive-dev-pointer, researcher product-researcher; reads as generic development and may collide with SDD wording.
    recommended: false
  allow_note: true
- id: q4
  title: Sequencing with deep-research split
  prompt: In which order do PROP-deep-research-bundle and this rename reach Development and release?
  context: Decides this proposal's depends_on, the size of its rename scope and how many migrations a consumer makes. Both edit the incubation bundle and CAP-DLV-idea-incubation. Split-first avoids renaming text the split then moves and avoids alias references in the split's proposal; a release cut between the two integrations makes consumers migrate selection and overrides twice. Planning of both can continue in parallel either way.
  options:
  - id: a
    description: 'Split first; this proposal''s handoff waits for its integration (depends_on: [PROP-deep-research-bundle]); both ship in the same minor release; this proposal renames any current name the split leaves with incubation.'
    recommended: true
  - id: b
    description: Split first with depends_on, but no same-release constraint; consumers may migrate twice.
    recommended: false
  - id: c
    description: Rename first; the split re-plans against adaptive-dev names and the research entry and roles take names PROP-deep-research-bundle chooses.
    recommended: false
  - id: d
    description: Combine both into one Development unit; larger review scope, one migration.
    recommended: false
  allow_note: true
