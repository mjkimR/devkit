summary: Retained MAT documents need only an id; a backticked MAT ID in a proposal is a reference edge that handoff leaves unchanged. Two selected bundles shipping one skill or subagent id fail with BUNDLE_CONFLICT; a preset that drops an asset removes unmodified files (ORPHAN_LEFT for edited ones) with no moved-asset notice; adding a catalog bundle breaks the exact bundle set in tests/e2e/smoke.sh.
