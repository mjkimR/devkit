  resolution: open
- issue: A proposal or PADR cites a MAT ID in a prose code span (reference edge resolved by RULE-document-reference); bare text is not an edge; MAT is no relation field. Handoff moves only the proposal's own materials/ and rewrites only IDs it wrote, so a cited MAT ID survives unchanged into spec.md and ADRs.
