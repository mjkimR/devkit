questions:
- id: d1-non-minor-fixes
  title: Closing non-minor P2/P3 fixes
  prompt: Does a P2 or P3 fix that fails the minor-fix conditions start another review round?
  context: Without it a P2 fix that changes an error code or CLI output ships at high with no reviewer (challenger-01 P1).
  options:
  - id: joins-next-round
    description: every fix outside the minor-fix conditions joins the next round, whatever its severity
    recommended: true
  - id: p1-only
    description: only open P1s start rounds; the implementer closes P2/P3 fixes
    recommended: false
  allow_note: true
- id: d2-contested-p1
  title: Contested P1
  prompt: What happens to a P1 the implementer holds invalid?
  context: A fresh reviewer can misread an acceptance criterion; the implementer may not relabel or waive a P1.
  options:
  - id: one-more-round
    description: one more fresh round with the implementer's counter-evidence (tests or output); ask the user only if it asserts the P1 again
    recommended: true
  - id: straight-to-user
    description: every contested P1 goes to the user at once
    recommended: false
  allow_note: true
- id: d3-adr-relation
  title: Relation to the medium ADR
  prompt: How does the new ADR relate to ADR-medium-review-delegation?
  context: That ADR's high clause would contradict the new rules; accepted ADRs are never edited.
  options:
  - id: supersede
    description: the new ADR supersedes it, restating its medium rules unchanged and adding the high rules
    recommended: true
  - id: supplement
    description: a supplement that quotes each overridden clause and states the new rule governs high
    recommended: false
  allow_note: true
- id: d4-round-cap
