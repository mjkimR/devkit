answers:
- question: d1-non-minor-fixes
  choice: null
  decision: Each round takes the whole batch of fixes since the previous round; all findings of a round are fixed together, and the next round is skipped only when every fix of the batch is minor.
  constraints:
  - P2 and P3 findings may still be waived with a reason.
- question: d2-contested-p1
  choice: one-more-round
  decision: A contested P1 gets one more fresh round with the implementer's counter-evidence and goes to the user only if asserted again.
- question: d3-adr-relation
  choice: supersede
  decision: The new ADR supersedes ADR-medium-review-delegation, restating its medium rules unchanged and adding the high rules.
- question: d4-round-cap
  choice: three
  decision: The cap is 3 rounds after the initial review.
- question: d5-severity-scope
  choice: every-effort
  decision: A P1/P2/P3 severity is required on every finding at every effort.
