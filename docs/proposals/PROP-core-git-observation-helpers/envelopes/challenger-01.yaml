findings:
- issue: Removing devkit_agt.features.compact.status_records contradicts CAP-CMP-bounded-execution, which documents it, while the proposal excludes docs/capabilities/ and claims no capability change.
  evidence: docs/capabilities/compact/CAP-CMP-bounded-execution.md:113
  failure_condition: Development removes the export; the capability describes a missing API or an excluded file is touched.
  suggested_action: Own that capability file and drop the sentence, or keep the export.
  resolution: open
  severity: P1
- issue: '''Existing tests stay green unchanged'' is false: the viewer test patches planning.run_git and asserts the subcommands; the adaptive unit test imports parse_status/parse_worktrees.'
  evidence: packages/devkit-viewer/tests/integration/features/browse/test_planning.py:115-127; packages/devkit-adaptive/tests/unit/features/assignment/test_values.py:7,19-24
  failure_condition: The viewer migrates through worktree_records(root) and the adaptive private parsers are removed.
  suggested_action: Viewer parses its own run_git output; keep adaptive parse_* as thin wrappers or name the test edit.
  resolution: open
  severity: P2
- issue: 'Status-output differences beyond the three listed: line[3:] readers report ''orig -> new'' for a staged rename today; native_handoff reads the rename field only for an index-column R/C.'
  evidence: native_handoff.py:84,158-161; proposals/usecases/report.py:110-113
  failure_condition: A staged rename or intent-to-add rename is present when handoff, prepare or report runs.
  suggested_action: List them as accepted differences with acceptance criteria.
  resolution: open
  severity: P2
- issue: Migrating adaptive revision to resolve_commit turns exit 128 from ADAPTIVE_REVISION_UNRESOLVED into GIT_FAILED.
  evidence: packages/devkit-adaptive/src/devkit_adaptive/features/assignment/repositories/git.py:49-53; docs/capabilities/delivery/CAP-DLV-adaptive-assignments.md:55,283
  failure_condition: rev-parse exits 128 in a corrupt listed worktree.
  suggested_action: 'AC: the adaptive caller maps None and GitError(returncode=128) to RevisionUnresolved.'
  resolution: open
  severity: P2
- issue: resolve_commit can return '^<oid>' for a revision with a leading '^' (rev-parse --verify exits 0).
  evidence: Git rev-parse.c show_rev REVERSED (source knowledge); adaptive --base/--final are user input (git.py:50)
  failure_condition: assignment new --base ^HEAD stores a non-ID base.
  suggested_action: Check stdout is a 40- or 64-hex ID; pin with a '^HEAD' test.
  resolution: open
  severity: P2
- issue: surrogateescape equals os.fsdecode only under a UTF-8 filesystem encoding; inventory mislabels the generated engine's decoding.
  evidence: lifecycle.py:180, gates/commands.py:58, snapshot.py:35, inspect.py:107; generated/usecases/engine.py:136
  failure_condition: Linux with a non-UTF-8 locale and a non-ASCII path.
  suggested_action: State the UTF-8 assumption; correct the inventory row.
  resolution: open
  severity: P3
- issue: 'Decision needed: Q2, migrate every caller in this spec or only the pinned callers.'
  evidence: proposal.md Caller migration and Planning decisions
  failure_condition: The user expected the narrower scope; the one-spec plan widens review across devkit-dist, devkit-mcp and devkit-viewer.
