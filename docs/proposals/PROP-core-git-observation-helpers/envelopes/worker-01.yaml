questions:
- id: q1
  title: Migrate every caller in this spec?
  prompt: Should the spec that adds the helpers also move every existing parser to them, or only the callers whose tests pin the behavior?
  context: Decides the spec's scope and size. One spec moves about twenty call sites in six packages (devkit-agt, devkit-dist, devkit-spec, devkit-adaptive, devkit-mcp, devkit-viewer), each verified by its feature's tests, and removes the compact status_records export; size stays L. Moving only the pinned callers (devkit_agt worktree lifecycle, devkit_spec scope inventory, devkit_adaptive) keeps the review smaller but leaves the other copies in place, and a later move would be an overall-refactor, which has no proposal route.
  options:
  - id: a
    description: Move every parser in this spec, keeping each caller's own mapping and error handling (current design).
    recommended: true
  - id: b
    description: Add the helpers and move only the callers whose tests pin the behavior; the other copies stay until a later change touches them.
    recommended: false
  allow_note: true
- id: q2
  title: Keep a public commit resolver?
  prompt: Should devkit-core gain resolve_commit (full commit ID or None, with --end-of-options and a hex check), migrating only the adaptive revision lookup, or should the adaptive site be fixed locally with no new helper?
  context: Decides whether the public API grows by one function now. Only one of the 26 full-commit rev-parse lines would move (the adaptive one, which lacks --end-of-options and can store '^<id>'); the other 25 are single calls and stay. A helper gives new packages one safe convention; the local fix gives the same safety for the one site with no new API.
  options:
  - id: a
    description: Add resolve_commit with the hex check and migrate the adaptive lookup, which keeps mapping failures to ADAPTIVE_REVISION_UNRESOLVED (current design).
    recommended: true
  - id: b
    description: Add no resolver; fix the adaptive lookup locally with --end-of-options and a hex check.
    recommended: false
  allow_note: true
