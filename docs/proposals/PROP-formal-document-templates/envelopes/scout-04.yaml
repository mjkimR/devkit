summary: Copy-once document systems never migrate old documents or mark template versions; enforcement checks frontmatter repo-wide and body sections only on changed files, warn-only; guidance left in bodies leaks into documents.
findings:
- issue: PEP, Rust RFC, KEP and MADR leave existing documents unchanged after template changes.
  evidence: https://peps.python.org/pep-0001/ PEP Maintenance; https://github.com/rust-lang/rfcs/blob/master/README.md; MADR CHANGELOG
  suggested_action: Q3 is a local cost choice; external practice grandfathers.
  resolution: open
- issue: Template version markers exist only in regenerating scaffold tools (Copier, cruft).
  evidence: https://copier.readthedocs.io/en/stable/configuring/ migrations; https://cruft.github.io/cruft/
  suggested_action: Add no template version field.
  resolution: open
- issue: Body guidance gets copied into documents; QEMU and psf/black moved suggestions into HTML comments.
  evidence: https://lists.gnu.org/archive/html/qemu-devel/2022-12/msg00153.html; https://github.com/psf/black/pull/2269
  suggested_action: HTML-comment hints; comments still stay in raw text.
  resolution: open
- issue: Body sections are suggestions; PEP 12 'Suggested Sections', KEP heading check warn-only on changed files.
  evidence: https://peps.python.org/pep-0012/; https://github.com/kubernetes/enhancements/blob/master/hack/verify-toc-vs-template.sh
  suggested_action: Keep the no-section-rule non-goal; a leftover-guidance warning is the cheapest later check.
  resolution: open
assumptions:
- 'Route: role-worker emulating scout for WebSearch; read-only; no writes observed'
