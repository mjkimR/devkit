summary: Design-explanation templates (KEP, Rust RFC, Go, PEP 12, Google, arc42, MADR, Good Docs, Diataxis) state the problem once after the summary, scope by non-goals plus owner pointers, and keep guidance in comments or a guide file.
findings:
- issue: No template opens with a question section beside the summary; MADR folds an optional question into the problem statement and removed a separate opening field.
  evidence: https://github.com/adr/madr template/adr-template.md and CHANGELOG 3.0.0-beta; https://github.com/rust-lang/rfcs/blob/master/0000-template.md; KEP template Summary vs Motivation
  suggested_action: Replace the question section with a problem statement; allow at most one question sentence inside it.
  resolution: open
- issue: Diataxis uses the 'why' question as a scoping prompt while writing, not a section.
  evidence: https://diataxis.fr/explanation/
  suggested_action: Move scoping into the writing instructions.
  resolution: open
- issue: Scope is stated by exclusions and pointers to the owning document.
  evidence: KEP Non-Goals; https://www.industrialempathy.com/posts/design-docs-at-google/ Goals and non-goals; arc42 09_architecture_decisions help
  suggested_action: Add an authority-boundary section naming what the document does not settle and the owner ID that does.
  resolution: open
- issue: Guidance is carried as HTML comments (KEP, MADR), placeholders (PEP, Go), help-free builds (arc42) or a separate guide (Good Docs).
  evidence: KEP template opening comment; https://arc42.org/download; https://gitlab.com/tgdp/templates template_deliverables.md
  suggested_action: Short HTML-comment hints in templates; reasoning in the writing instructions.
  resolution: open
- issue: Old documents are checked only when changed, and only for missing headings; templates are renamed without pointers.
  evidence: https://github.com/kubernetes/enhancements/blob/master/hack/verify-toc-vs-template.sh; MADR CHANGELOG 3.0.0-beta
  suggested_action: Keep the no-section-rule non-goal; remove design-template.md if unreleased.
  resolution: open
