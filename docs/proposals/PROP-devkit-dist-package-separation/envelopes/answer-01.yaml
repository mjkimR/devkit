answers:
- question: harness-guidance
  choice: harness-bundle
  decision: The harness guidance in the devkit bundle (constitution intro and contracts 5-6, and the harness parts of consumption, resource-kinds and in-repo-bundle) moves to a new auto-selected bundle shipped by devkit-agt (proposed name `harness`); the devkit bundle shipped by devkit-dist keeps only distribution guidance.
- question: compact-home
  choice: agt
  decision: devkit.compact (`devkit run`) ships in devkit-agt, not devkit-dist, so the standalone scope of PADR-dist-foundation-ownership is not widened.
  constraints:
  - 'With harness-bundle, the devkit-run instruction and the `run` preset with its AGENTS.md pointer move to the harness bundle; configurations selecting `devkit:run` must change their selection (breaking change accepted in place under AGENTS.md Compatibility: no shims, no migration readers).'
  - Account for this repository's own and first-party packages' selections, if any, as a Development reconcile/implementation item.
- question: standalone-harness-signals
  choice: both
  decision: A dist-only installation emits a coded sync/status notice for deployed rule, gate or workflow assets no installed engine runs, and a coded error with a deterministic directive for harness command names; detection is by name only via `devkit.commands` entry points and a name-only harness command list, never importing or locating a harness module.
