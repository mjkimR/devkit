summary: 'PADR structure holds (import closure, N1 namespace, M1 mount, C2 config ownership check out); gaps: harness directives in devkit-dist code and bundle text are under-inventoried, extra fix directives undecided, no mechanism for dist-only tests, user questions omit asymmetric costs.'
findings:
- issue: 'Harness directives live in devkit-dist code: workflow_skill.py generates the devkit-workflow entry skill (every step runs devkit workflow) whenever a selected bundle ships a workflow asset; rule and gate assets are synced standalone and never evaluated, without a notice.'
  evidence: packages/devkit/src/devkit/distribution/installation/workflow_skill.py:12-85; inventory.py:27,33,383-389
  failure_condition: 'Only devkit-dist installed and a selected bundle ships a workflow, rule or gate asset: sync deploys a skill whose commands are unknown and rules that never run.'
  suggested_action: 'Decide: entry point inversion, a sync notice when the engine is missing, or a documented limitation.'
  resolution: open
  severity: medium
- issue: The harness-guidance question lists only contracts 5-6 and two consumption sections; harness commands also appear in the constitution intro, consumption description/config table, resource-kinds.md and in-repo-bundle.md (which tells consumers to install devkit-agt). The PADR claim that file hashes and paths are unchanged becomes false once text moves.
  evidence: distribution/guide/bundle/AGENTS.md:3-5,27-34; instructions/consumption.md:3,12,85-109; resource-kinds.md:17-19,42-46,101; in-repo-bundle.md:85-88,122-143; PADR-dist-config-receipt-ownership.md:86-87
  failure_condition: User answers with only the listed sections in view; standalone still deploys harness directives.
  suggested_action: Put the full inventory in the question; make the hash statement conditional.
  resolution: open
  severity: medium
- issue: Missing-extra fix directives (search, mcp) live in devkit-dist modules and no fixed text is right for both installations.
  evidence: packages/devkit/src/devkit/search/errors.py:20-35; host/errors.py:57; host/cli.py:150; distribution/cli/__init__.py:156
  failure_condition: Standalone directive installs devkit-agt[search] (pulls the harness); a devkit-dist[search] git requirement next to devkit-agt can conflict with devkit-agt's resolved source.
  suggested_action: Pick a deterministic directive and record it in PADR-dist-module-split.
  resolution: open
  severity: medium
- issue: 'The requirement that devkit-dist tests run without devkit-agt has no mechanism: one workspace venv installs devkit-agt[search,mcp] and devkit-spec, so agt entry points stay visible to dist tests.'
  evidence: pyproject.toml:42-68; justfile:25-26; PADR-dist-module-split.md:104-108
  failure_condition: A dist test or module depends on a devkit-agt entry point; just test and CI stay green while the standalone wheel ships broken.
  suggested_action: Name a dist-only job (isolated uv run or smoke install) running devkit-dist tests and asserting find_spec('devkit.rules') is None.
  resolution: open
  severity: medium
- issue: 'compact-home question hides asymmetric costs: keeping compact in devkit-agt forces devkit-run and the run preset out of the auto-selected devkit bundle, so configurations selecting devkit:run fail with SelectionError and a fifth built-in bundle is needed.'
  evidence: distribution/guide/bundle/bundle.toml:27-45; distribution/bundles/manifest.py:104-107; compact/cli.py:29
  failure_condition: User picks agt without seeing the preset breakage.
  suggested_action: Show both costs in the question; devkit-dist is cheaper.
  resolution: open
  severity: medium
- issue: After M1 devkit-agt ships no console script, but ARCH-05-3 and CAP-DIST-content-packages describe uv tool install <wheel>.
  evidence: docs/architecture/ARCH-05-3-command-plugins.md:32; docs/capabilities/distribution/CAP-DIST-content-packages.md:62-64
  failure_condition: uv tool install devkit-agt finds no executables.
  suggested_action: Document uv tool install devkit-dist --with devkit-agt.
  resolution: open
