answers:
- question: bounding
  choice: a
  decision: The user selects surfaces (code, guidance, CLI) and roots at intake; the run splits into one batch per surface with one decision round per batch, and a cross-surface finding cites both sides and belongs to the batch of the surface where its change lands.
  constraints:
  - Within each surface batch the playbook uses spawned subagents when useful (for example parallel per-root or per-module review, or independent verification of a consolidation or removal); the playbook's agent keeps coordination, the decision round and integration.
  - Subagent results are evidence-backed opinions that the playbook's agent validates against the code or diff before relying on them.
  - A subagent's write scope stays inside its batch.
- question: contract-removals
  choice: a
  decision: The decision round may approve a contract removal; it becomes its own work item through the repository's development workflow with the contract and documentation updated, kept apart from the behavior-preserving batch.
- question: preservation-evidence
  choice: a
  decision: Each consolidation or removal records reachability evidence over static references and the repository's dynamic reach (entry points, plugin registries, configuration, documentation, string dispatch) and relevant verification passing before and after; a characterization test is added only when no existing test exercises every merged caller; for guidance, a retained-constraint map plus a recorded representative-task run when the removal relies on a behavioral check.
- question: helper-placement
  choice: a
  decision: A consolidated helper lives at the lowest common owner every caller may already depend on under the target repository's declared layering; a new cross-package or foundation module, or a repository without declared layering, becomes a decision in the round; in devkit the order is feature-local, then package-level utils or base, then devkit_core only for generic primitives.
- question: presets
  choice: a
  decision: review-refactor is added to the upkeep preset and to a new solo preset refactoring, besides the implicit all preset.
