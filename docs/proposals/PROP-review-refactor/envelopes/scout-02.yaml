summary: 'External scout (Q1): 24 cited candidate criteria (9 code, 10 guidance, 5 CLI) tagged by basis and detection class; tools only yield textual candidates; shortening guidance can remove behavior-changing constraints. Detail in materials/q1-review-criteria-research.md.'
findings:
- issue: Evidence on AI-assisted code quality is mixed; AI origin or line count is not a finding by itself, so each criterion needs a location and a named maintenance cost.
  evidence: arXiv 2511.04427 v3 (MSR'26) abstract; arXiv 2510.03029 v2 abstract; arXiv 2507.00788 v3 abstract; materials/q1-review-criteria-research.md §1.1
  suggested_action: Require location plus maintenance cost per finding; drop preference-only findings.
  resolution: open
- issue: Code criteria RC-C1..C9 (duplicated behavior, abstraction without reuse, speculative compatibility, unused code, defensive boilerplate, unused parameters/flags, complexity growth, cosmetic churn, behavior-preservation gate).
  evidence: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#overeagerness; https://refactoring.com/catalog/; https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction; materials/q1-review-criteria-research.md §2.1
  suggested_action: Use as the code criteria set.
  resolution: open
- issue: 'Guidance criteria RC-G1..G10: derivable overviews do not help, repository-specific tooling lines change behavior, conflicts are handled unreliably, size thresholds are preference.'
  evidence: arXiv 2602.11988 v3 §4.2-4.4, §6; arXiv 2502.15851 v4; https://code.claude.com/docs/en/best-practices#write-an-effective-claude-md; materials/q1-review-criteria-research.md §2.2
  suggested_action: Use as the guidance criteria set with a behavioral acceptance rule for removals.
  resolution: open
- issue: CLI criteria RC-L1..L5 rest on design guidelines (clig.dev, GNU 4.8.2, POSIX 12.2) and Click docstring-as-help; removals, renames and consolidations are contract changes.
  evidence: https://clig.dev/; https://www.gnu.org/prep/standards/html_node/_002d_002dhelp.html; https://click.palletsprojects.com/en/stable/documentation/; materials/q1-review-criteria-research.md §2.3
  suggested_action: Classify CLI removals as contract changes, never refactoring.
  resolution: open
- issue: 'Detection limits: clone tools are textual; dead-code tools miss dynamic dispatch (entry points, rule plugins); a ruff probe of unselected rules gave 810 hits, mostly required test signatures.'
  evidence: https://github.com/jendrikseipp/vulture README; https://github.com/kucherenko/jscpd README; pyproject.toml:15; materials/q1-review-criteria-research.md §3
  suggested_action: Treat tool output as candidates only; install nothing without asking.
  resolution: open
- issue: Shortening guidance can remove necessary constraints; acceptable reduction needs derivable, duplicated-with-canonical-copy, mechanically enforced or behaviorally unnecessary content.
  evidence: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents; arXiv 2602.11988 v3 §4.3; arXiv 2407.08892; materials/q1-review-criteria-research.md §4
  suggested_action: Adopt the four-ground reduction rule; never justify by line/token delta.
  resolution: open
- issue: The reviewing agent over-reports; acting on every finding adds abstraction and defensive code.
  evidence: https://code.claude.com/docs/en/best-practices#add-an-adversarial-review-step
  suggested_action: Drop findings without a named cost by default.
  resolution: open
