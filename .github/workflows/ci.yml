# Continuous integration for the devkit monorepo.
#
# Two jobs: the workspace checks every package (devkit, devkit-starter,
# devkit-catalog: lint, types, tests, governance rules) on Linux and macOS, and the consumer smoke
# builds the wheels, installs them into a fresh project the way a consumer would
# and commits through the installed gate hooks (it needs git, which the runner
# image provides). Both install the devkit-embed model wheel from the release
# pinned in packages/devkit/pyproject.toml; nothing builds it here.
#
# It does not run on push or pull request: the same checks run locally, and
# release.yml runs this workflow on the tagged commit before publishing. Run it
# by hand (gh workflow run ci) to check Linux before tagging.
name: ci

on:
  workflow_dispatch:
  workflow_call:  # release.yml runs the full CI before publishing

permissions:
  contents: read

jobs:
  workspace:
    # The full suite must remain usable even when the working-tree runner breaks.
    env:
      DEVKIT_RUN_MODE: raw
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - run: just init
      - run: just lint-check
      - run: just check
      - run: just test
      # Exercise the runner around its own tests independently of the direct full suite.
      - run: uv run --no-active devkit run -- uv run --no-active pytest packages/devkit/tests/compact
      - run: just rules-check

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - run: just smoke
