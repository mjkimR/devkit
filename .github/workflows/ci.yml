# Continuous integration for the devkit monorepo.
#
# Two jobs: the workspace checks every package (devkit, devkit-starter: lint,
# types, tests, governance rules) on Linux and macOS, and the consumer smoke
# builds the wheels, installs them into a fresh project the way a consumer would
# and commits through the installed gate hooks (it needs git, which the runner
# image provides). There is no release or publish job yet: no package index
# exists for these wheels, so consumers install from Git or from a built wheel
# (see scripts/smoke.sh). Both jobs restore the embedding model files of
# devkit-embed from the cache keyed by its model.json, else fetch them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml runs the full CI before publishing

permissions:
  contents: read

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - uses: actions/cache@v4
        with:
          path: |
            packages/devkit-embed/src/devkit_embed/model.safetensors
            packages/devkit-embed/src/devkit_embed/tokenizer.json
          key: model-${{ hashFiles('packages/devkit-embed/src/devkit_embed/model.json') }}
      - run: just init
      - run: just model-fetch
      - run: just lint-check
      - run: just check
      - run: just test
      - run: just rules-check

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - uses: actions/cache@v4
        with:
          path: |
            packages/devkit-embed/src/devkit_embed/model.safetensors
            packages/devkit-embed/src/devkit_embed/tokenizer.json
          key: model-${{ hashFiles('packages/devkit-embed/src/devkit_embed/model.json') }}
      - run: just smoke
