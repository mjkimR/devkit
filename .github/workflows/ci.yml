# Continuous integration for the devkit monorepo.
#
# Three jobs: the workspace checks every package (devkit-dist, devkit, devkit-starter,
# devkit-catalog, ...: lint, types, tests, governance rules) on Linux and macOS, and runs the
# devkit-dist tests again in an environment without devkit-agt (the dist-only check); the consumer smoke
# builds the wheels, installs them into fresh projects the way a consumer would (devkit-dist alone, then with
# devkit-agt) and commits through the installed gate hooks (it needs git, which the runner
# image provides), and the viewer job checks the devkit-viewer frontend and that its
# committed build matches the sources (it needs Node). Both install the devkit-embed model wheel from the release
# pinned in packages/devkit-dist/pyproject.toml; nothing builds it here.
#
# It does not run on push or pull request. Local integration uses affected tests;
# nightly.yml calls the full CI for unverified default-branch heads, and release.yml
# always runs it on the tagged commit before publishing. Manual dispatch also runs it in full.
name: ci

on:
  workflow_dispatch:
  workflow_call:  # release.yml runs the full CI before publishing

permissions:
  contents: read

jobs:
  workspace:
    # The full suite must remain usable even when the working-tree runner breaks.
    env:
      DEVKIT_RUN_MODE: raw
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - run: just init
      - run: just lint-check
      - run: just check
      - run: just test
      # devkit-dist must work without devkit-agt: its tests in an environment synced with devkit-dist alone.
      - run: just test-dist
      # Exercise the runner around its own tests independently of the direct full suite.
      - run: uv run --no-active devkit run -- uv run --no-active pytest packages/devkit/tests/unit/features/compact packages/devkit/tests/integration/features/compact
      - run: just rules-check

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - run: just smoke

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/devkit-viewer/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - run: just init viewer
      - run: just viewer install
      - run: just viewer lint
      - run: just viewer check
      - run: just viewer test
      - run: just viewer pack
      # Rebuilds the page from the lockfile in a clean checkout and fails when the committed build differs.
      - run: uv run --no-active devkit generated check viewer-assets
