# Release on a pushed vX.Y.Z tag.
#
# The full CI (ci.yml) runs first against the tagged commit. The release job
# then checks that the commit is on main, fetches the embedding model files,
# builds every workspace package's wheel with scripts/release.sh (which also
# checks the tag against the devkit version) and publishes a GitHub Release with
# the wheels, SHA256SUMS and install commands for the tag. Consumers install the
# wheels by URL; there is no package index.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv python install 3.12
      - uses: actions/cache@v4
        with:
          path: |
            packages/devkit-embed/src/devkit_embed/model.safetensors
            packages/devkit-embed/src/devkit_embed/tokenizer.json
          key: model-${{ hashFiles('packages/devkit-embed/src/devkit_embed/model.json') }}
      - run: just model-fetch
      - run: just release-build "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md --generate-notes
