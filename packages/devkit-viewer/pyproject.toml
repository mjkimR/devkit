[project]
name = "devkit-viewer"
version = "0.1.3"
description = "Local read-only viewer of devkit repositories: the Living Spec, proposals, specs and the roadmap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devkit-core==0.1.3",
    "click>=8.1.7",
    "devkit-agt==0.1.3",
]

# The command group mounted under devkit: `devkit viewer ...`.
[project.entry-points."devkit.commands"]
viewer = "devkit_viewer.features.browse.cli.app:cli"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
devkit-core = { workspace = true }
devkit-agt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The committed app build under src/devkit_viewer/static/ ships inside the package.
[tool.hatch.build.targets.wheel]
packages = ["src/devkit_viewer"]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist", "frontend"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
extraPaths = ["tests/support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"

[tool.coverage.run]
branch = true
source = ["src/devkit_viewer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
