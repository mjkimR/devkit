[project]
name = "agent-rule-engine"
version = "0.1.0"
description = "Agent-managed rule engine for specifications and governance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
]

[project.scripts]
agent-rules = "agent_rule_engine.cli:cli"
agent-rule-engine = "agent_rule_engine.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rule_engine"]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "src"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
