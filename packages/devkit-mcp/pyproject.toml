[project]
name = "devkit-mcp"
version = "0.1.1"
description = "Optional MCP transport and native confirmation runtime for devkit services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devkit-core==0.1.1","devkit-dist==0.1.1", "mcp>=1.30,<2", "jsonschema>=4.23,<5"]

[project.entry-points."devkit.commands"]
mcp = "devkit_mcp.features.runtime.cli.app:cli"

[project.entry-points."devkit.mcp.registrations"]
devkit = "devkit_mcp.features.runtime.usecases.configuration:descriptor"

[tool.uv.sources]
devkit-core = { workspace = true }
devkit-dist = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
