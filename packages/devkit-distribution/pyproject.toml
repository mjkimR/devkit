[project]
name = "devkit-distribution"
version = "0.1.0"
description = "Bundle distribution tooling for devkit agent assets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "tomlkit>=0.13",
]

[project.scripts]
devkit = "devkit_distribution.cli:cli"

[project.entry-points."devkit_distribution.bundles"]
devkit = "devkit_distribution.guide"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_distribution"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
