[project]
name = "agent-advisory"
version = "0.1.0"
description = "Agent Advisory Protocol: structured, agent-directed errors with a bundled authoring guide"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."devkit_distribution.bundles"]
agent-advisory = "agent_advisory"

[dependency-groups]
dev = [
    "devkit-distribution",
    "pytest>=8.0.0",
]

[tool.uv.sources]
devkit-distribution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_advisory"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
