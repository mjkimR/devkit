schema = 1
name = "maintenance"
version = "0.1.6"
default_preset = "all"

[[assets]]
id = "drift-reconciliation"
kind = "playbook"
source = "playbooks/drift-reconciliation.md"

[[assets]]
id = "weekly-report"
kind = "playbook"
source = "playbooks/weekly-report.md"

[[assets]]
id = "review-refactor"
kind = "playbook"
source = "playbooks/review-refactor"

[[assets]]
id = "performance-pass"
kind = "playbook"
source = "playbooks/performance-pass"

[[assets]]
id = "test-management"
kind = "playbook"
source = "playbooks/test-management"

[presets.upkeep]
assets = ["drift-reconciliation", "review-refactor"]

[presets.reporting]
assets = ["weekly-report"]

[presets.refactoring]
assets = ["review-refactor"]

[presets.performance]
assets = ["performance-pass", "review-refactor"]

[presets.testing]
assets = ["test-management"]
