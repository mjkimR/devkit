[project]
name = "devkit-catalog"
version = "0.1.2"
description = "Opt-in devkit bundles: installed but never deployed until a project selects them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# One entry point per bundle; the name is the bundle name. No catalog bundle declares auto_select.
[project.entry-points."devkit.bundles"]
response-style = "devkit_catalog.response_style"
host-observer = "devkit_catalog.host_observer"
maintenance = "devkit_catalog.maintenance"
cli-tool = "devkit_catalog.cli_tool"

[dependency-groups]
dev = ["devkit-dist", "devkit-agt"]  # bundle tests use devkit-dist's manifest reader; rule tests the rules engine

[tool.uv.sources]
devkit-dist = { workspace = true }
devkit-agt = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_catalog"]
