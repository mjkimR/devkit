[project]
name = "agent-commit-gate"
version = "0.1.0"
description = "Pluggable Git commit gates: managed hook wrappers, layered configuration and bundle-distributed gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-advisory",
    "agent-rule-engine",
    "click>=8.1.7",
]

[project.scripts]
commit-gate = "agent_commit_gate.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
agent-advisory = { workspace = true }
agent-rule-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_commit_gate"]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "src"
testpaths = "tests"
