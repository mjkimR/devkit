[project]
name = "devkit-starter"
version = "0.1.0"
description = "Example devkit content package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."devkit.bundles"]
starter = "devkit_starter"

[dependency-groups]
dev = ["devkit"]  # the tests load the bundle with devkit's manifest reader

[tool.uv.sources]
devkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_starter"]
