[project]
name = "devkit-starter"
version = "0.1.0"
description = "Example devkit content package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."devkit_distribution.bundles"]
starter = "devkit_starter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_starter"]
