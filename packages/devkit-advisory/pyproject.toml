[project]
name = "devkit-advisory"
version = "0.1.0"
description = "The Agent Advisory Protocol library (devkit.advisory): agent-directed errors, warnings and notices"
readme = "README.md"
requires-python = ">=3.12"
# The runtime contract other repositories build on: standard library only, no entry points.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `devkit` is a namespace package shared with the devkit distribution: this wheel ships only devkit/advisory/.
packages = ["src/devkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
