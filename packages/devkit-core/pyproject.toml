[project]
name = "devkit-core"
version = "0.1.2"
description = "Shared filesystem, Git, parsing and plugin foundations for devkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["devkit-advisory==0.1.2", "pyyaml>=6.0.1"]

[tool.uv.sources]
devkit-advisory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
