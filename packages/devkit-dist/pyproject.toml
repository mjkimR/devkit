[project]
name = "devkit-dist"
version = "0.1.1"
description = "Agent asset distribution: bundles, agent projections, sync, context loading, playbooks and native hooks in the devkit CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "devkit-advisory==0.1.1",  # released in lockstep with devkit-dist and devkit-agt, from the same tag
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
# Dense and hybrid devkit.search: numpy, tokenizers and the default embedding model.
search = [
    "numpy>=2.0",
    "tokenizers>=0.20",
    "devkit-embed>=0.1,<0.2",
]

# The sole devkit executable; devkit-agt and other packages mount their commands through devkit.commands.
[project.scripts]
devkit = "devkit.cli:cli"

[project.entry-points."devkit.bundles"]
devkit = "devkit.distribution.guide"
advisory = "devkit.advisory_guide"
git-commits = "devkit.commits_guide"

[project.entry-points."devkit.host.handlers"]
observe = "devkit.host.observation:observe"

# The dist-only check (`just test-dist`) syncs devkit-dist with this group alone, without the workspace's.
[dependency-groups]
dist-test = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
]

[tool.uv.sources]
devkit-advisory = { workspace = true }
# The model wheel is committed in models/devkit-embed/wheels/ so that installation and uv run do not require network access.
devkit-embed = { path = "../../models/devkit-embed/wheels/devkit_embed-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `devkit` is a namespace package shared with devkit-advisory and devkit-agt: no devkit/__init__.py, and every
# installed path belongs to one wheel (each area carries its own py.typed).
packages = ["src/devkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"
