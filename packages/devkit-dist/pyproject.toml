[project]
name = "devkit-dist"
version = "0.1.5"
description = "Agent asset distribution: bundles, agent projections, sync, context loading, playbooks and native hooks in the devkit CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devkit-core==0.1.5",
    "devkit-cli==0.1.5",  # the agent-first command-line boundary, released in lockstep
    "click>=8.2",
    "devkit-advisory==0.1.5",  # released in lockstep with the other devkit wheels, from the same tag
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
# Dense and hybrid devkit_dist.features.search: numpy, tokenizers and the default embedding model.
search = [
    "numpy>=2.0",
    "tokenizers>=0.20",
    "devkit-embed>=0.1,<0.2",
]

# The sole devkit executable; devkit-agt and other packages mount their commands through devkit.commands.
[project.scripts]
devkit = "devkit_dist.cli:cli"

[project.entry-points."devkit.bundles"]
devkit = "devkit_dist.bundles.devkit"
advisory = "devkit_dist.bundles.advisory"
git-commits = "devkit_dist.bundles.git_commits"

[project.entry-points."devkit.host.services"]
shared = "devkit_dist.features.shared.mcp:tools"

[project.entry-points."devkit.host.handlers"]
observe = "devkit_dist.features.host.services.observation:observe"

# The dist-only check (`just test-dist`) syncs devkit-dist with this group alone, without the workspace's.
[dependency-groups]
dist-test = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
]

[tool.uv.sources]
devkit-core = { workspace = true }
devkit-cli = { workspace = true }
devkit-advisory = { workspace = true }
# The model wheel is committed in models/devkit-embed/wheels/ so that installation and uv run do not require network access.
devkit-embed = { path = "../../models/devkit-embed/wheels/devkit_embed-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# devkit_dist is independently owned; only devkit-advisory retains the devkit namespace.
packages = ["src/devkit_dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"
