[project]
name = "devkit-embed"
version = "0.1.0"
description = "The potion-base-8M static embedding model (float16) for devkit dense search"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["src/devkit_embed/LICENSE", "src/devkit_embed/NOTICE"]
dependencies = []

[project.entry-points."devkit.embedding_models"]
potion-base-8m = "devkit_embed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_embed"]
# The weights and tokenizer are fetched (`just model-fetch`), not committed; the hook refuses a wheel without them.
artifacts = [
    "src/devkit_embed/model.safetensors",
    "src/devkit_embed/tokenizer.json",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
