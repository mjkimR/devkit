[project]
name = "devkit-cli"
version = "0.1.4"
description = "Agent-first command-line boundary for click tools: advisories, JSON results, exit codes and output options"
readme = "README.md"
requires-python = ">=3.12"
# The runtime contract other repositories' command-line tools build on: click and devkit.advisory only.
dependencies = ["click>=8.2", "devkit-advisory==0.1.4"]

[tool.uv.sources]
devkit-advisory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
