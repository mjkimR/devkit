[project]
name = "agent-workflow-engine"
version = "0.1.0"
description = "Data-driven delivery workflow engine: stage evaluation, approval gates and drift detection for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-advisory",
    "agent-rule-engine",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
]

[project.scripts]
agent-workflow = "agent_workflow_engine.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
agent-advisory = { workspace = true }
agent-rule-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workflow_engine"]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "src"
testpaths = "tests"
