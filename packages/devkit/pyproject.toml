[project]
name = "devkit-agt"
version = "0.1.6"
description = "Developer harness for devkit: repository rules, delivery workflows, commit gates, task worktrees and bounded command output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devkit-core==0.1.6",
    "click>=8.1.7",
    "devkit-advisory==0.1.6",  # exact actual version selected by the release inventory
    "devkit-dist==0.1.6",  # the devkit executable and distribution, pinned to its selected version
    "pyyaml>=6.0.1",
    "tomlkit>=0.13",
]

# The extras of devkit-dist under the names devkit-agt always had: a project that depends on devkit-agt adds the
# extra here, never a second requirement on devkit-dist.
[project.optional-dependencies]
mcp = ["devkit-mcp==0.1.6"]
search = ["devkit-dist[search]"]

# devkit-agt ships no console script: devkit-dist owns `devkit`, and these commands mount under it.
[project.entry-points."devkit.commands"]
exec = "devkit_agt.features.isolated_execution.cli:cli"
gate = "devkit_agt.features.gate.cli:cli"
generated = "devkit_agt.features.generated.cli:cli"
integration = "devkit_agt.features.integration.cli:cli"
maintenance = "devkit_agt.features.maintenance_history.cli:cli"
rules = "devkit_agt.features.rules.cli:cli"
run = "devkit_agt.features.compact.cli:run_cmd"
workflow = "devkit_agt.features.workflow.cli:cli"
worktree = "devkit_agt.features.worktree.cli:cli"

[project.entry-points."devkit.bundles"]
authoring = "devkit_agt.bundles.authoring"
harness = "devkit_agt.bundles.harness"

# Commented templates of the reserved harness tables in .devkit/config.toml, rendered by `devkit config template`.
[project.entry-points."devkit.config_tables"]
gates = "devkit_agt.features.gate.usecases.hooks.local_config:config_tables"
maintenance = "devkit_agt.features.maintenance_history.repositories.config:config_tables"
workflow = "devkit_agt.features.workflow.repositories.project.config:config_tables"
worktree = "devkit_agt.features.worktree.repositories.config:config_tables"

[project.entry-points."devkit.status_checks"]
gate-hooks = "devkit_agt.features.gate.usecases.status:status_check"

[project.entry-points."devkit.post_sync"]
gate-hooks = "devkit_agt.features.gate.usecases.hooks.local_config:post_sync"

[project.entry-points."devkit.post_sync_preview"]
gate-hooks = "devkit_agt.features.gate.usecases.hooks.local_config:post_sync_preview"

[project.entry-points."devkit.hygiene"]
worktree-stale = "devkit_agt.features.worktree.usecases.stale:hygiene"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
devkit-core = { workspace = true }
devkit-mcp = { workspace = true }
devkit-advisory = { workspace = true }
devkit-dist = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The regular devkit_agt package owns every harness module and its bundled resources.
packages = ["src/devkit_agt"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]  # rule tests live in each rule's folder (`<rule>/tests/`)
# devkit-agt's tests also use devkit-dist's test helpers (`distsupport`); devkit-dist's tests never use these.
pythonpath = ["tests/support", "../devkit-dist/tests/support"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"
