[project]
name = "devkit-agt"
version = "0.1.1"
description = "Agent asset distribution, repository rules, delivery workflows and commit gates in one CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "devkit-advisory==0.1.1",  # released in lockstep with devkit, from the same tag
    "pyyaml>=6.0.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
# Dense and hybrid devkit.search: numpy, tokenizers and the default embedding model.
search = [
    "numpy>=2.0",
    "tokenizers>=0.20",
    "devkit-embed>=0.1,<0.2",
]

[project.scripts]
devkit = "devkit.cli:cli"

[project.entry-points."devkit.bundles"]
devkit = "devkit.distribution.guide"
advisory = "devkit.advisory_guide"
authoring = "devkit.authoring_guide"
git-commits = "devkit.commits_guide"

[project.entry-points."devkit.post_sync"]
gate-hooks = "devkit.gate.hooks.local_config:post_sync"

[project.entry-points."devkit.hygiene"]
worktree-stale = "devkit.worktree.stale:hygiene"

# The integration guard of `devkit worktree finish --merge`: a branch whose units hold an unresolved problem or an
# unanswered question in their envelopes is not merged.
[project.entry-points."devkit.finish_guard"]
workflow-envelopes = "devkit.workflow.integration:finish_guard"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
devkit-advisory = { workspace = true }
# The model wheel is built by hand and attached to the release that first ships its version (models/devkit-embed),
# so every install of devkit-agt[search], from this workspace or from Git, gets the model files.
devkit-embed = { url = "https://github.com/mjkimR/devkit/releases/download/v0.1.0/devkit_embed-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `devkit` is a namespace package: devkit/advisory/ comes from the devkit-advisory wheel.
packages = ["src/devkit"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]  # rule tests live in each rule's folder (`<rule>/tests/`)
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"
