[project]
name = "devkit-agt"
version = "0.1.1"
description = "Developer harness for devkit: repository rules, delivery workflows, commit gates, task worktrees and bounded command output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devkit-core==0.1.1",
    "click>=8.1.7",
    "devkit-advisory==0.1.1",  # released in lockstep with devkit-dist and devkit-agt, from the same tag
    "devkit-dist==0.1.1",  # the devkit executable and the shared foundation, released in lockstep from the same tag
    "pyyaml>=6.0.1",
    "tomlkit>=0.13",
]

# The extras of devkit-dist under the names devkit-agt always had: a project that depends on devkit-agt adds the
# extra here, never a second requirement on devkit-dist.
[project.optional-dependencies]
mcp = ["devkit-mcp==0.1.1"]
search = ["devkit-dist[search]"]

# devkit-agt ships no console script: devkit-dist owns `devkit`, and these commands mount under it.
[project.entry-points."devkit.commands"]
gate = "devkit.gate.cli:cli"
generated = "devkit.generated.cli:cli"
integration = "devkit.integration.cli:cli"
rules = "devkit.rules.cli:cli"
run = "devkit.compact.cli:run_cmd"
workflow = "devkit.workflow.cli:cli"
worktree = "devkit.worktree.cli:cli"

[project.entry-points."devkit.bundles"]
authoring = "devkit.authoring_guide"
harness = "devkit.harness_guide"

# Commented templates of the reserved harness tables in .devkit/config.toml, rendered by `devkit config template`.
[project.entry-points."devkit.config_tables"]
workflow = "devkit.workflow.project.config:config_tables"
worktree = "devkit.worktree.config:config_tables"

[project.entry-points."devkit.post_sync"]
gate-hooks = "devkit.gate.hooks.local_config:post_sync"

[project.entry-points."devkit.hygiene"]
worktree-stale = "devkit.worktree.stale:hygiene"

# The integration guard of `devkit worktree finish --merge`: a branch whose units hold an unresolved problem or an
# unanswered question in their envelopes is not merged.
[project.entry-points."devkit.finish_guard"]
workflow-envelopes = "devkit.workflow.integration:finish_guard"

[project.entry-points."devkit.host.services"]
integration = "devkit.integration.mcp:create_tools"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
devkit-core = { workspace = true }
devkit-mcp = { workspace = true }
devkit-advisory = { workspace = true }
devkit-dist = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `devkit` is a namespace package: devkit/advisory/ comes from devkit-advisory, core, search, host, distribution,
# cli.py and __main__.py from devkit-dist; every installed path belongs to one wheel.
packages = ["src/devkit"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]  # rule tests live in each rule's folder (`<rule>/tests/`)
# devkit-agt's tests also use devkit-dist's test helpers (`distsupport`); devkit-dist's tests never use these.
pythonpath = ["tests", "../devkit-dist/tests"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"
