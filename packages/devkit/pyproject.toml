[project]
name = "devkit"
version = "0.1.0"
description = "Agent asset distribution, repository rules, delivery workflows and commit gates in one CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
# Dense and hybrid devkit.search: numpy, tokenizers and the default embedding model.
search = [
    "numpy>=2.0",
    "tokenizers>=0.20",
    "devkit-embed>=0.1,<0.2",
]

[project.scripts]
devkit = "devkit.cli:cli"

[project.entry-points."devkit.bundles"]
devkit = "devkit.distribution.guide"
advisory = "devkit.advisory"
authoring = "devkit.rules.authoring"
git-commits = "devkit.gate.commits"

[project.entry-points."devkit.post_sync"]
gate-config-template = "devkit.gate.hooks.local_config:post_sync"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
devkit-embed = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"
