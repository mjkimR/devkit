schema = 1
name = "devkit"
version = "0.1.0"
default_preset = "core"
# Deployed without `devkit add`; `devkit remove` opts a project out.
auto_select = true

# How a repository consumes devkit-managed assets: context loading, playbooks,
# rules, gates, overrides and the sync lifecycle.
[[assets]]
id = "consumption"
kind = "instruction"
source = "instructions/consumption.md"

# Which asset kind to author for a given need, from the consumer's point of view.
[[assets]]
id = "resource-kinds"
kind = "instruction"
source = "instructions/resource-kinds.md"

# Shipping repository-owned assets as a bundle installed from the same repository.
[[assets]]
id = "in-repo-bundle"
kind = "instruction"
source = "instructions/in-repo-bundle.md"

# Running tests, linters and type checks through `devkit run`, and wrapping recipes with it.
[[assets]]
id = "devkit-run"
kind = "instruction"
source = "instructions/devkit-run.md"

[presets.core]
assets = ["consumption", "resource-kinds", "in-repo-bundle", "devkit-run"]
