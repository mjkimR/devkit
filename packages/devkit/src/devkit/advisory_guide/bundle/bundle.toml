schema = 1
name = "advisory"
version = "0.1.1"
default_preset = "core"
# Deployed without `devkit add`; `devkit remove` opts a project out.
auto_select = true

[[assets]]
id = "agent-advisory"
kind = "instruction"
source = "instructions/agent-advisory.md"

[[assets]]
id = "agent-advisory-python"
kind = "instruction"
source = "instructions/agent-advisory-python.md"

# Linter error when two unrelated AdvisoryError classes declare the same code.
[[assets]]
id = "unique-code"
kind = "rule"
source = "rules/unique_code"

# Language-agnostic protocol and authoring rules (errors, warnings, notices) for any repository.
[presets.core]
assets = ["agent-advisory"]

# Adds the devkit.advisory Python library guide and the code uniqueness rule.
[presets.python]
assets = ["agent-advisory", "agent-advisory-python", "unique-code"]
