source = "seed/docs"
target = "docs"


[[assets]]
id = "code-entrypoints"
kind = "rule"
source = "rules/code_entrypoints"


[[assets]]
id = "document-summary"
kind = "rule"
source = "rules/document_summary"


[[assets]]
id = "steering-documents"
kind = "rule"
source = "rules/steering_documents"


[[assets]]
id = "ux-links"
kind = "rule"
source = "rules/ux_links"


[[assets]]
id = "ux-coverage"
kind = "rule"
source = "rules/ux_coverage"


[[assets]]
id = "templates"
kind = "document"
source = "templates"


[[assets]]
id = "docs-pointer"
kind = "guidance"
source = "guidance/docs-pointer.md"

[presets.core]
assets = [
    "ux-writing",
    "usecase-writing",
    "contract-authoring",
    "document-writing",
    "capability-writing",
    "architecture-writing",
    "living-spec-writing",
    "decision-writing",
    "document-reference",
    "id-convention",
    "spec-format",
    "traceability-link",
    "document-summary",
    "steering-documents",
    "ux-links",
    "ux-coverage",
    "code-entrypoints",
    "templates",
    "docs-pointer",
]

[presets.docs-skeleton]
assets = ["docs-skeleton"]
