schema = 1
name = "docs"
version = "0.1.4"
default_preset = "core"
auto_select = true
context_documents = "docs/steering"

[[assets]]
id = "contract-authoring"
kind = "instruction"
source = "instructions/contract-authoring.md"


[[assets]]
id = "living-spec-writing"
kind = "instruction"
source = "instructions/living-spec-writing.md"


[[assets]]
id = "document-writing"
kind = "instruction"
