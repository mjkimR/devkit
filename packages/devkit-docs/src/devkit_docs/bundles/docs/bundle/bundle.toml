[[assets]]
id = "decision-writing"
kind = "instruction"
source = "instructions/decision-writing.md"


[[assets]]
id = "capability-writing"
kind = "instruction"
source = "instructions/capability-writing.md"


[[assets]]
id = "usecase-writing"
kind = "instruction"
source = "instructions/usecase-writing.md"


[[assets]]
id = "ux-writing"
kind = "instruction"
source = "instructions/ux-writing.md"


[[assets]]
id = "architecture-writing"
kind = "instruction"
source = "instructions/architecture-writing.md"


[[assets]]
id = "document-reference"
kind = "rule"
source = "rules/document_reference"


[[assets]]
id = "id-convention"
kind = "rule"
