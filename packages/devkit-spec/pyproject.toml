[project]
name = "devkit-spec"
version = "0.1.5"
description = "Spec-driven development on devkit: the spec bundle and the devkit spec commands"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devkit-core==0.1.5",
    "click>=8.1.7",
    "devkit-agt==0.1.5",
    "devkit-docs==0.1.5",
]

[project.optional-dependencies]
# Dense and hybrid `devkit docs search`, through devkit-docs' search extra.
search = ["devkit-docs[search]"]

# The bundle: deployed by `devkit sync` (auto_select).
[project.entry-points."devkit.bundles"]
spec = "devkit_spec.bundles.spec"

# The command group mounted under devkit: `devkit spec ...`.
[project.entry-points."devkit.commands"]
spec = "devkit_spec.cli:cli"

# Post-finish extension: cleanup after `devkit worktree finish`: empty proposal directories and the finished task's scope record.
[project.entry-points."devkit.post_finish"]
spec = "devkit_spec.features.delivery.usecases.cleanup:after_finish"

# Integration readiness provider: `devkit integration` checks SDD completion readiness at the source SHA before approval and merge.
[project.entry-points."devkit.integration.readiness"]
spec = "devkit_spec.features.delivery.usecases.integration"

# Attach check: `devkit worktree start <branch> --existing-branch ... --unit <dir>` refuses a unit that is not the one of
# the activity branch (plan-<slug>: the proposal; dev-<slug>: the spec, or the accepted proposal before its handoff).
[project.entry-points."devkit.attach_check"]
spec = "devkit_spec.features.delivery.usecases.attach:attach_check"

# Hygiene extension: `devkit rules check -p hygiene` warns about rejected proposals still waiting for their cleanup.
[project.entry-points."devkit.hygiene"]
spec-rejected-proposals = "devkit_spec.features.governance.usecases.hygiene:rejected_proposals"

# Status overlay: `devkit docs list` shows a draft proposal whose plan-<slug> branch exists as reviewing.
[project.entry-points."devkit.docs.status_overlay"]
spec = "devkit_spec.features.proposals.services.planning:planning_overlay"

# Config template extension: `devkit config template` writes the commented [tool.spec] tables into .devkit/config.toml.
[project.entry-points."devkit.config_template"]
spec = "devkit_spec.features.policy.services.config:template"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
devkit-core = { workspace = true }
devkit-agt = { workspace = true }
devkit-docs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit_spec"]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
extraPaths = ["tests", "tests/support", "../devkit-dist/tests/support"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/devkit_spec/bundles/spec/bundle/rules"]  # a rule's tests live in its folder (`<rule>/tests/`)
pythonpath = ["tests", "tests/support", "../devkit-dist/tests/support"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"

[tool.coverage.run]
branch = true
source = ["src/devkit_spec"]

[tool.coverage.report]
show_missing = true
skip_covered = true
