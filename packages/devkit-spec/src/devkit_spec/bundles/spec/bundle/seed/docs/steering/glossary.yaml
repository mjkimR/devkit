# Synonyms for `devkit docs search`: a query containing any word of a cluster is expanded with the whole cluster.
# Project-owned; add the domain terms and the abbreviations or translations people search with.
terms:
  - primary: reconciliation
    synonyms: ["reconcile", "정합성", "정합", "동기화", "sync", "역반영"]
  - primary: session
    synonyms: ["planning-depth session", "단기 세션", "flash", "s-lane"]
  - primary: capability
    synonyms: ["역량", "기능", "cap"]
  - primary: proposal
    synonyms: ["제안서", "제안", "prop"]
  - primary: use case
    synonyms: ["usecase", "use-case", "uc", "유스케이스", "사용 사례", "story", "user story", "스토리", "사용자 스토리"]
  - primary: decision
    synonyms: ["ADR", "결정", "의사결정"]
