[tool.uv.workspace]
members = [
    "packages/*",
    "tools/*",
]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist"]
# `devkit` is a namespace package shared by devkit and devkit-advisory; without an __init__.py ruff would no
# longer see packages/*/src as the package root and would sort devkit imports as third-party.
namespace-packages = ["packages/devkit/src/devkit", "packages/devkit-advisory/src/devkit"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [
    "./packages/devkit/src",
    "./packages/devkit/tests",
    "./packages/devkit-advisory/src",
    "./packages/devkit-starter/src",
]

[dependency-groups]
dev = [
    "devkit[search]",  # numpy, tokenizers and the model package for the dense search tests and `just model-fetch`
    "hatchling>=1.25",  # type-checks the model package's build hook
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
devkit = { workspace = true }
devkit-advisory = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/devkit/tests", "packages/devkit-advisory/tests", "packages/devkit-starter/tests"]
pythonpath = ["packages/devkit/tests"]
addopts = ["--import-mode=importlib"]
log_level = "INFO"

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]
