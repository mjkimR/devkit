[tool.uv.workspace]
members = [
    "packages/*",
    "tools/*",
]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist"]
# `devkit` is a namespace package shared by devkit-dist, devkit-agt and devkit-advisory; without an __init__.py ruff
# would no longer see packages/*/src as the package root and would sort devkit imports as third-party.
namespace-packages = [
    "packages/devkit-dist/src/devkit",
    "packages/devkit/src/devkit",
    "packages/devkit-advisory/src/devkit",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [
    "./packages/devkit-dist/src",
    "./packages/devkit-dist/tests",
    "./packages/devkit/src",
    "./packages/devkit/tests",
    "./packages/devkit-advisory/src",
    "./packages/devkit-starter/src",
    "./packages/devkit-catalog/src",
    "./packages/devkit-spec/src",
    "./packages/devkit-spec/tests",
    "./packages/devkit-viewer/src",
    "./packages/devkit-viewer/tests",
]

[dependency-groups]
dev = [
    "devkit-agt[search,mcp]",  # optional runtimes exercised by tests and consumer smoke
    "devkit-spec[search]",
    "devkit-viewer",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
devkit-agt = { workspace = true }
devkit-advisory = { workspace = true }
devkit-dist = { workspace = true }
devkit-spec = { workspace = true }
devkit-viewer = { workspace = true }

[tool.pytest.ini_options]
# Rule tests live in each rule's folder under src (`<rule>/tests/`), so the devkit wheels' sources are collected too.
testpaths = [
    "packages/devkit-dist/tests",
    "packages/devkit-dist/src",
    "packages/devkit/tests",
    "packages/devkit/src",
    "packages/devkit-advisory/tests",
    "packages/devkit-starter/tests",
    "packages/devkit-catalog/tests",
    "packages/devkit-spec/tests",
    "packages/devkit-spec/src/devkit_spec/bundle/rules",
    "packages/devkit-viewer/tests",
]
pythonpath = [
    "packages/devkit-dist/tests",
    "packages/devkit/tests",
    "packages/devkit-spec/tests",
    "packages/devkit-viewer/tests",
]
addopts = ["--import-mode=importlib"]
log_level = "INFO"

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]
