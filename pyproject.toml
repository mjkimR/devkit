[tool.uv.workspace]
members = [
    "packages/*",
    "tools/*",
]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [
    "./packages/agent-advisory/src",
    "./packages/agent-rule-engine/src",
    "./packages/agent-workflow-engine/src",
    "./packages/devkit-distribution/src",
    "./packages/devkit-starter/src",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["packages/agent-rule-engine/src", "packages/agent-workflow-engine/src", "packages/devkit-distribution/src"]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]
