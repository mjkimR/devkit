[tool.uv.workspace]
members = [
    "packages/*",
    "tools/*",
]

[tool.ruff]
exclude = [".git", ".venv", "build", "dist"]
# Only devkit-advisory retains the public devkit namespace.
namespace-packages = ["packages/devkit-advisory/src/devkit"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [
    "./packages/devkit-core/src",
    "./packages/devkit-cli/src",
    "./packages/devkit-dist/src",
    "./packages/devkit-mcp/src",
    "./packages/devkit-dist/tests/support",
    "./packages/devkit/src",
    "./packages/devkit/tests/support",
    "./packages/devkit-advisory/src",
    "./packages/devkit-starter/src",
    "./packages/devkit-catalog/src",
    "./packages/devkit-docs/src",
    "./packages/devkit-docs/tests/support",
    "./packages/devkit-spec/src",
    "./packages/devkit-spec/tests/support",
    "./packages/devkit-viewer/src",
    "./packages/devkit-viewer/tests/support",
    "./tools/devkit-dev/src",
]

[dependency-groups]
dev = [
    "devkit-agt[search,mcp]",  # optional runtimes exercised by tests and consumer smoke
    "devkit-docs[search]",
    "devkit-spec[search]",
    "devkit-viewer",
    "devkit-dev",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
devkit-agt = { workspace = true }
devkit-advisory = { workspace = true }
devkit-dist = { workspace = true }
devkit-docs = { workspace = true }
devkit-embed = { path = "models/devkit-embed/wheels/devkit_embed-0.1.0-py3-none-any.whl" }
devkit-spec = { workspace = true }
devkit-viewer = { workspace = true }
devkit-dev = { workspace = true }

[tool.pytest.ini_options]
# Rule tests live in each rule's folder under src (`<rule>/tests/`), so the devkit wheels' sources are collected too.
testpaths = [
    "packages/devkit-core/tests",
    "packages/devkit-cli/tests",
    "packages/devkit-mcp/tests",
    "packages/devkit-dist/tests",
    "packages/devkit-dist/src",
    "packages/devkit/tests",
    "packages/devkit/src",
    "packages/devkit-advisory/tests",
    "packages/devkit-starter/tests",
    "packages/devkit-catalog/tests",
    "packages/devkit-catalog/src/devkit_catalog/cli_tool/bundle/rules",
    "packages/devkit-docs/tests",
    "packages/devkit-spec/tests",
    "packages/devkit-spec/src/devkit_spec/bundles/spec/bundle/rules",
    "packages/devkit-viewer/tests",
    "tools/devkit-dev/tests",
    "tools/devkit-dev/src",
]
pythonpath = [
    "packages/devkit-dist/tests/support",
    "packages/devkit/tests/support",
    "packages/devkit-docs/tests/support",
    "packages/devkit-spec/tests/support",
    "packages/devkit-viewer/tests/support",
    "tools/devkit-dev/tests",
    "tools/devkit-dev/src",
]
addopts = ["--import-mode=importlib"]
log_level = "INFO"

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]
