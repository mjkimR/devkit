schema = 1
name = "devkit-dev"
version = "0.1.3"
default_preset = "structure"

[[assets]]
id = "project-structure"
kind = "instruction"
source = "instructions/project-structure.md"

[[assets]]
id = "testing"
kind = "instruction"
source = "instructions/testing.md"

[[assets]]
id = "architecture"
kind = "rule"
source = "rules/architecture"

[[assets]]
id = "usecase-boundaries"
kind = "rule"
source = "rules/usecase-boundaries"

[presets.structure]
assets = ["project-structure", "testing", "architecture", "usecase-boundaries"]

[[assets]]
id = "handbook"
kind = "playbook"
source = "playbooks/handbook.md"

[presets.handbook]
assets = ["handbook"]
