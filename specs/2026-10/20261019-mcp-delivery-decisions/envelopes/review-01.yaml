summary: Independent medium review found two P2 issues in mandatory gate checks and setup source pinning; integration presentation preserves existing authority.
findings:
- issue: Workflow completion alone does not enforce the proposal's mandatory approval gates.
  evidence: packages/devkit-spec/src/devkit_spec/handoff_mcp.py:92
  failure_condition: When workflow.stages disables intent-proposal or direction-handoff, evaluation can report complete without the proposal's own plan-intent or plan-accept approval. An accepted status then permits Development to start.
  suggested_action: Require satisfied plan-intent and plan-accept entries in evaluation.passed_gates before displaying confirmation; add a missing-record and disabled-stage regression.
  resolution: open
  severity: P2
- issue: A base change during worktree creation can run setup from an unreviewed commit.
  evidence: packages/devkit-spec/src/devkit_spec/handoff_mcp.py:145
  failure_condition: After prepare revalidates the preview, start performs remote checks, creates from ambient HEAD and runs setup before the stale-source check. A concurrent base advance can therefore execute setup from unapproved contents.
  suggested_action: Create from the reviewed immutable SHA before setup and add a base-advance regression.
  resolution: open
  severity: P2
