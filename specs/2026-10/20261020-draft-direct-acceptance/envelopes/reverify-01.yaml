summary: 'round 1 closed; all six findings fixed in 2036edf: CRLF fence regex with a CRLF test; restore on any failure with a test; plan-accept named only with the accept command; guard narrowed to sdd-proposal (spec AC-09, CAP rule 2) with a test; added base-branch and hold tests; rewrapped. The guard narrowing and restore change are not minor fixes, so round 2 reviews the batch.'
findings:
- issue: 'accept cannot rewrite the status line of a proposal.md with CRLF line endings: _frontmatter_end does not allow ''\r'' before the closing ''---'', so _write_status finds no status line although the parser and --check accept the file.'
  evidence: packages/devkit-spec/src/devkit_spec/proposals/accept.py:279
  failure_condition: proposal.md has CRLF line endings; every check passes, then accept is refused with SPEC_PROPOSAL_INVALID 'has no status line to change'.
  suggested_action: Match the closing fence as r'^---[ \t]*\r?$' and add a CRLF case to test_the_status_line_keeps_its_comment.
  resolution: resolved
  severity: P2
- issue: After the status is written only an AdvisoryError from record_answer restores proposal.md; any other exception leaves status accepted without a gate:plan-accept record.
  evidence: packages/devkit-spec/src/devkit_spec/proposals/accept.py:181
  failure_condition: write_decision raises a non-advisory error (OSError, PermissionError); proposal.md stays accepted without its record.
  suggested_action: Restore the original bytes on any exception; re-raise a non-advisory exception after restoring; keep ProposalGateNotOpenError for AdvisoryError only.
  resolution: resolved
  severity: P3
- issue: Two guidance sentences still name devkit workflow answer --action accept as the way to record plan-accept and add the accept command only as a qualifier.
  evidence: packages/devkit-spec/src/devkit_spec/bundle/skills/spec-next/references/workflow-signals.md:9; packages/devkit-spec/src/devkit_spec/bundle/skills/spec/SKILL.md:41
  failure_condition: An agent following the first clause records plan-accept with workflow answer and gets REQUEST_UNKNOWN unless it edits the status by hand, which sdd-proposal.md forbids.
  suggested_action: Limit workflow answer --action accept to plan-intent and decline to both gates; name devkit spec proposal accept as the only command accepting plan-accept.
  resolution: resolved
  severity: P3
- issue: The handoff guard covers a bundle bound to any workflow, broader than the ADR's 'bound to sdd-proposal'.
  evidence: packages/devkit-spec/src/devkit_spec/proposals/handoff.py:295; docs/decisions/2026-10/20261020-direct-acceptance-command-and-handoff-guard.md:96
  failure_condition: A proposal bound to another workflow without a plan-accept gate can never be handed off and accept cannot record the gate.
  suggested_action: Narrow the guard to the sdd-proposal binding as the ADR states, or keep the broader rule and say so in reconcile.md.
  resolution: resolved
  severity: P3
- issue: 'Some AC-02/AC-03 cases lack tests and test_the_base_branch_without_origin_head_is_the_main_worktrees is misnamed: no hand-made branch without origin/HEAD, no plan-* checkout, no pending-question or malformed-worker hold.'
